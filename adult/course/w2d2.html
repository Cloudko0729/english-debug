<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>W2 週二 — 核心句練習</title>
<style>
  body{font-family:"Segoe UI","Microsoft JhengHei","Noto Sans TC",sans-serif;max-width:660px;margin:0 auto;padding:0 16px 60px;background:#f4f6fb;color:#1a1a2e;line-height:1.7}
  header{background:#1f4463;color:#fff;text-align:center;padding:16px;border-radius:0 0 16px 16px;margin:0 -16px 14px}
  header h1{margin:0;font-size:1.15rem} header p{margin:5px 0 0;font-size:.8rem;opacity:.85}
  header a{color:#9fd0ff;text-decoration:none;font-weight:700}
  .q{background:#fff;border-radius:14px;padding:14px 16px;margin-top:12px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
  .q .qt{font-weight:700;margin-bottom:8px;font-size:.93rem}
  .q button{display:block;width:100%;text-align:left;padding:10px 13px;border:2px solid #d9e2ec;border-radius:10px;background:#fff;font-weight:600;cursor:pointer;margin:5px 0;font-size:.9rem;font-family:inherit}
  .q button.ok{border-color:#2a9d5c;background:#e3f6ec}
  .q button.no{border-color:#d64561;background:#fbe3e9}
  .why{display:none;margin-top:6px;background:#eaf3ff;border-radius:9px;padding:8px 12px;font-size:.84rem;color:#1f4463}
  #result{font-weight:800;font-size:1.05rem;margin-top:12px;text-align:center;min-height:1.5em}
</style>
</head>
<body>
<header><h1>✏️ W2 週二 — 核心句練習</h1>
<p><a href="w2.html">← 本週重點</a> · 5 個核心句的變化題（中翻英＋填空）</p></header>
<div id="qs"></div><div id="result"></div>
<script>
const QUIZ = [
 {
   q: "「謝謝你來信詢問電源供應器的問題」怎麼寫？",
   c: ["Thanks you send email about power supply.", "Thank you for reaching out regarding the power supply issue.", "Thank you reach out about power supply."],
   a: 1,
   why: "reach out regarding＋主題，regarding 不能省。"
 },
 {
   q: "填空：Thank you for reaching out ___ the shipment delay.",
   c: ["regarding", "to", "for"],
   a: 0,
   why: "同一句型換主題照樣用：regarding＋任何事件。"
 },
 {
   q: "「我們收到你的詢問了，會馬上處理」：",
   c: ["We got your inquiry and will look it right away.", "We have received your inquiry and will look into it right away.", "We receive your inquiry, will check it right away."],
   a: 1,
   why: "have received 是完成式；look into it，into 不能省。"
 },
 {
   q: "填空：We have received your quotation request and will ___ into it right away.",
   c: ["check", "look", "see"],
   a: 1,
   why: "look into 是固定搭配，不能換成 check into 或 see into。"
 },
 {
   q: "「確認一下，你是要我們檢查電源供應器，對嗎？」：",
   c: ["Confirm you ask us check power supply?", "To confirm, you would like us to check the power supply — is that correct?", "To confirm you want check power supply, right?"],
   a: 1,
   why: "To confirm, 後面接完整句子；want us to check，別漏 to。"
 },
 {
   q: "填空：To confirm, you would like us ___ check the shipping address — is that correct?",
   c: ["to", "with", "for"],
   a: 0,
   why: "want/would like ＋人＋to＋原形動詞。"
 },
 {
   q: "「我們最晚明天會回覆你更詳細的內容」：",
   c: ["We will reply you more details tomorrow.", "We answer you detail by tomorrow.", "We will get back to you with more details by tomorrow."],
   a: 2,
   why: "reply 不能直接接人當受詞；get back to you 才對。"
 },
 {
   q: "填空：We will get back to you ___ the test result by Friday.",
   c: ["of", "with", "for"],
   a: 1,
   why: "get back to you with＋內容，固定搭配。"
 },
 {
   q: "「如果有其他我們該知道的資訊，請告訴我們」：",
   c: ["If you have other information please say to us.", "Please tell us if have different information.", "Please let us know if there is any additional information we should know."],
   a: 2,
   why: "if 子句要有主詞 there；additional information 才是「額外資訊」。"
 },
 {
   q: "組合題：確認回覆信第一句＋最後一句的正確組合是？",
   c: ["Please let us know. ⋯ Thank you for reaching out.", "To confirm, is that correct? ⋯ Thanks your email.", "Thank you for reaching out regarding the issue. ⋯ Please let us know if there is any additional information we should know."],
   a: 2,
   why: "開場點題→確認理解→承諾回覆→邀請補充，是確認回覆信最穩的骨架。"
 }
];
let done = 0, ok = 0;
document.getElementById("qs").innerHTML = QUIZ.map((q, i) => `<div class="q" id="q${i}"><div class="qt">${i + 1}. ${q.q}</div>` +
  q.c.map((c, ci) => `<button onclick="ans(${i},${ci},this)">${c}</button>`).join("") +
  `<div class="why" id="w${i}">💡 ${q.why}</div></div>`).join("");
function ans(i, ci, btn) {
  const box = document.getElementById("q" + i); if (box.dataset.done) return; box.dataset.done = "1";
  const good = ci === QUIZ[i].a;
  box.querySelectorAll("button").forEach((b, bi) => { b.disabled = true;
    if (bi === QUIZ[i].a) b.classList.add("ok"); else if (bi === ci) b.classList.add("no"); });
  document.getElementById("w" + i).style.display = "block";
  done++; if (good) ok++;
  if (done === QUIZ.length) {
    document.getElementById("result").textContent = `🎉 答對 ${ok} / ${QUIZ.length}`;
    try { const p = JSON.parse(localStorage.getItem("adultProgress") || "{}"); p["w2d2"] = { done: new Date().toISOString(), ok, total: QUIZ.length }; localStorage.setItem("adultProgress", JSON.stringify(p)); } catch (e) {}
  }
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>W6 週二 — 核心句練習</title>
<style>
  body{font-family:"Segoe UI","Microsoft JhengHei","Noto Sans TC",sans-serif;max-width:660px;margin:0 auto;padding:0 16px 60px;background:#f4f6fb;color:#1a1a2e;line-height:1.7}
  header{background:#1f4463;color:#fff;text-align:center;padding:16px;border-radius:0 0 16px 16px;margin:0 -16px 14px}
  header h1{margin:0;font-size:1.15rem} header p{margin:5px 0 0;font-size:.8rem;opacity:.85}
  header a{color:#9fd0ff;text-decoration:none;font-weight:700}
  .q{background:#fff;border-radius:14px;padding:14px 16px;margin-top:12px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
  .q .qt{font-weight:700;margin-bottom:8px;font-size:.93rem}
  .q button{display:block;width:100%;text-align:left;padding:10px 13px;border:2px solid #d9e2ec;border-radius:10px;background:#fff;font-weight:600;cursor:pointer;margin:5px 0;font-size:.9rem;font-family:inherit}
  .q button.ok{border-color:#2a9d5c;background:#e3f6ec}
  .q button.no{border-color:#d64561;background:#fbe3e9}
  .why{display:none;margin-top:6px;background:#eaf3ff;border-radius:9px;padding:8px 12px;font-size:.84rem;color:#1f4463}
  #result{font-weight:800;font-size:1.05rem;margin-top:12px;text-align:center;min-height:1.5em}
</style>
</head>
<body>
<header><h1>✏️ W6 週二 — 核心句練習</h1>
<p><a href="w6.html">← 本週重點</a> · 5 個核心句的變化題（中翻英＋填空）</p></header>
<div id="qs"></div><div id="result"></div>
<script>
const QUIZ = [
 { q: "1. 中翻英：我理解費用比預期高。",
   c: ["I know you feel expensive.", "I understand the cost is higher than expected.", "I understand the cost is very expensive for you."],
   a: 1, why: "higher than expected 中性；feel expensive 文法與語氣都有問題。" },
 { q: "2. 填空：The quotation ___ three replacement parts and about four hours of labor.",
   c: ["is include", "covers", "including"],
   a: 1, why: "covers 是報價說明最常用的動詞；is include 兩個動詞並排是錯的。" },
 { q: "3. 中翻英：如果只維修故障的那個通道，費用可以降低。",
   c: ["The cost can down if we repair one channel only.", "We can more cheap if only repair one channel.", "We can reduce the cost if we repair only the failing channel."],
   a: 2, why: "reduce the cost 是標準說法；more cheap 不是比較級，down 不能當動詞。" },
 { q: "4. 填空：Unfortunately, we are not able to ___ the price further.",
   c: ["cheap", "down", "lower"],
   a: 2, why: "lower 當動詞＝降低。down 和 cheap 都不能這樣用。" },
 { q: "5. 中翻英：需要我們報另一個方案讓您比較嗎？",
   c: ["Do you need we quote another option to compare?", "Would you like us to quote the alternative option for comparison?", "Do you want I quote other option?"],
   a: 1, why: "Would you like us to＋原形，是請示對方意願的標準句型。" },
 { q: "6. 客戶說「你們比別家貴 20%」，最好的第一句回應是？",
   c: ["Other companies use cheap parts.", "Let me explain what our quotation covers, and we can compare item by item.", "Then please go to the other company."],
   a: 1, why: "把話題拉回「內容比較」而不是「價格比較」，才有機會說明差異。" },
 { q: "7. 「four hours of labor」哪裡容易寫錯？",
   c: ["hour 要用複數 hours，中間要有 of", "four 要寫成 4", "labor 要用複數"],
   a: 0, why: "數量＋單位＋of＋不可數名詞：four hours of labor。" },
 { q: "8. 哪一句最適合用來守住價格底線？",
   c: ["No discount, this is final.", "We are not able to lower the price further at this stage.", "Sorry we cannot down the price."],
   a: 1, why: "委婉但明確，而且 at this stage 沒把話說死。" },
 { q: "9. 填空：___ the cost is higher than expected, let me explain what it covers.",
   c: ["I understand", "I feel", "I know you think"],
   a: 0, why: "I understand 表達理解而不評價對方；後兩者都帶了主觀判斷。" },
 { q: "10. 議價信最不該做的是什麼？",
   c: ["提出替代方案", "直接答應降價而不縮小範圍", "拆解費用組成"],
   a: 1, why: "無條件降價會讓對方認為原價有水分，下次一定再殺一次。" }
];
let done = 0, ok = 0;
document.getElementById("qs").innerHTML = QUIZ.map((q, i) => `<div class="q" id="q${i}"><div class="qt">${i + 1}. ${q.q}</div>` +
  q.c.map((c, ci) => `<button onclick="ans(${i},${ci},this)">${c}</button>`).join("") +
  `<div class="why" id="w${i}">💡 ${q.why}</div></div>`).join("");
function ans(i, ci, btn) {
  const box = document.getElementById("q" + i); if (box.dataset.done) return; box.dataset.done = "1";
  const good = ci === QUIZ[i].a;
  box.querySelectorAll("button").forEach((b, bi) => { b.disabled = true;
    if (bi === QUIZ[i].a) b.classList.add("ok"); else if (bi === ci) b.classList.add("no"); });
  document.getElementById("w" + i).style.display = "block";
  done++; if (good) ok++;
  if (done === QUIZ.length) {
    document.getElementById("result").textContent = `🎉 答對 ${ok} / ${QUIZ.length}`;
    try { const p = JSON.parse(localStorage.getItem("adultProgress") || "{}"); p["w6d2"] = { done: new Date().toISOString(), ok, total: QUIZ.length }; localStorage.setItem("adultProgress", JSON.stringify(p)); } catch (e) {}
  }
}
</script>
</body>
</html>

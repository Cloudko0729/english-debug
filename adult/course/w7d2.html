<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>W7 週二 — 核心句練習</title>
<style>
  body{font-family:"Segoe UI","Microsoft JhengHei","Noto Sans TC",sans-serif;max-width:660px;margin:0 auto;padding:0 16px 60px;background:#f4f6fb;color:#1a1a2e;line-height:1.7}
  header{background:#1f4463;color:#fff;text-align:center;padding:16px;border-radius:0 0 16px 16px;margin:0 -16px 14px}
  header h1{margin:0;font-size:1.15rem} header p{margin:5px 0 0;font-size:.8rem;opacity:.85}
  header a{color:#9fd0ff;text-decoration:none;font-weight:700}
  .q{background:#fff;border-radius:14px;padding:14px 16px;margin-top:12px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
  .q .qt{font-weight:700;margin-bottom:8px;font-size:.93rem}
  .q button{display:block;width:100%;text-align:left;padding:10px 13px;border:2px solid #d9e2ec;border-radius:10px;background:#fff;font-weight:600;cursor:pointer;margin:5px 0;font-size:.9rem;font-family:inherit}
  .q button.ok{border-color:#2a9d5c;background:#e3f6ec}
  .q button.no{border-color:#d64561;background:#fbe3e9}
  .why{display:none;margin-top:6px;background:#eaf3ff;border-radius:9px;padding:8px 12px;font-size:.84rem;color:#1f4463}
  #result{font-weight:800;font-size:1.05rem;margin-top:12px;text-align:center;min-height:1.5em}
</style>
</head>
<body>
<header><h1>✏️ W7 週二 — 核心句練習</h1>
<p><a href="w7.html">← 本週重點</a> · 5 個核心句的變化題（中翻英＋填空）</p></header>
<div id="qs"></div><div id="result"></div>
<script>
const QUIZ = [
 { q: "1. 中翻英：請先填寫附件的 RMA 表單再寄回設備。",
   c: ["Please fill in the attached RMA form before shipping the unit back.", "Please fill the RMA form before you ship back the unit.", "Please write the attach RMA form before ship the unit."],
   a: 0, why: "fill in＋表單；before＋動名詞 shipping。" },
 { q: "2. 填空：We have ___ RMA number R-24081 for this case.",
   c: ["issued", "issue", "issuing"],
   a: 0, why: "have＋過去分詞 issued，表示編號已經開出來了。" },
 { q: "3. 中翻英：請將 RMA 編號清楚標示在外箱上。",
   c: ["Please mark the RMA number clearly on the outside of the package.", "Please write RMA number on outside package.", "Please mark clearly RMA number outside of package."],
   a: 0, why: "the RMA number 要限定詞；on the outside of the package 是完整說法。" },
 { q: "4. 填空：The unit should be ___ in its original box.",
   c: ["packed", "pack", "packing"],
   a: 0, why: "設備是被包裝，用被動 should be packed。" },
 { q: "5. 中翻英：設備一到我們會以 email 確認。",
   c: ["Once we receive the unit, we will confirm by email.", "After we receive, we confirm you by mail.", "When we received the unit, we confirm by email."],
   a: 0, why: "Once＋現在式；confirm 不接人；email 要寫 by email。" },
 { q: "6. 「or equivalent protective packaging」中的 equivalent 是什麼意思？",
   c: ["同等級的（替代品）", "額外的", "昂貴的"],
   a: 0, why: "equivalent＝同等的，用來給對方替代方案。" },
 { q: "7. 客戶說原廠箱子已經丟了，怎麼回？",
   c: ["Any box with equivalent protective packaging is fine.", "Then you cannot ship it.", "You must find the original box."],
   a: 0, why: "給替代方案讓事情繼續，不要卡住對方。" },
 { q: "8. 填空：Please let us know the tracking number once the unit ___.",
   c: ["is shipped", "ships out", "was shipped"],
   a: 0, why: "設備是被寄出，用被動 is shipped；once 子句用現在式表未來。" },
 { q: "9. 哪一句最適合用來說明 RMA 編號的用途？",
   c: ["Please quote this RMA number in all future correspondence.", "This number is just for our record.", "You can ignore the RMA number."],
   a: 0, why: "quote this number in all future correspondence 讓對方知道以後每封信都要帶上。" },
 { q: "10. RMA 通知信最容易漏掉的是什麼？",
   c: ["標示位置（外箱）與包裝要求", "問候語", "公司名稱"],
   a: 0, why: "漏掉標示與包裝要求，設備到廠常常認不出是哪一案，或途中就摔壞了。" }
];
let done = 0, ok = 0;
document.getElementById("qs").innerHTML = QUIZ.map((q, i) => `<div class="q" id="q${i}"><div class="qt">${i + 1}. ${q.q}</div>` +
  q.c.map((c, ci) => `<button onclick="ans(${i},${ci},this)">${c}</button>`).join("") +
  `<div class="why" id="w${i}">💡 ${q.why}</div></div>`).join("");
function ans(i, ci, btn) {
  const box = document.getElementById("q" + i); if (box.dataset.done) return; box.dataset.done = "1";
  const good = ci === QUIZ[i].a;
  box.querySelectorAll("button").forEach((b, bi) => { b.disabled = true;
    if (bi === QUIZ[i].a) b.classList.add("ok"); else if (bi === ci) b.classList.add("no"); });
  document.getElementById("w" + i).style.display = "block";
  done++; if (good) ok++;
  if (done === QUIZ.length) {
    document.getElementById("result").textContent = `🎉 答對 ${ok} / ${QUIZ.length}`;
    try { const p = JSON.parse(localStorage.getItem("adultProgress") || "{}"); p["w7d2"] = { done: new Date().toISOString(), ok, total: QUIZ.length }; localStorage.setItem("adultProgress", JSON.stringify(p)); } catch (e) {}
  }
}
</script>
</body>
</html>

<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Debug 流程英文寫法</title><style>
body{font-family:"Segoe UI","Microsoft JhengHei","Noto Sans TC",sans-serif;max-width:720px;margin:0 auto;padding:0 14px 60px;background:#f4f6fb;color:#1a1a2e}
header{background:#1f4463;color:#fff;text-align:center;padding:18px;border-radius:0 0 16px 16px;margin:0 -14px 12px}
header h1{margin:0;font-size:1.2rem} header p{margin:6px 0 0;font-size:.8rem;opacity:.85}
header a{color:#9fd0ff;text-decoration:none;font-weight:700}
h2{font-size:.82rem;color:#41618a;margin:18px 0 8px;letter-spacing:.04em}
.fmt{background:#14324a;color:#eaf3fb;border-radius:12px;padding:13px 15px;margin-bottom:6px}
.fmt .chain{display:flex;flex-wrap:wrap;gap:5px;align-items:center;font-size:.82rem;font-weight:700}
.fmt .step{background:rgba(255,255,255,.13);border-radius:6px;padding:3px 9px;white-space:nowrap}
.fmt .arw{opacity:.5}
.fmt .zh{font-size:.75rem;opacity:.75;margin-top:7px;line-height:1.7}
.note{font-size:.78rem;color:#666;margin:0 0 12px;line-height:1.7}
#bar{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
#bar button{padding:6px 13px;border:2px solid #d9e2ec;border-radius:16px;background:#fff;font-weight:700;cursor:pointer;font-size:.8rem}
#bar button.on{border-color:#1f4463;background:#1f4463;color:#fff}
.c{background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:9px;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.c .hd{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.c .ti{font-weight:800;font-size:.98rem;color:#14324a}
.c .tz{color:#777;font-size:.82rem}
.c .cat{font-size:.68rem;background:#eef3fa;color:#41618a;border-radius:5px;padding:2px 7px;margin-left:auto;white-space:nowrap}
.c .fl{margin-top:7px;font-size:.9rem;color:#17405e;background:#f6f9fd;border-left:3px solid #9fc3e8;border-radius:0 8px 8px 0;padding:7px 11px;cursor:pointer;line-height:1.75}
.c .flz{font-size:.78rem;color:#8a949e;margin-top:3px;padding-left:12px;line-height:1.7}
.c details{margin-top:8px}
.c summary{font-size:.76rem;color:#41618a;cursor:pointer;font-weight:700;list-style:none}
.c summary::-webkit-details-marker{display:none}
.c summary::before{content:"▸ ";}
.c details[open] summary::before{content:"▾ ";}
.c .raw{font-family:Consolas,"Courier New",monospace;font-size:.78rem;color:#9a6b3f;background:#fffaf3;border-left:3px solid #e8c89a;border-radius:0 6px 6px 0;padding:6px 10px;margin-top:6px;white-space:pre-wrap;word-break:break-word}
.c .fix{font-size:.8rem;color:#3c4a58;margin-top:6px;line-height:1.75}
.p{background:#fff;border-radius:10px;padding:9px 13px;margin-bottom:7px;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.p .pe{font-weight:800;color:#14324a;font-size:.92rem;cursor:pointer}
.p .pz{color:#666;font-size:.82rem;margin-left:8px}
.p .pn{font-size:.78rem;color:#7a838d;margin-top:3px;line-height:1.7}
#stat{font-size:.78rem;color:#666;margin:6px 0}
</style></head><body>
<header><h1>🧭 Debug 流程英文寫法</h1>
<p><a href="index.html">← 課程目錄</a> · 14 則真實維修紀錄改寫 · 點英文發音</p></header>

<div class="fmt">
  <div class="chain" id="chain"></div>
  <div class="zh" id="chainZh"></div>
</div>
<p class="note">工程紀錄不用寫成完整句子。<b>issue tracking／debug log／FA report</b> 本來就是箭頭式的，
硬湊成句子反而不像業界寫法。對外的 email 用句型庫，對內的紀錄用這一頁。</p>

<h2>案例</h2>
<div id="bar"></div><div id="stat"></div><div id="list"></div>

<h2>反覆出現的講法</h2>
<div id="phr"></div>

<script src="debug_flow.js"></script>
<script>
var fc="all";
var CAT_ZH={cal:"🎯 校正",power:"⚡ 電源",solder:"🔥 焊接",code:"💻 程式",
            memory:"🧠 記憶體",timeout:"⏱️ 逾時",missing:"🔍 偵測不到",data:"📄 資料"};

var f=DEBUG_FLOW_FORMAT;
document.getElementById("chain").innerHTML=
  f.en.map(function(s){return '<span class="step">'+s+'</span>';}).join('<span class="arw">→</span>');
document.getElementById("chainZh").textContent=f.zh.join(" → ")+"　·　"+f.note;

function esc(s){return String(s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}

function draw(){
  var b='<button class="'+(fc==="all"?"on":"")+'" onclick="fc=\'all\';draw()">全部</button>';
  Object.keys(CAT_ZH).forEach(function(c){
    if(!DEBUG_FLOW.some(function(d){return d.cat===c;}))return;
    b+='<button class="'+(fc===c?"on":"")+'" onclick="fc=\''+c+'\';draw()">'+CAT_ZH[c]+'</button>';
  });
  document.getElementById("bar").innerHTML=b;
  var rows=DEBUG_FLOW.filter(function(d){return fc==="all"||d.cat===fc;});
  document.getElementById("stat").textContent="顯示 "+rows.length+" / "+DEBUG_FLOW.length+" 則";
  document.getElementById("list").innerHTML=rows.map(function(d){
    return '<div class="c"><div class="hd"><span class="ti">'+esc(d.title)+'</span>'+
      '<span class="tz">'+esc(d.zh)+'</span>'+
      '<span class="cat">'+(CAT_ZH[d.cat]||d.cat)+'</span></div>'+
      '<div class="fl" onclick="say(\'f'+d.id+'\')">'+esc(d.flow)+'</div>'+
      '<div class="flz">'+esc(d.flow_zh)+'</div>'+
      '<details><summary>原本怎麼寫的</summary>'+
      '<div class="raw">'+esc(d.raw)+'</div>'+
      '<div class="fix">'+esc(d.fix)+'</div></details></div>';
  }).join("");
}

document.getElementById("phr").innerHTML=DEBUG_FLOW_PHRASES.map(function(p,i){
  return '<div class="p"><span class="pe" onclick="say(\'p'+(i+1)+'\')">'+esc(p.en)+'</span>'+
    '<span class="pz">'+esc(p.zh)+'</span><div class="pn">'+esc(p.note)+'</div></div>';
}).join("");

var cur=null;
function say(key){
  if(cur){cur.pause();cur=null;}
  var a=new Audio("audio/debug_flow/"+key+".mp3");
  cur=a; a.play().catch(function(){});
}
draw();
</script></body></html>

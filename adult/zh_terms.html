<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>中文維修詞 → 英語速查</title><style>
body{font-family:"Segoe UI","Microsoft JhengHei","Noto Sans TC",sans-serif;max-width:720px;margin:0 auto;padding:0 14px 60px;background:#f4f6fb;color:#1a1a2e}
header{background:#1f4463;color:#fff;text-align:center;padding:18px;border-radius:0 0 16px 16px;margin:0 -14px 12px}
header h1{margin:0;font-size:1.2rem} header p{margin:6px 0 0;font-size:.8rem;opacity:.85}
header a{color:#9fd0ff;text-decoration:none;font-weight:700}
#search{width:100%;box-sizing:border-box;padding:11px 14px;border:2px solid #d9e2ec;border-radius:12px;font-size:1rem;margin:8px 0}
.t{background:#fff;border-radius:12px;padding:11px 14px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.t .hd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.t .zh{font-weight:800;font-size:1.05rem;color:#14324a}
.t .en{color:#1f4463;font-weight:700;font-size:.95rem;cursor:pointer}
.t .ex{margin-top:5px;font-size:.88rem;color:#2c4a68;background:#f6f9fd;border-left:3px solid #9fc3e8;border-radius:0 8px 8px 0;padding:5px 11px;cursor:pointer}
#stat{font-size:.78rem;color:#666;margin:4px 0 8px}
</style></head><body>
<header><h1>🀄 中文維修詞 → 英語速查</h1>
<p><a href="index.html">← 課程目錄</a> · 你天天講的維修詞，英文這樣說 · 點英文或例句發音</p></header>
<input id="search" placeholder="🔍 搜中文或英文（例：返修、spare）" oninput="draw(this.value)">
<div id="stat"></div><div id="list"></div>
<script src="zh_terms.js"></script>
<script>
function draw(kw){
  kw=(kw||'').trim().toLowerCase();
  const rows=ZH_TERMS.filter(t=>!kw||t.zh.includes(kw)||t.en.toLowerCase().includes(kw)||t.example.toLowerCase().includes(kw));
  document.getElementById('stat').textContent='顯示 '+rows.length+' / '+ZH_TERMS.length+' 條';
  document.getElementById('list').innerHTML=rows.map(t=>
    '<div class="t"><div class="hd"><span class="zh">'+t.zh+'</span><span class="en" onclick="say(this.textContent)">'+t.en+'</span></div>'+
    '<div class="ex" onclick="say(this.textContent)">'+t.example+'</div></div>').join('');
}
function say(s){const u=new SpeechSynthesisUtterance(s.split('/')[0]);u.lang='en-US';u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u);}
draw('');
</script></body></html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English Learning Hub</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: "Segoe UI", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
      min-height: 100vh; margin: 0;
      background: linear-gradient(160deg, #1a2540 0%, #24345c 60%, #2f4a7a 100%);
      color: #eef1ff;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 30px 16px;
    }
    header { text-align: center; margin-bottom: 34px; }
    header h1 { font-size: 1.6rem; margin: 0 0 8px; }
    header p { font-size: .88rem; color: #aab6d8; margin: 0; }
    .portal { display: flex; gap: 22px; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 760px; }
    .gate {
      flex: 1; min-width: 280px; max-width: 350px;
      border-radius: 22px; padding: 30px 26px;
      text-decoration: none; color: inherit; text-align: center;
      transition: transform .15s, box-shadow .15s;
      box-shadow: 0 6px 24px rgba(0,0,0,.25);
    }
    .gate:hover { transform: translateY(-4px); box-shadow: 0 12px 32px rgba(0,0,0,.35); }
    .gate .big { font-size: 3.2rem; }
    .gate h2 { font-size: 1.3rem; margin: 12px 0 8px; }
    .gate p { font-size: .84rem; margin: 0; line-height: 1.7; opacity: .92; }
    .gate .tags { margin-top: 14px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
    .gate .tag { font-size: .7rem; font-weight: 700; border-radius: 6px; padding: 3px 9px; background: rgba(255,255,255,.22); }
    .adult { background: linear-gradient(150deg, #2c5f8a, #1f4463); color: #eaf6ff; }
    .kids  { background: linear-gradient(150deg, #ffb703, #f28c1b); color: #3a2400; }
    .k9    { background: linear-gradient(150deg, #2fbf71, #1f8a54); color: #eaffef; }
    footer { margin-top: 34px; font-size: .74rem; color: #7d89ad; text-align: center; }
    footer a { color: #9fb4e0; text-decoration: none; }
  </style>
</head>
<body>

<header>
  <h1>🌐 English Learning Hub</h1>
  <p>全家的英文訓練系統</p>
</header>

<div class="portal">
  <a class="gate adult" href="adult/index.html">
    <div class="big">💼</div>
    <h2>商用英語</h2>
    <p>工作英文 · 從真實信件出發<br>Email／客戶接待口說／電話視訊對話</p>
    <div class="tags"><span class="tag">郵件</span><span class="tag">口說介紹</span><span class="tag">對話</span><span class="tag">每日 10 分鐘</span></div>
  </a>
  <a class="gate kids" href="kids/index.html">
    <div class="big">🌟</div>
    <h2>兒童英語</h2>
    <p>Albert / Jonathan / Ryder<br>每日測驗 · 文法根基 · 單字圖鑑 · 我的島嶼</p>
    <div class="tags"><span class="tag">每日測驗</span><span class="tag">文法課程</span><span class="tag">島嶼遊戲</span><span class="tag">打字</span></div>
  </a>
  <a class="gate k9" href="k9/index.html">
    <div class="big">🌱</div>
    <h2>國小～國中 9 級課程</h2>
    <p>給其他家長小孩用<br>Lv.1～Lv.9 · 每級 8 週 · 不考試</p>
    <div class="tags"><span class="tag">聽說優先</span><span class="tag">文法Lv.4起</span><span class="tag">錄音作品</span><span class="tag">無帳號</span></div>
  </a>
</div>

<footer>English Debug Repo · <a href="adult/legacy.html">商用英語舊版練習</a></footer>

</body>
</html>

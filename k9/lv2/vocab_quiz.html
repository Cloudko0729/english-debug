<div class="card"><h2 style="color:#5b7cfa">字彙池練習</h2><p class="intro">從 Lv.2 字彙池（101 字，不限本級 8 週課程教過的字）隨機出題：看例句、聽發音，選出正確的中文意思。每次練習抽 12 題，可以一直重來抽到不同的字。</p>

n":"ship","zh":"船","audio":"pool_ship","sentHtml":"The <b>ship</b> sailed across the ocean."},{"en":"shirt","zh":"襯衫","audio":"pool_shirt","sentHtml":"He wears a blue <b>shirt</b>."},{"en":"short","zh":"短的","audio":"pool_short","sentHtml":"My hair is <b>short</b>."},{"en":"shy","zh":"害羞的","audio":"pool_shy","sentHtml":"The little boy is <b>shy</b>."},{"en":"sing","zh":"唱歌","audio":"pool_sing","sentHtml":"She loves to <b>sing</b> songs."},{"en":"singer","zh":"歌手","audio":"pool_singer","sentHtml":"My sister wants to be a <b>singer</b>."},{"en":"sister","zh":"姊妹","audio":"pool_sister","sentHtml":"My <b>sister</b> is eight years old."},{"en":"slow","zh":"慢的","audio":"pool_slow","sentHtml":"The turtle is very <b>slow</b>."},{"en":"small","zh":"小的","audio":"pool_small","sentHtml":"The mouse is very <b>small</b>."},{"en":"sofa","zh":"沙發","audio":"pool_sofa","sentHtml":"We sat on the <b>sofa</b>."},{"en":"son","zh":"兒子","audio":"pool_son","sentHtml":"He is their only <b>son</b>."},{"en":"song","zh":"歌曲","audio":"pool_song","sentHtml":"This is my favorite <b>song</b>."},{"en":"soup","zh":"湯","audio":"pool_soup","sentHtml":"The <b>soup</b> is warm and tasty."},{"en":"stand","zh":"站","audio":"pool_stand","sentHtml":"Please <b>stand</b> up."},{"en":"store","zh":"商店","audio":"pool_store","sentHtml":"We bought bread at the <b>store</b>."},{"en":"student","zh":"學生","audio":"pool_student","sentHtml":"I am a <b>student</b> at this school."},{"en":"study","zh":"讀書；學習","audio":"pool_study","sentHtml":"I <b>study</b> English every night."},{"en":"table","zh":"桌子","audio":"pool_table","sentHtml":"Put the plate on the <b>table</b>."},{"en":"talk","zh":"說話","audio":"pool_talk","sentHtml":"Let's <b>talk</b> about the trip."},{"en":"teacher","zh":"老師","audio":"pool_teacher","sentHtml":"My <b>teacher</b> is very kind."},{"en":"thank","zh":"感謝","audio":"pool_thank","sentHtml":"<b>Thank</b> you for your help."},{"en":"these","zh":"這些","audio":"pool_these","sentHtml":"<b>These</b> are my new sh const N=Math.min(12,POOL.length);
let session=[],qi=0,score=0;
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function startQuiz(){
  session=shuffle(POOL).slice(0,N); qi=0; score=0;
  document.getElementById("result").textContent="";
  document.getElementById("again").style.display="none";
  document.getElementById("qcount").textContent="";
  renderQ();
}
function renderQ(){
  const area=document.getElementById("quizArea");
  if(qi>=session.length){
    area.innerHTML=""; document.getElementById("qstatus").textContent="";
    document.getElementById("result").textContent="🎉 完成！答對 "+score+" / "+session.length;
    document.getElementById("again").style.display="block";
    return;
  }
  const q=session[qi];
  const distractors=shuffle(POOL.filter(p=>p.en!==q.en)).slice(0,3).map(p=>p.zh);
  const choices=shuffle(distractors.concat([q.zh]));
  area.innerHTML='<div class="sent">'+q.sentHtml+'</div>'+
    '<button class="playbtn" style="background:#5b7cfa" onclick="playAudio(\''+q.audio+'\')">🔊 聽這個字的發音</button>'+
    '<div class="choices">'+choices.map(c=>'<button onclick="answer(this,\''+c.replace(/'/g,"\\'")+'\')">'+esc(c)+'</button>').join("")+'</div>';
  document.getElementById("qstatus").textContent="第 "+(qi+1)+" / "+session.length+" 題";
  document.getElementById("qcount").textContent="本級字彙池共 "+POOL.length+" 字，慢慢都會抽到。";
}
function answer(btn,c){
  const q=session[qi];
  document.querySelectorAll(".choices button").forEach(b=>b.disabled=true);
  if(c===q.zh){btn.classList.add("correct");score++;}
  else{btn.classList.add("wrong");
    document.querySelectorAll(".choices button").forEach(b=>{if(b.textContent===q.zh)b.classList.add("correct");});
  }
  setTimeout(()=>{qi++;renderQ();},1100);
}
function playAudio(name){new Audio("audio/"+name+".mp3").play().catch(()=>{});}
</script>

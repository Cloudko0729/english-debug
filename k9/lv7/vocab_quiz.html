r","zh":"戰爭、鬥爭","audio":"pool_war","sentAudio":"pool_sent_war","sentHtml":"The museum has exhibits about the <b>war</b>."},{"en":"waste","zh":"浪費","audio":"pool_waste","sentAudio":"pool_sent_waste","sentHtml":"Don't <b>waste</b> your food."},{"en":"way","zh":"方式","audio":"pool_way","sentAudio":"pool_sent_way","sentHtml":"This is the <b>way</b> to the station."},{"en":"wedding","zh":"婚禮","audio":"pool_wedding","sentAudio":"pool_sent_wedding","sentHtml":"We attended their <b>wedding</b> last month."},{"en":"western","zh":"西的、西方的、來自西方的人、有西方特徵的","audio":"pool_western","sentAudio":"pool_sent_western","sentHtml":"They live in the <b>western</b> part of the city."},{"en":"whatever","zh":"無論什麼、不管什麼(pron)  不管怎樣的、無論什麼樣的","audio":"pool_whatever","sentAudio":"pool_sent_whatever","sentHtml":"You can choose <b>whatever</b> you like."},{"en":"while","zh":"在(當)…的時候、和…同時","audio":"pool_while","sentAudio":"pool_sent_while","sentHtml":"<b>While</b> I was reading, the phone rang."},{"en":"whole","zh":"全部的、整體的(adj)  全部、整體","audio":"pool_whole","sentAudio":"pool_sent_whole","sentHtml":"I ate the <b>whole</b> apple."},{"en":"wild","zh":"野生的、未馴化的、荒蕪的、瘋狂的","audio":"pool_wild","sentAudio":"pool_sent_wild","sentHtml":"The <b>wild</b> animals live in the forest."},{"en":"wine","zh":"(葡萄)酒","audio":"pool_wine","sentAudio":"pool_sent_wine","sentHtml":"My parents had a glass of <b>wine</b>."},{"en":"without","zh":"沒有","audio":"pool_without","sentAudio":"pool_sent_without","sentHtml":"I can't live <b>without</b> my phone."},{"en":"world","zh":"世界","audio":"pool_world","sentAudio":"pool_sent_world","sentHtml":"She wants to travel around the <b>world</b>."},{"en":"yet","zh":"還沒","audio":"pool_yet","sentAudio":"pool_sent_yet","sentHtml":"I haven't finished my homework <b>yet</b>."},{"en":"yours","zh":"你的（東西）","audio":"pool_yours","sentAudio":"pool_sent_yours","sentHtml":"Is this pencil <b>yours</b>?"},{"en":"yourself","zh":"你自己","audio":"pool_yourself","sentAudio":"pool_sent_yourself","sentHtml":"Take care of <b>yourself</b>."},{"en":"zebra","zh":"斑馬","audio":"pool_zebra","sentAudio":"pool_sent_zebra","sentHtml":"We saw a <b>zebra</b> at the zoo."}];
const N=Math.min(12,POOL.length);
let session=[],qi=0,score=0;
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function startQuiz(){
  session=shuffle(POOL).slice(0,N); qi=0; score=0;
  document.getElementById("result").textContent="";
  document.getElementById("again").style.display="none";
  document.getElementById("qcount").textContent="";
  renderQ();
}
function renderQ(){
  const area=document.getElementById("quizArea");
  if(qi>=session.length){
    area.innerHTML=""; document.getElementById("qstatus").textContent="";
    document.getElementById("result").textContent="🎉 完成！答對 "+score+" / "+session.length;
    document.getElementById("again").style.display="block";
    return;
  }
  const q=session[qi];
  const distractors=shuffle(POOL.filter(p=>p.en!==q.en)).slice(0,3).map(p=>p.zh);
  const choices=shuffle(distractors.concat([q.zh]));
  area.innerHTML='<div class="sent">'+q.sentHtml+'</div>'+
    '<button class="playbtn" style="background:#6a4c93" onclick="playAudio(\''+q.sentAudio+'\')">🔊 聽整句例句</button>'+
    '<button class="playbtn" style="background:#8a93b8" onclick="playAudio(\''+q.audio+'\')">🔊 只聽這個字</button>'+
    '<div class="choices">'+choices.map(c=>'<button onclick="answer(this,\''+c.replace(/'/g,"\\'")+'\')">'+esc(c)+'</button>').join("")+'</div>';
  document.getElementById("qstatus").textContent="第 "+(qi+1)+" / "+session.length+" 題";
  document.getElementById("qcount").textContent="本級字彙池共 "+POOL.length+" 字，慢慢都會抽到。";
}
function answer(btn,c){
  const q=session[qi];
  document.querySelectorAll(".choices button").forEach(b=>b.disabled=true);
  if(c===q.zh){btn.classList.add("correct");score++;}
  else{btn.classList.add("wrong");
    document.querySelectorAll(".choices button").forEach(b=>{if(b.textContent===q.zh)b.classList.add("correct");});
  }
  setTimeout(()=>{qi++;renderQ();},1100);
}
function playAudio(name){new Audio("audio/"+name+".mp3").play().catch(()=>{});}

<svg width="760" height="440" viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc"><title id="title">a / an 聲音入口</title><desc id="desc">a 或 an 取決於下一個聲音，不只看第一個字母。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/></marker></defs><rect width="760" height="440" rx="20" fill="#ffffff"/><text x="380" y="34" font-size="22" fill="#203047" font-weight="750" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">a / an 聲音入口</text><rect x="260" y="60" width="240" height="90" rx="15" fill="#f2ebff" stroke="#8b5cf6" stroke-width="2.5"/><text x="380" y="92" font-size="18" fill="#5b35a8" font-weight="700" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">先聽下一個聲音</text><text x="380" y="117" font-size="14" fill="#243042" font-weight="650" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">不是只看字母</text><line x1="300" y1="155" x2="175" y2="220" stroke="#7b8794" stroke-width="3" marker-end="url(#arrow)"/><text x="237.5" y="179.5" font-size="13" fill="#59636f" font-weight="600" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">子音聲音</text><line x1="460" y1="155" x2="585" y2="220" stroke="#7b8794" stroke-width="3" marker-end="url(#arrow)"/><text x="522.5" y="179.5" font-size="13" fill="#59636f" font-weight="600" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">母音聲音</text><rect x="45" y="225" width="270" height="150" rx="15" fill="#e6f6ec" stroke="#2fbf71" stroke-width="2.5"/><text x="180" y="257" font-size="18" fill="#187a48" font-weight="700" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">使用 a</text><text x="180" y="291" font-size="14" fill="#243042" font-weight="650" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">a bag /b/</text><text x="180" y="318" font-size="14" fill="#243042" font-weight="500" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">a university /juː/</text><text x="180" y="345" font-size="14" fill="#243042" font-weight="500" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">a useful book</text><rect x="445" y="225" width="270" height="150" rx="15" fill="#eaf3ff" stroke="#2f80ed" stroke-width="2.5"/><text x="580" y="257" font-size="18" fill="#1e5fb8" font-weight="700" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">使用 an</text><text x="580" y="291" font-size="14" fill="#243042" font-weight="650" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">an apple /æ/</text><text x="580" y="318" font-size="14" fill="#243042" font-weight="500" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">an hour /aʊ/</text><text x="580" y="345" font-size="14" fill="#243042" font-weight="500" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">an old map</text></svg>

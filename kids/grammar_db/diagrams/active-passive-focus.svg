<svg width="760" height="440" viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc"><title id="title">主動與被動焦點</title><desc id="desc">同一事件可依資訊焦點選擇主動或被動。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/></marker></defs><rect width="760" height="440" rx="20" fill="#ffffff"/><text x="380" y="34" font-size="22" fill="#203047" font-weight="750" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">主動與被動焦點</text><rect x="40" y="90" width="290" height="145" rx="15" fill="#e6f6ec" stroke="#2fbf71" stroke-width="2.5"/><text x="185" y="122" font-size="18" fill="#187a48" font-weight="700" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">主動：做事者重要</text><text x="185" y="156" font-size="14" fill="#243042" font-weight="650" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">Students test the water.</text><text x="185" y="183" font-size="14" fill="#243042" font-weight="500" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">焦點：students</text><line x1="335" y1="163" x2="420" y2="163" stroke="#7b8794" stroke-width="3" marker-end="url(#arrow)"/><text x="377.5" y="155" font-size="13" fill="#59636f" font-weight="600" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">改變焦點</text><rect x="425" y="90" width="290" height="145" rx="15" fill="#eaf3ff" stroke="#2f80ed" stroke-width="2.5"/><text x="570" y="122" font-size="18" fill="#1e5fb8" font-weight="700" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">被動：流程／物件重要</text><text x="570" y="156" font-size="14" fill="#243042" font-weight="650" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">The water is tested.</text><text x="570" y="183" font-size="14" fill="#243042" font-weight="500" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">焦點：water</text><rect x="145" y="285" width="470" height="95" rx="15" fill="#f2ebff" stroke="#8b5cf6" stroke-width="2.5"/><text x="380" y="317" font-size="18" fill="#5b35a8" font-weight="700" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">被動形式</text><text x="380" y="342" font-size="14" fill="#243042" font-weight="650" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">be + past participle</text><text x="380" y="364" font-size="14" fill="#243042" font-weight="500" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">is tested · was built · can be recycled</text></svg>

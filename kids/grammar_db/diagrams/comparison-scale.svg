<svg width="760" height="440" viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc"><title id="title">比較刻度圖</title><desc id="desc">原級、比較級與最高級依比較數量與對象選擇。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/></marker></defs><rect width="760" height="440" rx="20" fill="#ffffff"/><text x="380" y="34" font-size="22" fill="#203047" font-weight="750" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">比較刻度圖</text><rect x="45" y="105" width="200" height="140" rx="15" fill="#f4f6f8" stroke="#8b95a5" stroke-width="2.5"/><text x="145" y="137" font-size="18" fill="#3d4653" font-weight="700" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">一項描述</text><text x="145" y="171" font-size="14" fill="#243042" font-weight="650" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">tall</text><text x="145" y="198" font-size="14" fill="#243042" font-weight="500" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">interesting</text><line x1="250" y1="175" x2="285" y2="175" stroke="#7b8794" stroke-width="3" marker-end="url(#arrow)"/><text x="267.5" y="167" font-size="13" fill="#59636f" font-weight="600" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">兩者</text><rect x="290" y="105" width="200" height="140" rx="15" fill="#e6f6ec" stroke="#2fbf71" stroke-width="2.5"/><text x="390" y="137" font-size="18" fill="#187a48" font-weight="700" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">比較級</text><text x="390" y="171" font-size="14" fill="#243042" font-weight="650" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">taller than</text><text x="390" y="198" font-size="14" fill="#243042" font-weight="500" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">more interesting</text><line x1="495" y1="175" x2="530" y2="175" stroke="#7b8794" stroke-width="3" marker-end="url(#arrow)"/><text x="512.5" y="167" font-size="13" fill="#59636f" font-weight="600" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">三者以上</text><rect x="535" y="105" width="190" height="140" rx="15" fill="#f2ebff" stroke="#8b5cf6" stroke-width="2.5"/><text x="630" y="137" font-size="18" fill="#5b35a8" font-weight="700" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">最高級</text><text x="630" y="171" font-size="14" fill="#243042" font-weight="650" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">the tallest</text><text x="630" y="198" font-size="14" fill="#243042" font-weight="500" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">the most interesting</text><text x="380" y="315" font-size="16" fill="#b4234d" font-weight="700" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">不要重複標記：more bigger ✗  →  bigger ✓</text></svg>

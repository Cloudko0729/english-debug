<svg width="760" height="440" viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc"><title id="title">連接詞關係圖</title><desc id="desc">連接詞標示兩個想法之間的邏輯關係。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/></marker></defs><rect width="760" height="440" rx="20" fill="#ffffff"/><text x="380" y="34" font-size="22" fill="#203047" font-weight="750" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">連接詞關係圖</text><rect x="35" y="75" width="210" height="120" rx="15" fill="#e6f6ec" stroke="#2fbf71" stroke-width="2.5"/><text x="140" y="107" font-size="18" fill="#187a48" font-weight="700" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">添加／選擇</text><text x="140" y="141" font-size="14" fill="#243042" font-weight="650" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">and = 加上</text><text x="140" y="168" font-size="14" fill="#243042" font-weight="500" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">or = 選擇</text><rect x="275" y="75" width="210" height="120" rx="15" fill="#f2ebff" stroke="#8b5cf6" stroke-width="2.5"/><text x="380" y="107" font-size="18" fill="#5b35a8" font-weight="700" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">轉折</text><text x="380" y="141" font-size="14" fill="#243042" font-weight="650" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">but / however</text><text x="380" y="168" font-size="14" fill="#243042" font-weight="500" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">兩項資訊有反差</text><rect x="515" y="75" width="210" height="120" rx="15" fill="#eaf3ff" stroke="#2f80ed" stroke-width="2.5"/><text x="620" y="107" font-size="18" fill="#1e5fb8" font-weight="700" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">原因／結果</text><text x="620" y="141" font-size="14" fill="#243042" font-weight="650" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">because = 原因</text><text x="620" y="168" font-size="14" fill="#243042" font-weight="500" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">so / therefore = 結果</text><rect x="145" y="260" width="470" height="105" rx="15" fill="#fde8ec" stroke="#ef476f" stroke-width="2.5"/><text x="380" y="292" font-size="18" fill="#b4234d" font-weight="700" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">先檢查真實邏輯</text><text x="380" y="326" font-size="14" fill="#243042" font-weight="650" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">便宜不一定導致不安全。</text><text x="380" y="353" font-size="14" fill="#243042" font-weight="500" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">同一組因果通常只選一個主要連接方式。</text></svg>

<svg width="760" height="440" viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc"><title id="title">頻率副詞位置</title><desc id="desc">一般動詞前、be 後是最穩定的基礎位置。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/></marker></defs><rect width="760" height="440" rx="20" fill="#ffffff"/><text x="380" y="34" font-size="22" fill="#203047" font-weight="750" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">頻率副詞位置</text><text x="105" y="92" font-size="14" fill="#b4234d" font-weight="700" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">never</text><text x="245" y="92" font-size="14" fill="#8a5a00" font-weight="700" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">sometimes</text><text x="390" y="92" font-size="14" fill="#1e5fb8" font-weight="700" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">often</text><text x="530" y="92" font-size="14" fill="#187a48" font-weight="700" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">usually</text><text x="665" y="92" font-size="14" fill="#5b35a8" font-weight="700" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">always</text><line x1="85" y1="120" x2="680" y2="120" stroke="#8b95a5" stroke-width="5" marker-end="url(#arrow)"/><rect x="65" y="180" width="285" height="145" rx="15" fill="#e6f6ec" stroke="#2fbf71" stroke-width="2.5"/><text x="207.5" y="212" font-size="18" fill="#187a48" font-weight="700" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">一般動詞前</text><text x="207.5" y="246" font-size="14" fill="#243042" font-weight="650" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">I usually walk.</text><text x="207.5" y="273" font-size="14" fill="#243042" font-weight="500" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">We never drink coffee.</text><rect x="410" y="180" width="285" height="145" rx="15" fill="#eaf3ff" stroke="#2f80ed" stroke-width="2.5"/><text x="552.5" y="212" font-size="18" fill="#1e5fb8" font-weight="700" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">be 後</text><text x="552.5" y="246" font-size="14" fill="#243042" font-weight="650" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">She is often tired.</text><text x="552.5" y="273" font-size="14" fill="#243042" font-weight="500" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">He is always kind.</text></svg>

<svg width="760" height="440" viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc"><title id="title">情態功能與強度</title><desc id="desc">先分開可能性推論與建議義務，再在相同功能內比較強度。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/></marker></defs><rect width="760" height="440" rx="20" fill="#ffffff"/><text x="380" y="34" font-size="22" fill="#203047" font-weight="750" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">情態功能與強度</text><rect x="55" y="75" width="300" height="155" rx="15" fill="#eaf3ff" stroke="#2f80ed" stroke-width="2.5"/><text x="205" y="107" font-size="18" fill="#1e5fb8" font-weight="700" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">可能性／推論</text><text x="205" y="141" font-size="14" fill="#243042" font-weight="650" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">might / may = 較弱推測</text><text x="205" y="168" font-size="14" fill="#243042" font-weight="500" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">must be = 根據證據強推論</text><text x="205" y="195" font-size="14" fill="#243042" font-weight="500" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">不是固定百分比</text><rect x="405" y="75" width="300" height="155" rx="15" fill="#fde8ec" stroke="#ef476f" stroke-width="2.5"/><text x="555" y="107" font-size="18" fill="#b4234d" font-weight="700" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">建議／義務</text><text x="555" y="141" font-size="14" fill="#243042" font-weight="650" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">should = 建議</text><text x="555" y="168" font-size="14" fill="#243042" font-weight="500" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">have to / must = 義務</text><text x="555" y="195" font-size="14" fill="#243042" font-weight="500" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">強度仍受語境影響</text><rect x="135" y="280" width="490" height="90" rx="15" fill="#e6f6ec" stroke="#2fbf71" stroke-width="2.5"/><text x="380" y="312" font-size="18" fill="#187a48" font-weight="700" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">形式共同點</text><text x="380" y="337" font-size="14" fill="#243042" font-weight="650" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">modal + 原形：might rain · should go · must be</text></svg>

<svg width="760" height="440" viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc"><title id="title">名詞決策樹</title><desc id="desc">依可數性與數量選擇單數、複數或不可數形式。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/></marker></defs><rect width="760" height="440" rx="20" fill="#ffffff"/><text x="380" y="34" font-size="22" fill="#203047" font-weight="750" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">名詞決策樹</text><rect x="270" y="62" width="220" height="90" rx="15" fill="#f2ebff" stroke="#8b5cf6" stroke-width="2.5"/><text x="380" y="94" font-size="18" fill="#5b35a8" font-weight="700" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">這個名詞可數嗎？</text><text x="380" y="119" font-size="14" fill="#243042" font-weight="650" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">book / water</text><line x1="300" y1="155" x2="175" y2="220" stroke="#7b8794" stroke-width="3" marker-end="url(#arrow)"/><text x="237.5" y="179.5" font-size="13" fill="#59636f" font-weight="600" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">可數</text><line x1="460" y1="155" x2="590" y2="220" stroke="#7b8794" stroke-width="3" marker-end="url(#arrow)"/><text x="525" y="179.5" font-size="13" fill="#59636f" font-weight="600" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">不可數</text><rect x="40" y="225" width="270" height="150" rx="15" fill="#e6f6ec" stroke="#2fbf71" stroke-width="2.5"/><text x="175" y="257" font-size="18" fill="#187a48" font-weight="700" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">可數 Count</text><text x="175" y="291" font-size="14" fill="#243042" font-weight="650" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">one book → 單數</text><text x="175" y="318" font-size="14" fill="#243042" font-weight="500" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">two books → 複數</text><text x="175" y="345" font-size="14" fill="#243042" font-weight="500" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">many / a few books</text><rect x="450" y="225" width="270" height="150" rx="15" fill="#eaf3ff" stroke="#2f80ed" stroke-width="2.5"/><text x="585" y="257" font-size="18" fill="#1e5fb8" font-weight="700" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">不可數 Noncount</text><text x="585" y="291" font-size="14" fill="#243042" font-weight="650" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">some water</text><text x="585" y="318" font-size="14" fill="#243042" font-weight="500" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">much / a little water</text><text x="585" y="345" font-size="14" fill="#243042" font-weight="500" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">一般不用 a water</text></svg>

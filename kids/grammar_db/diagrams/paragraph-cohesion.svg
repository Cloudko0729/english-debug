<svg width="760" height="440" viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc"><title id="title">段落銜接圖</title><desc id="desc">用順序、邏輯、指涉與關鍵詞讓句子形成段落。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/></marker></defs><rect width="760" height="440" rx="20" fill="#ffffff"/><text x="380" y="34" font-size="22" fill="#203047" font-weight="750" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">段落銜接圖</text><rect x="30" y="85" width="160" height="145" rx="15" fill="#e6f6ec" stroke="#2fbf71" stroke-width="2.5"/><text x="110" y="117" font-size="18" fill="#187a48" font-weight="700" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">順序</text><text x="110" y="151" font-size="14" fill="#243042" font-weight="650" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">First</text><text x="110" y="178" font-size="14" fill="#243042" font-weight="500" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">Then</text><text x="110" y="205" font-size="14" fill="#243042" font-weight="500" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">Finally</text><line x1="195" y1="158" x2="220" y2="158" stroke="#7b8794" stroke-width="3" marker-end="url(#arrow)"/><rect x="225" y="85" width="160" height="145" rx="15" fill="#eaf3ff" stroke="#2f80ed" stroke-width="2.5"/><text x="305" y="117" font-size="18" fill="#1e5fb8" font-weight="700" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">邏輯</text><text x="305" y="151" font-size="14" fill="#243042" font-weight="650" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">However</text><text x="305" y="178" font-size="14" fill="#243042" font-weight="500" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">Therefore</text><text x="305" y="205" font-size="14" fill="#243042" font-weight="500" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">In addition</text><line x1="390" y1="158" x2="415" y2="158" stroke="#7b8794" stroke-width="3" marker-end="url(#arrow)"/><rect x="420" y="85" width="140" height="145" rx="15" fill="#fff7dc" stroke="#f2a900" stroke-width="2.5"/><text x="490" y="117" font-size="18" fill="#8a5a00" font-weight="700" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">指涉</text><text x="490" y="151" font-size="14" fill="#243042" font-weight="650" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">it / they</text><text x="490" y="178" font-size="14" fill="#243042" font-weight="500" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">this change</text><line x1="565" y1="158" x2="590" y2="158" stroke="#7b8794" stroke-width="3" marker-end="url(#arrow)"/><rect x="595" y="85" width="135" height="145" rx="15" fill="#f2ebff" stroke="#8b5cf6" stroke-width="2.5"/><text x="662.5" y="117" font-size="18" fill="#5b35a8" font-weight="700" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">關鍵詞</text><text x="662.5" y="151" font-size="14" fill="#243042" font-weight="650" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">route</text><text x="662.5" y="178" font-size="14" fill="#243042" font-weight="500" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">the new route</text><rect x="135" y="290" width="490" height="85" rx="15" fill="#fde8ec" stroke="#ef476f" stroke-width="2.5"/><text x="380" y="322" font-size="18" fill="#b4234d" font-weight="700" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">每一步都要能回答</text><text x="380" y="347" font-size="14" fill="#243042" font-weight="650" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">前一句和後一句的關係是什麼？代名詞指誰？</text></svg>

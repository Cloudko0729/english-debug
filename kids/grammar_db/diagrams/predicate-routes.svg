<svg width="760" height="440" viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc"><title id="title">述語選擇圖</title><desc id="desc">依身分狀態位置或動作，選擇基本述語路線。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/></marker></defs><rect width="760" height="440" rx="20" fill="#ffffff"/><text x="380" y="34" font-size="22" fill="#203047" font-weight="750" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">述語選擇圖</text><rect x="250" y="58" width="260" height="85" rx="15" fill="#f2ebff" stroke="#8b5cf6" stroke-width="2.5"/><text x="380" y="90" font-size="18" fill="#5b35a8" font-weight="700" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">你要表達什麼？</text><text x="380" y="115" font-size="14" fill="#243042" font-weight="650" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">先判斷意思，再選形式</text><line x1="300" y1="148" x2="175" y2="215" stroke="#7b8794" stroke-width="3" marker-end="url(#arrow)"/><text x="237.5" y="173.5" font-size="13" fill="#59636f" font-weight="600" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">身分／狀態／位置</text><line x1="460" y1="148" x2="585" y2="215" stroke="#7b8794" stroke-width="3" marker-end="url(#arrow)"/><text x="522.5" y="173.5" font-size="13" fill="#59636f" font-weight="600" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">動作</text><rect x="35" y="220" width="285" height="145" rx="15" fill="#eaf3ff" stroke="#2f80ed" stroke-width="2.5"/><text x="177.5" y="252" font-size="18" fill="#1e5fb8" font-weight="700" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">be 路線</text><text x="177.5" y="286" font-size="14" fill="#243042" font-weight="650" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">She is a student.</text><text x="177.5" y="313" font-size="14" fill="#243042" font-weight="500" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">She is tired.</text><text x="177.5" y="340" font-size="14" fill="#243042" font-weight="500" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">She is at home.</text><rect x="440" y="220" width="285" height="145" rx="15" fill="#e6f6ec" stroke="#2fbf71" stroke-width="2.5"/><text x="582.5" y="252" font-size="18" fill="#187a48" font-weight="700" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">一般動詞路線</text><text x="582.5" y="286" font-size="14" fill="#243042" font-weight="650" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">She reads.</text><text x="582.5" y="313" font-size="14" fill="#243042" font-weight="500" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">She likes music.</text><text x="582.5" y="340" font-size="14" fill="#243042" font-weight="500" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">She walks home.</text><text x="380" y="405" font-size="14" fill="#b4234d" font-weight="650" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">後續會形成完整動詞片語：is reading · can swim · has finished</text></svg>

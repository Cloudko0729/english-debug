<svg width="760" height="440" viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc"><title id="title">介系詞關係圖</title><desc id="desc">先看空間或時間關係，不用單一中文「在」硬套。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/></marker></defs><rect width="760" height="440" rx="20" fill="#ffffff"/><text x="380" y="34" font-size="22" fill="#203047" font-weight="750" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">介系詞關係圖</text><rect x="40" y="75" width="210" height="145" rx="15" fill="#e6f6ec" stroke="#2fbf71" stroke-width="2.5"/><text x="145" y="107" font-size="18" fill="#187a48" font-weight="700" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">空間</text><text x="145" y="141" font-size="14" fill="#243042" font-weight="650" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">in the box</text><text x="145" y="168" font-size="14" fill="#243042" font-weight="500" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">on the table</text><text x="145" y="195" font-size="14" fill="#243042" font-weight="500" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">under the chair</text><rect x="275" y="75" width="210" height="145" rx="15" fill="#eaf3ff" stroke="#2f80ed" stroke-width="2.5"/><text x="380" y="107" font-size="18" fill="#1e5fb8" font-weight="700" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">時間點 at</text><text x="380" y="141" font-size="14" fill="#243042" font-weight="650" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">at seven</text><text x="380" y="168" font-size="14" fill="#243042" font-weight="500" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">at noon</text><rect x="510" y="75" width="210" height="145" rx="15" fill="#fff7dc" stroke="#f2a900" stroke-width="2.5"/><text x="615" y="107" 
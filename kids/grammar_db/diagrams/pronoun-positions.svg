<svg width="760" height="440" viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc"><title id="title">代名詞位置圖</title><desc id="desc">代名詞形式由它在句中的工作決定。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/></marker></defs><rect width="760" height="440" rx="20" fill="#ffffff"/><text x="380" y="34" font-size="22" fill="#203047" font-weight="750" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">代名詞位置圖</text><rect x="25" y="85" width="160" height="145" rx="15" fill="#e6f6ec" stroke="#2fbf71" stroke-width="2.5"/><text x="105" y="117" font-size="18" fill="#187a48" font-weight="700" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">主詞</text><text x="105" y="151" font-size="14" fill="#243042" font-weight="650" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">I / she / they</text><text x="105" y="178" font-size="14" fill="#243042" font-weight="500" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">She helps me.</text><line x1="190" y1="158" x2="225" y2="158" stroke="#7b8794" stroke-width="3" marker-end="url(#arrow)"/><rect x="230" y="85" width="130" height="145" rx="15" fill="#f4f6f8" stroke="#8b95a5" stroke-width="2.5"/><text x="295" y="117" font-size="18" fill="#3d4653" font-weight="700" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">動詞</text><text x="295" y="151" font-size="14" fill="#243042" font-weight="650" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">helps</text><text x="295" y="178" font-size="14" fill="#243042" font-weight="500" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">動作</text><line x1="365" y1="158" x2="400" y2="158" stroke="#7b8794" stroke-width="3" marker-end="url(#arrow)"/><rect x="405" y="85" width="160" height="145" rx="15" fill="#eaf3ff" stroke="#2f80ed" stroke-width="2.5"/><text x="485" y="117" font-size="18" fill="#1e5fb8" font-weight="700" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">受詞</text><text x="485" y="151" font-size="14" fill="#243042" font-weight="650" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">me / her / them</text><text x="485" y="178" font-size="14" fill="#243042" font-weight="500" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">看動作落到誰</text><rect x="585" y="85" width="150" height="145" rx="15" fill="#fff7dc" stroke="#f2a900" stroke-width="2.5"/><text x="660" y="117" font-size="18" fill="#8a5a00" font-weight="700" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">所有格</text><text x="660" y="151" font-size="14" fill="#243042" font-weight="650" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">my bag</text><text x="660" y="178" font-size="14" fill="#243042" font-weight="500" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">The bag is mine.</text><rect x="155" y="285" width="450" height="100" rx="15" fill="#fde8ec" stroke="#ef476f" stroke-width="2.5"/><text x="380" y="317" font-size="18" fill="#b4234d" font-weight="700" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">指涉檢查</text><text x="380" y="342" font-size="14" fill="#243042" font-weight="650" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">Tom told Ben that he... → he 是誰？</text><text x="380" y="364" font-size="14" fill="#243042" font-weight="500" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">不清楚時重複名字或改寫。</text></svg>

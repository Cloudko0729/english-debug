<svg width="760" height="440" viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc"><title id="title">標點功能圖</title><desc id="desc">依資訊關係選擇冒號、分號、破折號、括號或連字號。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/></marker></defs><rect width="760" height="440" rx="20" fill="#ffffff"/><text x="380" y="34" font-size="22" fill="#203047" font-weight="750" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">標點功能圖</text><rect x="25" y="80" width="165" height="150" rx="15" fill="#e6f6ec" stroke="#2fbf71" stroke-width="2.5"/><text x="107.5" y="112" font-size="18" fill="#187a48" font-weight="700" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">冒號 :</text><text x="107.5" y="146" font-size="14" fill="#243042" font-weight="650" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">引出清單</text><text x="107.5" y="173" font-size="14" fill="#243042" font-weight="500" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">three things: ...</text><rect x="205" y="80" width="165" height="150" rx="15" fill="#eaf3ff" stroke="#2f80ed" stroke-width="2.5"/><text x="287.5" y="112" font-size="18" fill="#1e5fb8" font-weight="700" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">分號 ;</text><text x="287.5" y="146" font-size="14" fill="#243042" font-weight="650" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">完整句 A ; 完整句 B</text><text x="287.5" y="173" font-size="14" fill="#243042" font-weight="500" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">It works; we agree.</text><rect x="385" y="80" width="165" height="150" rx="15" fill="#f2ebff" stroke="#8b5cf6" stroke-width="2.5"/><text x="467.5" y="112" font-size="18" fill="#5b35a8" font-weight="700" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">破折號／括號</text><text x="467.5" y="146" font-size="14" fill="#243042" font-weight="650" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">插入補充資訊</text><text x="467.5" y="173" font-size="14" fill="#243042" font-weight="500" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">強調／附帶</text><rect x="565" y="80" width="165" height="150" rx="15" fill="#fff7dc" stroke="#f2a900" stroke-width="2.5"/><text x="647.5" y="112" font-size="18" fill="#8a5a00" font-weight="700" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">連字號 -</text><text x="647.5" y="146" font-size="14" fill="#243042" font-weight="650" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">複合修飾語</text><text x="647.5" y="173" font-size="14" fill="#243042" font-weight="500" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">three-day event</text><rect x="135" y="285" width="490" height="90" rx="15" fill="#fde8ec" stroke="#ef476f" stroke-width="2.5"/><text x="380" y="317" font-size="18" fill="#b4234d" font-weight="700" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">禁止逗號拼接</text><text x="380" y="342" font-size="14" fill="#243042" font-weight="650" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">The plan is cheap, it is unsafe. ✗</text><text x="380" y="364" font-size="14" fill="#243042" font-weight="500" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">使用分號或連接詞。</text></svg>

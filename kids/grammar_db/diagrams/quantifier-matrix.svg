<svg width="760" height="440" viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc"><title id="title">數量詞矩陣</title><desc id="desc">依可數性選擇 many、much、few、little、fewer 或 less。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/></marker></defs><rect width="760" height="440" rx="20" fill="#ffffff"/><text x="380" y="34" font-size="22" fill="#203047" font-weight="750" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">數量詞矩陣</text><rect x="50" y="90" width="300" height="135" rx="15" fill="#e6f6ec" stroke="#2fbf71" stroke-width="2.5"/><text x="200" y="122" font-size="18" fill="#187a48" font-weight="700" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">可數複數</text><text x="200" y="156" font-size="14" fill="#243042" font-weight="650" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">many books</text><text x="200" y="183" font-size="14" fill="#243042" font-weight="500" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">a few apples</text><text x="200" y="210" font-size="14" fill="#243042" font-weight="500" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">fewer bottles</text><rect x="410" y="90" width="300" height="135" rx="15" fill="#eaf3ff" stroke="#2f80ed" stroke-width="2.5"/><text x="560" y="122" font-size="18" fill="#1e5fb8" font-weight="700" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">不可數</text><text x="560" y="156" font-size="14" fill="#243042" font-weight="650" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">much time</text><text x="560" y="183" font-size="14" fill="#243042" font-weight="500" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">a little water</text><text x="560" y="210" font-size="14" fill="#243042" font-weight="500" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">less sugar</text><rect x="50" y="270" width="300" height="105" rx="15" fill="#fff7dc" stroke="#f2a900" stroke-width="2.5"/><text x="200" y="302" font-size="18" fill="#8a5a00" font-weight="700" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">肯定常用 some</text><text x="200" y="336" font-size="14" fill="#243042" font-weight="650" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">There are some apples.</text><rect x="410" y="270" width="300" height="105" rx="15" fill="#f2ebff" stroke="#8b5cf6" stroke-width="2.5"/><text x="560" y="302" font-size="18" fill="#5b35a8" font-weight="700" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">一般問句／否定常用 any</text><text x="560" y="336" font-size="14" fill="#243042" font-weight="650" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">Are there any questions?</text></svg>

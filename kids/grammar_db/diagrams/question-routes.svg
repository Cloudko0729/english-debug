<svg width="760" height="440" viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc"><title id="title">問句雙路線</title><desc id="desc">be 句前移 be；一般動詞句使用 do、does 或 did。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/></marker></defs><rect width="760" height="440" rx="20" fill="#ffffff"/><text x="380" y="34" font-size="22" fill="#203047" font-weight="750" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">問句雙路線</text><rect x="250" y="55" width="260" height="80" rx="15" fill="#f2ebff" stroke="#8b5cf6" stroke-width="2.5"/><text x="380" y="87" font-size="18" fill="#5b35a8" font-weight="700" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">先找原句的述語</text><text x="380" y="112" font-size="14" fill="#243042" font-weight="650" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">be 還是一般動詞？</text><line x1="300" y1="140" x2="170" y2="205" stroke="#7b8794" stroke-width="3" marker-end="url(#arrow)"/><text x="235" y="164.5" font-size="13" fill="#59636f" font-weight="600" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">be</text><line x1="460" y1="140" x2="590" y2="205" stroke="#7b8794" stroke-width="3" marker-end="url(#arrow)"/><text x="525" y="164.5" font-size="13" fill="#59636f" font-weight="600" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">一般動詞</text><rect x="35" y="210" width="285" height="160" rx="15" fill="#eaf3ff" stroke="#2f80ed" stroke-width="2.5"/><text x="177.5" y="242" font-size="18" fill="#1e5fb8" font-weight="700" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">be 前移</text><text x="177.5" y="276" font-size="14" fill="#243042" font-weight="650" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">You are tired.</text><text x="177.5" y="303" font-size="14" fill="#243042" font-weight="500" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">Are you tired?</text><text x="177.5" y="330" font-size="14" fill="#243042" font-weight="500" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">You are not tired.</text><rect x="440" y="210" width="285" height="160" rx="15" fill="#e6f6ec" stroke="#2fbf71" stroke-width="2.5"/><text x="582.5" y="242" font-size="18" fill="#187a48" font-weight="700" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">請助動詞</text><text x="582.5" y="276" font-size="14" fill="#243042" font-weight="650" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">You like tea.</text><text x="582.5" y="303" font-size="14" fill="#243042" font-weight="500" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">Do you like tea?</text><text x="582.5" y="330" font-size="14" fill="#243042" font-weight="500" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">She doesn't like tea.</text></svg>

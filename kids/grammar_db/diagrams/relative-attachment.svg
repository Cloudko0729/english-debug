<svg width="760" height="440" viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc"><title id="title">關係子句附著圖</title><desc id="desc">關係子句應緊接它所描述的人、物、地點或時間。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/></marker></defs><rect width="760" height="440" rx="20" fill="#ffffff"/><text x="380" y="34" font-size="22" fill="#203047" font-weight="750" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">關係子句附著圖</text><rect x="40" y="90" width="220" height="135" rx="15" fill="#e6f6ec" stroke="#2fbf71" stroke-width="2.5"/><text x="150" y="122" font-size="18" fill="#187a48" font-weight="700" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">先行詞</text><text x="150" y="156" font-size="14" fill="#243042" font-weight="650" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">the engineer</text><text x="150" y="183" font-size="14" fill="#243042" font-weight="500" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">要補充的人</text><line x1="265" y1="158" x2="315" y2="158" stroke="#7b8794" stroke-width="3" marker-end="url(#arrow)"/><text x="290" y="150" font-size="13" fill="#59636f" font-weight="600" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">緊接</text><rect x="320" y="90" width="390" height="135" rx="15" fill="#eaf3ff" stroke="#2f80ed" stroke-width="2.5"/><text x="515" y="122" font-size="18" fill="#1e5fb8" font-weight="700" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">關係子句</text><text x="515" y="156" font-size="14" fill="#243042" font-weight="650" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">who designed the device</text><text x="515" y="183" font-size="14" fill="#243042" font-weight="500" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">who → 人</text><text x="515" y="210" font-size="14" fill="#243042" font-weight="500" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">which/that → 物 · where → 地點</text><rect x="120" y="285" width="520" height="90" rx="15" fill="#fde8ec" stroke="#ef476f" stroke-width="2.5"/><text x="380" y="317" font-size="18" fill="#b4234d" font-weight="700" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">避免錯掛</text><text x="380" y="342" font-size="14" fill="#243042" font-weight="650" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">the device who designed it ✗</text><text x="380" y="364" font-size="14" fill="#243042" font-weight="500" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">the engineer who designed the device ✓</text></svg>

<svg width="760" height="440" viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc"><title id="title">自然度修訂層</title><desc id="desc">先保住意思，再依序檢查結構、搭配與語體。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/></marker></defs><rect width="760" height="440" rx="20" fill="#ffffff"/><text x="380" y="34" font-size="22" fill="#203047" font-weight="750" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">自然度修訂層</text><rect x="35" y="105" width="150" height="145" rx="15" fill="#fde8ec" stroke="#ef476f" stroke-width="2.5"/><text x="110" y="137" font-size="18" fill="#b4234d" font-weight="700" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">1 意思</text><text x="110" y="171" font-size="14" fill="#243042" font-weight="650" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">否定？時間？</text><text x="110" y="198" font-size="14" fill="#243042" font-weight="500" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">指涉清楚？</text><line x1="190" y1="178" x2="215" y2="178" stroke="#7b8794" stroke-width="3" marker-end="url(#arrow)"/><rect x="220" y="105" width="150" height="145" rx="15" fill="#fff7dc" stroke="#f2a900" stroke-width="2.5"/><text x="295" y="137" font-size="18" fill="#8a5a00" font-weight="700" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">2 結構</text><text x="295" y="171" font-size="14" fill="#243042" font-weight="650" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">主詞／述語</text><text x="295" y="198" font-size="14" fill="#243042" font-weight="500" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">動詞形式</text><line x1="375" y1="178" x2="400" y2="178" stroke="#7b8794" stroke-width="3" marker-end="url(#arrow)"/><rect x="405" y="105" width="150" height="145" rx="15" fill="#e6f6ec" stroke="#2fbf71" stroke-width="2.5"/><text x="480" y="137" font-size="18" fill="#187a48" font-weight="700" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">3 搭配</text><text x="480" y="171" font-size="14" fill="#243042" font-weight="650" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">really like</text><text x="480" y="198" font-size="14" fill="#243042" font-weight="500" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">discuss the issue</text><line x1="560" y1="178" x2="585" y2="178" stroke="#7b8794" stroke-width="3" marker-end="url(#arrow)"/><rect x="590" y="105" width="140" height="145" rx="15" fill="#eaf3ff" stroke="#2f80ed" stroke-width="2.5"/><text x="660" y="137" font-size="18" fill="#1e5fb8" font-weight="700" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">4 語體</text><text x="660" y="171" font-size="14" fill="#243042" font-weight="650" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">對象／目的</text><text x="660" y="198" font-size="14" fill="#243042" font-weight="500" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">正式度一致</text><text x="380" y="320" font-size="17" fill="#5b35a8" font-weight="750" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">可懂 ≠ 自然；但不能為了自然改變原意。</text></svg>

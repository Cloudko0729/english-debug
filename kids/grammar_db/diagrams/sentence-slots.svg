<svg width="760" height="440" viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc"><title id="title">句子槽位圖</title><desc id="desc">完整句的主詞、述語與可選補充資訊。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/></marker></defs><rect width="760" height="440" rx="20" fill="#ffffff"/><text x="380" y="34" font-size="22" fill="#203047" font-weight="750" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">句子槽位圖</text><rect x="35" y="90" width="190" height="150" rx="15" fill="#e6f6ec" stroke="#2fbf71" stroke-width="2.5"/><text x="130" y="122" font-size="18" fill="#187a48" font-weight="700" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">主詞 Subject</text><text x="130" y="156" font-size="14" fill="#243042" font-weight="650" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">誰／什麼</text><text x="130" y="183" font-size="14" fill="#243042" font-weight="500" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">My sister</text><line x1="230" y1="165" x2="285" y2="165" stroke="#7b8794" stroke-width="3" marker-end="url(#arrow)"/><text x="257.5" y="157" font-size="13" fill="#59636f" font-weight="600" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">+</text><rect x="290" y="90" width="190" height="150" rx="15" fill="#eaf3ff" stroke="#2f80ed" stroke-width="2.5"/><text x="385" y="122" font-size="18" fill="#1e5fb8" font-weight="700" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">述語 Predicate</text><text x="385" y="156" font-size="14" fill="#243042" font-weight="650" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">發生什麼</text><text x="385" y="183" font-size="14" fill="#243042" font-weight="500" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">reads</text><line x1="485" y1="165" x2="540" y2="165" stroke="#7b8794" stroke-width="3" marker-end="url(#arrow)"/><text x="512.5" y="157" font-size="13" fill="#59636f" font-weight="600" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">+ 可選</text><rect x="545" y="90" width="180" height="150" rx="15" fill="#fff7dc" stroke="#f2a900" stroke-width="2.5"/><text x="635" y="122" font-size="18" fill="#8a5a00" font-weight="700" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">補充資訊</text><text x="635" y="156" font-size="14" fill="#243042" font-weight="650" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">什麼／哪裡／何時</text><text x="635" y="183" font-size="14" fill="#243042" font-weight="500" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">a book at night</text><rect x="155" y="285" width="450" height="105" rx="15" fill="#f2ebff" stroke="#8b5cf6" stroke-width="2.5"/><text x="380" y="317" font-size="18" fill="#5b35a8" font-weight="700" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">完整輸出</text><text x="380" y="351" font-size="14" fill="#243042" font-weight="650" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">My sister reads a book at night.</text><text x="380" y="378" font-size="14" fill="#243042" font-weight="500" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">命令句的主詞 you 可隱藏：Please sit down.</text></svg>

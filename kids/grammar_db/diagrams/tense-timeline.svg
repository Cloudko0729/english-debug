<svg width="760" height="440" viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc"><title id="title">時態與時間關係</title><desc id="desc">用時間線比較習慣、正在、已結束與連到現在的事件。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/></marker></defs><rect width="760" height="440" rx="20" fill="#ffffff"/><text x="380" y="34" font-size="22" fill="#203047" font-weight="750" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">時態與時間關係</text><line x1="65" y1="220" x2="700" y2="220" stroke="#6b7280" stroke-width="4" marker-end="url(#arrow)"/><text x="380" y="205" font-size="15" fill="#b4234d" font-weight="750" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">NOW</text><line x1="380" y1="85" x2="380" y2="350" stroke="#ef476f" stroke-width="2" stroke-dasharray="6 6"/><rect x="35" y="65" width="190" height="105" rx="15" fill="#fff7dc" stroke="#f2a900" stroke-width="2.5"/><text x="130" y="97" font-size="18" fill="#8a5a00" font-weight="700" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">已結束 Past</text><text x="130" y="131" font-size="14" fill="#243042" font-weight="650" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">I visited in 2024.</text><rect x="265" y="270" width="230" height="105" rx="15" fill="#f2ebff" stroke="#8b5cf6" stroke-width="2.5"/><text x="380" y="302" font-size="18" fill="#5b35a8" font-weight="700" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">現在連結 Perfect</text><text x="380" y="336" font-size="14" fill="#243042" font-weight="650" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">I have visited twice.</text><rect x="535" y="65" width="190" height="105" rx="15" fill="#eaf3ff" stroke="#2f80ed" stroke-width="2.5"/><text x="630" y="97" font-size="18" fill="#1e5fb8" font-weight="700" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">此刻進行</text><text x="630" y="131" font-size="14" fill="#243042" font-weight="650" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">I am reading now.</text><text x="150" y="255" font-size="14" fill="#187a48" font-weight="650" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif">習慣反覆：I read every day.</text></svg>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Island 我的島嶼</title>
  <style>
    :root {
      --bg: #d8f3ff;
      --panel: #ffffff;
      --primary: #2f80ed;
      --primary-soft: #dbeafe;
      --accent: #ffb703;
      --gold: #f2a900;
      --success: #2fbf71;
      --danger: #ef476f;
      --text: #243042;
      --muted: #667085;
      --border: #cfe3ee;
      --sea: #5bb8e6;
      --land: #b7e08a;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, "Noto Sans TC", sans-serif;
      background: linear-gradient(#bfeaff, #d8f3ff);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 40px;
    }
    header {
      background: var(--primary);
      color: #fff;
      text-align: center;
      padding: 16px;
    }
    header h1 { font-size: 1.4rem; }
    header a { color: #ffe27a; font-size: .8rem; text-decoration: none; }

    /* student + coins bar */
    #topBar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 14px;
      background: var(--accent);
      flex-wrap: wrap;
    }
    .stu-group { display: flex; gap: 6px; }
    .stu-btn {
      padding: 5px 14px;
      border: 2px solid #3a2a00;
      border-radius: 18px;
      background: transparent;
      font-weight: 700;
      font-size: .85rem;
      cursor: pointer;
      color: #3a2a00;
    }
    .stu-btn.active { background: #3a2a00; color: #fff; }
    .coin-display {
      background: #fff;
      border-radius: 18px;
      padding: 6px 16px;
      font-weight: 800;
      font-size: 1.05rem;
      color: var(--gold);
      box-shadow: 0 1px 3px rgba(0,0,0,.15);
    }

    /* stats */
    #statsRow {
      display: flex;
      justify-content: space-around;
      gap: 6px;
      padding: 10px;
      background: var(--primary-soft);
      font-size: .8rem;
      flex-wrap: wrap;
    }
    #statsRow div { text-align: center; }
    #statsRow b { display: block; font-size: 1.1rem; color: var(--primary); }

    main { max-width: 520px; margin: 0 auto; padding: 14px; }
    #notice {
      background: #fff7dc;
      border: 2px solid var(--accent);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: .9rem;
      margin-bottom: 14px;
      display: none;
    }

    /* island grid */
    #island {
      display: grid;
      grid-template-columns: repeat(15, 1fr);
      gap: 1px;
      background: #3f9fd6;
      padding: 5px;
      border-radius: 12px;
      box-shadow: 0 3px 10px rgba(0,0,0,.2);
    }
    .tile {
      aspect-ratio: 1;
      background: var(--land);
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(.6rem, 2.6vw, 1rem);
      cursor: pointer;
      position: relative;
      user-select: none;
    }
    .tile.t-ocean   { background: #5bb8e6; cursor: default; }
    .tile.t-plains  { background: #aedd80; }
    .tile.t-hills   { background: #cca877; }
    .tile.t-mountain{ background: #b8bcca; cursor: default; }
    .tile-img { width: 100%; height: 100%; object-fit: contain; image-rendering: auto; pointer-events: none; }
    .tile-emoji { font-size: clamp(.8rem, 3.6vw, 1.4rem); line-height: 1; pointer-events: none; }
    /* 動態寵物狗 */
    .pet-dog { display: inline-block; font-size: clamp(.9rem, 3.8vw, 1.5rem); line-height: 1; pointer-events: none; animation: dogBob .8s ease-in-out infinite; transform-origin: bottom center; }
    @keyframes dogBob { 0%,100% { transform: translateY(0) rotate(-5deg); } 50% { transform: translateY(-3px) rotate(5deg); } }
    .dog-ready { position: absolute; top: -2px; right: 0; font-size: .55rem; pointer-events: none; animation: dogPulse 1s ease-in-out infinite; }
    .star-badge { position: absolute; top: -3px; left: 0; font-size: .5rem; pointer-events: none; text-shadow: 0 0 3px #fff; font-weight: 800; }
    .merge-cand { outline: 3px solid #ff5db1; outline-offset: -3px; animation: mergePulse .9s ease-in-out infinite; cursor: pointer; z-index: 2; }
    @keyframes mergePulse { 0%,100% { outline-color: #ff5db1; } 50% { outline-color: #ffd24d; } }
    @keyframes dogPulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(1.25); } }
    .opt-img { width: 2rem; height: 2rem; object-fit: contain; }
    /* 等級外框：用框的顏色代表等級，不放文字、不遮住建築 */
    .tile.lv2::after, .tile.lv3::after, .tile.lv4::after, .tile.lv5::after {
      content: ""; position: absolute; inset: 0;
      border-radius: inherit; box-sizing: border-box; pointer-events: none;
    }
    .tile.lv2::after { border: 2px solid #cd7f32; }   /* 銅 */
    .tile.lv3::after { border: 2px solid #aeb6bf; }   /* 銀 */
    .tile.lv4::after { border: 2px solid #f4c20d; }   /* 金 */
    .tile.lv5::after {
      border: 2px solid #ffd24d;
      box-shadow: 0 0 6px 1px rgba(255,196,0,.85), inset 0 0 4px rgba(255,196,0,.55);
      animation: lv5glow 1.4s ease-in-out infinite;
    }
    @keyframes lv5glow { 0%,100% { opacity: .8; } 50% { opacity: 1; } }

    /* build sheet */
    #sheet {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      background: #fff;
      border-radius: 18px 18px 0 0;
      box-shadow: 0 -3px 16px rgba(0,0,0,.2);
      padding: 12px 16px 16px;
      transform: translateY(100%);
      transition: transform .25s;
      z-index: 50;
      max-width: 520px;
      margin: 0 auto;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
    }
    #sheet.open { transform: translateY(0); }
    #sheetContent { overflow-y: auto; -webkit-overflow-scrolling: touch; flex: 1 1 auto; }
    #sheet h3 { font-size: 1rem; margin-bottom: 12px; text-align: center; }
    .build-opt {
      display: flex;
      align-items: center;
      gap: 10px;
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 8px 10px;
      margin-bottom: 8px;
      cursor: pointer;
    }
    .build-opt:active { background: var(--primary-soft); }
    .build-opt.locked { opacity: .5; }
    .build-opt .emoji { font-size: 1.8rem; }
    .build-opt .info { flex: 1; }
    .build-opt .bname { font-weight: 700; font-size: .95rem; }
    .build-opt .bdesc { font-size: .78rem; color: var(--muted); }
    .build-opt .bstat { font-size: .72rem; color: #1c7a4d; margin-top: 2px; font-weight: 700; }
    .build-opt .bcost { font-weight: 800; color: var(--gold); font-size: .95rem; white-space: nowrap; }
    .sheet-close {
      width: 100%;
      padding: 12px;
      border: none;
      background: var(--border);
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      flex-shrink: 0;
    }

    /* detail sheet reuse #sheet */
    .detail-row { font-size: .9rem; margin-bottom: 8px; }
    .detail-row b { color: var(--primary); }
    .demolish-btn {
      width: 100%;
      padding: 10px;
      border: 2px solid var(--danger);
      background: #fff;
      color: var(--danger);
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      font-size: .9rem;
    }
    .demolish-btn:active { background: #fde0e8; }
    .upgrade-btn {
      width: 100%; padding: 12px; border: none; background: var(--success); color: #fff;
      border-radius: 10px; font-weight: 800; cursor: pointer; margin-top: 12px; font-size: 1rem;
    }
    .upgrade-btn:active { opacity: .85; }

    /* toast */
    #toast {
      position: fixed;
      top: 16px; left: 50%;
      transform: translateX(-50%) translateY(-80px);
      background: #243042;
      color: #fff;
      padding: 10px 18px;
      border-radius: 20px;
      font-size: .9rem;
      font-weight: 600;
      transition: transform .3s;
      z-index: 100;
      max-width: 90%;
      text-align: center;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }

    #pickStudentMsg { text-align: center; padding: 40px 20px; color: var(--muted); }

    /* data backup panel */
    #dataPanel {
      margin-top: 18px;
      background: #fff;
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 14px;
    }
    .data-title { font-size: .95rem; color: var(--primary); margin-bottom: 10px; }
    .data-btns { display: flex; gap: 8px; flex-wrap: wrap; }
    .data-btn {
      flex: 1 1 calc(33% - 6px);
      min-width: 100px;
      padding: 10px 8px;
      border: 2px solid var(--primary);
      background: #fff;
      color: var(--primary);
      border-radius: 10px;
      font-weight: 700;
      font-size: .82rem;
      cursor: pointer;
    }
    .data-btn:active { background: var(--primary-soft); }
    .data-hint { font-size: .74rem; color: var(--muted); margin-top: 10px; line-height: 1.5; }
    .data-hint code { background: #eef3f8; padding: 1px 4px; border-radius: 4px; }
  </style>
</head>

<header>
  <h1>🏝️ My Island 我的島嶼</h1>

</header>

<div id="topBar">
  <div class="stu-group">
    <button class="stu-btn" onclick="selectStudent('albert')">Albert</button>
    <button class="stu-btn" onclick="selectStudent('jonathan')">Jonathan</button>
    <button class="stu-btn" style="opacity:.7" onclick="selectStudent('test')">🧪 測試</button>
  </div>
  <div class="coin-display" id="coinDisplay">🪙 —</div>
</div>

<div id="statsRow" style="display:none">
  <div><b id="stPop">0</b>人口</div>
  <div><b id="stFood">0</b>🍞食物</div>
  <div><b id="stBeauty">0</b>美化</div>
  <div><b id="stHappy">0</b>快樂</div>
  <div><b id="stProd">0</b>金幣/天</div>
  <div><b id="stBld">0</b>建築</div>
</div>

<main>
  <div id="notice"></div>
  <div id="questRow" style="display:none;gap:8px;margin:8px 0;flex-wrap:wrap">
    <button id="boardBtn" onclick="openBoard()" style="flex:1;min-width:130px;padding:10px;border:2px solid #b5651d;border-radius:12px;background:#fff3e0;color:#8a4a12;font-weight:800;cursor:pointer">📋 島民委託板</button>
    <button id="visitorBtn" onclick="openVisitor()" style="flex:1;min-width:130px;padding:10px;border:2px solid #2f80ed;border-radius:12px;background:#eaf3ff;color:#1e5fb8;font-weight:800;cursor:pointer">🛶 今日訪客</button>
    <a href="worddex.html" style="flex:1;min-width:130px;padding:10px;border:2px solid #7c4dca;border-radius:12px;background:#f3edff;color:#5a36a8;font-weight:800;text-align:center;text-decoration:none">🎴 單字圖鑑</a>
  </div>
  <div id="pickStudentMsg">👆 先選 Albert 或 Jonathan，開始蓋你的島！</div>
  <div id="island" style="display:none"></div>

  <div id="dataPanel" style="display:none">
    <h2 class="data-title">💾 進度備份</h2>
    <div class="data-btns">
      <button class="data-btn" onclick="exportSave()">⬇️ 匯出備份</button>
      <button class="data-btn" onclick="document.getElementById('importFile').click()">📂 從檔案匯入</button>
      <button class="data-btn" onclick="restoreFromGoogle()">☁️ 從 Google 還原</button>
    </div>
    <input type="file" id="importFile" accept="application/json,.json" style="display:none" onchange="importSave(event)" />
    <p class="data-hint">換手機 / 平板時用得到。「☁️ 從 Google 還原」會列出雲端近 10 天的存檔，可以選某一天還原（金幣、答題、島嶼會一起回到那天）。</p>
  </div>
</main>

<!-- bottom sheet -->
<div id="sheet">
  <div id="sheetContent"></div>
  <button class="sheet-close" onclick="closeSheet()">關閉</button>
</div>

<div id="toast"></div>

// 索引 = 城鎮中心等級-1（Lv1..Lv5）。動物另有解鎖門檻：丘陵 Lv2 / 高山 Lv3 / 海洋 Lv4。
const CATEGORY_MAX_BY_LEVEL = {
  hills:    [1, 1, 2, 3, Infinity],   // Lv2:1 → Lv3:2 → Lv4:3 → Lv5:∞
  mountain: [2, 2, 2, 3, Infinity],   // Lv3:2 → Lv4:3 → Lv5:∞
  ocean:    [2, 2, 2, 2, Infinity],   // Lv4:2 → Lv5:∞
};
function catMax(cat) {
  const lv = Math.max(1, Math.min(5, centerLevel() || 1));
  const arr = CATEGORY_MAX_BY_LEVEL[cat];
  return arr ? arr[lv - 1] : 1;
}

// 快樂值：居民與美化的平衡。每位居民需要 ~1.2 美化分；不足會降低快樂。
const BEAUTY_PER_POP = 1.2;
function happinessOf(pop, beauty) {
  if (pop <= 0) return 100;
  return Math.max(0, Math.min(100, Math.round(100 * beauty / (pop * BEAUTY_PER_POP))));
}
// 每日收入倍率：快樂 0%→收入 60%，快樂 100%→收入 120%（高快樂有加成）
function incomeMult(h) { return 0.6 + 0.6 * (h / 100); }
function reqCenterFor(key) { return REQ_CENTER[key] || 0; }
function centerLevel() { const c = island.buildings.find(b => b.type === "center"); return c ? c.level : 0; }

// 升級到 15×15 地圖：把不在平地上的舊建築拆除並退還金幣
let lastMigration = { removed: 0, refund: 0 };
function migrateIsland(isl, student) {
  lastMigration = { removed: 0, refund: 0 };
  if (isl.schemaVersion >= 2 && isl.grid && isl.grid.width === GRID) return false;
  isl.schemaVersion = 2;
  isl.grid = { width: GRID, height: GRID };
  let refunded = 0, removed = 0;
  const kept = [];
  (isl.buildings || []).forEach(b => {
    const cat = BUILDINGS[b.type];
    const okTerrain = cat && (cat.terrain || ["P"]).includes(terrainAt(b.x, b.y));
    if (okTerrain) { kept.push(b); }
    else { refunded += (cat && cat.cost) || 0; removed++; }
  });
  isl.buildings = kept;
  if (refunded > 0) {
    const p = getProgress(student);
    p.coins.balance += refunded;
    p.coins.lifetimeEarned += refunded;
    p.coins.transactions.push({ type: "earn", source: "mapMigration", amount: refunded,
      balanceAfter: p.coins.balance, createdAt: new Date().toISOString(), meta: { removed } });
    saveProgress(student, p);
  }
  lastMigration = { removed: removed, refund: refunded };
  return true;
}
function saveIsland(s, isl) {
  isl.updatedAt = new Date().toISOString();
  localStorage.setItem("kidsIsland." + s, JSON.stringify(isl));
}

// ─── Daily tick: grow buildings + collect production ────────────────────────
function runDailyTick() {
  const today = todayStr();
  if (island.lastProcessedDate === today) return 0;
  // count number of days passed (at least 1)
  let totalProduced = 0;
  island.buildings.forEach(b => {
    const cat = BUILDINGS[b.type];
    b.activeDays = (b.activeDays || 0) + 1;
    // level up by activeDays thresholds (城鎮中心除外，它靠人口+美化達標升級)
    const maxLv = cat.maxLevel || 3;
    if (cat.levelDays && b.level < maxLv) {
      const need = cat.levelDays[b.level - 1];   // 升到下一級所需天數
      if (need != null && b.activeDays >= need) b.level++;
    }
    // production（先累計原始產量,稍後依快樂值打折；含合併星星倍率）
    const produce = Math.round((cat.coin[b.level - 1] || 0) * starMult(b));
    if (produce > 0 && b.lastProductionDate !== today) {
      totalProduced += produce;
      b.lastProductionDate = today;
    }
  });
  island.lastProcessedDate = today;
  recalcStats();  // 取得當下快樂值
  totalProduced = Math.round(totalProduced * incomeMult(island.stats.happiness));  // 快樂值影響每日收入
  // 多餘食物自動賣掉：3 🍞 = 1 🪙（市場價,不受快樂影響）
  const _surplus = Math.max(0, (island.stats.food || 0) - (island.stats.foodNeed || 0));
  const _foodCoins = Math.floor(_surplus / 3);
  if (_foodCoins > 0) totalProduced += _foodCoins;
  if (totalProduced > 0) {
    const p = getProgress(currentStudent);
    p.coins.balance += totalProduced;
    p.coins.lifetimeEarned += totalProduced;
    p.coins.transactions.push({ type: "earn", source: "islandProduction", amount: totalProduced,
      balanceAfter: p.coins.balance, createdAt: new Date().toISOString(), meta: { date: today } });
    saveProgress(currentStudent, p);
    island.events.push({ id: "prod-" + today, type: "production", date: today,
      message: `島嶼生產了 ${totalProduced} 金幣${_foodCoins > 0 ? `（含賣出多餘食物 🍞${_surplus} → 🪙${_foodCoins}）` : ""}`, coinsDelta: totalProduced, seen: false });
  }
  recalcStats();
  saveIsland(currentStudent, island);
  return totalProduced;
}

// ─── Stats ──────────────────────────────────────────────────────────────────
let TERRAIN_BEAUTY = null;
function terrainBeauty() {
  if (TERRAIN_BEAUTY === null) {
    let b = 0;
    for (let y = 0; y < GRID; y++) for (let x = 0; x < GRID; x++) {
      const t = TERRAIN_MAP[y][x];
      if (t === "H") b += 1; else if (t === "M") b += 2;
    }
    TERRAIN_BEAUTY = b;
  }
  return TERRAIN_BEAUTY;
}

// 合併星星倍率：每顆 🌟 +50%（人口/美化/金幣都乘）
function starMult(b) { return 1 + 1.0 * (b.star || 0); }
function recalcStats() {
  let pop = 0, cap = 0, beauty = terrainBeauty(), baseProd = 0, food = 0;  // 地形提供基礎美化分
  island.buildings.forEach(b => {
    const cat = BUILDINGS[b.type];
    const m = starMult(b);
    cap += Math.round((cat.pop[b.level - 1] || 0) * m);
    beauty += Math.round((cat.beauty[b.level - 1] || 0) * m);
    baseProd += Math.round((cat.coin[b.level - 1] || 0) * m);
    if (cat.food) food += Math.round((cat.food[b.level - 1] || 0) * m);
  });
  pop = cap;  // 人口成長到容量
  // 食物：每位居民吃 1 食物；不夠 → 快樂打折（最低打到 3 折，避免歸零太挫折）
  const foodNeed = pop;
  const foodRate = pop > 0 ? Math.max(0.3, Math.min(1, food / foodNeed)) : 1;
  const happiness = Math.round(happinessOf(pop, beauty) * foodRate);
  const dailyCoinProduction = Math.round(baseProd * incomeMult(happiness));  // 快樂值影響收入
  island.stats = { population: pop, populationCapacity: cap, beauty, happiness, food, foodNeed, foodRate,
                   baseProduction: baseProd, dailyCoinProduction, totalBuildings: island.buildings.length };
}

  document.getElementById("stBeauty").textContent = island.stats.beauty;

          : `<span class="pet-dog">🐶</span>`;

        tile.onclick = () => tapDog(b);
      } else if (b) {
        const cat = BUILDINGS[b.type];
        if (b.level > 1) tile.classList.add("lv" + Math.min(b.level, 5));   // 等級外框顏色
        if (cat.img) {
          tile.innerHTML = `<img class="tile-img" src="island_img/${b.type}.png" alt="${cat.name}" onerror="this.replaceWith(document.createTextNode('${cat.emoji}'))">`;
        } else {
          tile.innerHTML = `<span class="tile-emoji">${cat.emoji}</span>`;
        }
        if (b.star > 0) tile.innerHTML += `<span class="star-badge">🌟${b.star > 1 ? b.star : ""}</span>`;
        if (mergeState && _isMergeTarget(b)) tile.classList.add("merge-cand");
        tile.onclick = mergeState ? (() => tapDuringMerge(b)) : (() => openDetail(b));
      } else {
        if (t === "H") tile.textContent = "⛰️";
        else if (t === "M") tile.textContent = "🏔️";
        if (mergeState) tile.onclick = () => cancelMerge();
        else if (buildableOn(t)) tile.onclick = () => openBuild(x, y);
        else tile.onclick = () => toast(TERR_NAME[t] + "不能蓋建築");
      }
      grid.appendChild(tile);
    }
  }
}

// ─── Build sheet ─────────────────────────────────────────────────────────────
function countType(key) { return island.buildings.filter(b => b.type === key).length; }
function countCategory(cat) { return island.buildings.filter(b => BUILDINGS[b.type].category === cat).length; }
function canBuild(key) {
  const c = BUILDINGS[key];
  if (c.unique && countType(key) >= 1) return false;
  if (c.max && countType(key) >= c.max) return false;
  if (c.category && countCategory(c.category) >= catMax(c.category)) return false;
  return true;
}
// ── 圖鑑地標 / 禮物券 / 訪客商品 的解鎖判斷 ──────────────────────────────────
function dexWeekWords(n) {
  try { const w = allWeeks().find(x => x.n === n && x.month.month === "2026-07"); return w ? w.words : null; } catch (e) { return null; }
}
function dexUnlocked(n) {
  const words = dexWeekWords(n); if (!words) return false;
  const p = getProgress(currentStudent);
  return (typeof dexThemeComplete === "function") && dexThemeComplete(p, words);
}
function specialLock(key) {   // 回傳鎖定原因文字；null = 沒鎖
  const c = BUILDINGS[key];
  if (c.dex && !dexUnlocked(c.dex)) {
    const w = dexWeekWords(c.dex);
    const p = getProgress(currentStudent);
    const st = (w && typeof dexThemeStats === "function") ? dexThemeStats(p, w) : { collected: 0, total: 30 };
    return `🔒 圖鑑 ${st.collected}/${st.total}`;
  }
  if (c.gift && !((island.giftAvail || 0) > 0)) return "🔒 需要禮物券";
  if (c.visitor && !((island.visitorStock && island.visitorStock[key]) > 0)) return "🔒 訪客未上架";
  return null;
}
function buildableOn(t) {
  return BUILD_ORDER.some(key => (BUILDINGS[key].terrain || ["P"]).includes(t));
}

// 建築數值摘要（Lv1→滿級）：🍞食物 🪙金幣 👥人口 🌸美化
function _statLine(c) {
  const maxLv = c.maxLevel || 3, parts = [];
  const rng = a => a[0] === a[maxLv-1] ? a[0] : a[0] + "→" + a[maxLv-1];
  if (c.food && c.food[maxLv-1] > 0) parts.push("🍞" + rng(c.food));
  if (c.coin[maxLv-1] > 0) parts.push("🪙" + rng(c.coin) + "/天");
  if (c.pop[maxLv-1] > 0) parts.push("👥" + rng(c.pop));
  if (c.beauty[maxLv-1] > 0) parts.push("🌸" + rng(c.beauty));
  return parts.join("　");
}
function openBuild(x, y) {
  selectedTile = { x, y };
  const t = terrainAt(x, y);
  const p = getProgress(currentStudent);
  const bal = p.coins.balance;
  const lvl = centerLevel();
  const list = BUILD_ORDER.filter(key => (BUILDINGS[key].terrain || ["P"]).includes(t) && canBuild(key));
  let html = `<h3>${TERR_NAME[t]} — 蓋什麼？（你有 🪙 ${bal}）</h3>`;
  if (!list.length) html += `<p style="color:var(--muted);font-size:.9rem">這裡目前沒有可蓋的（可能已達數量上限）。</p>`;
  list.forEach(key => {
    const c = BUILDINGS[key];
    const req = reqCenterFor(key);
    const sLock = specialLock(key);
    const locked = lvl < req || !!sLock;
    const afford = bal >= c.cost;
    const clickable = !locked && afford;
    const costLabel = sLock ? sLock : (lvl < req) ? `🔒 城鎮中心 Lv${req}` : (c.cost === 0 ? "免費" : `🪙 ${c.cost}`);
    const icon = c.img
      ? `<img class="opt-img" src="island_img/${key}.png" alt="${c.name}" onerror="this.replaceWith(document.createTextNode('${c.emoji}'))">`
      : `<span style="font-size:1.8rem">${c.emoji}</span>`;
    html += `
      <div class="build-opt ${clickable ? "" : "locked"}" ${clickable ? `onclick="build('${key}')"` : ""}>
        <div class="emoji">${icon}</div>
        <div class="info">
          <div class="bname">${c.name}</div>
          <div class="bdesc">${c.desc}</div>
          <div class="bstat">${_statLine(c)}</div>
        </div>
        <div class="bcost">${costLabel}</div>
      </div>`;
  });
  document.getElementById("sheetContent").innerHTML = html;
  document.getElementById("sheet").classList.add("open");
}

function build(key) {
  const c = BUILDINGS[key];
  if (!selectedTile || !(c.terrain || ["P"]).includes(terrainAt(selectedTile.x, selectedTile.y))) { toast(`只能蓋在${(c.terrain||["P"]).map(t=>TERR_NAME[t]).join("/")}上`); return; }
  if (c.unique && countType(key) >= 1) { toast("已經有一個了"); return; }
  if (c.max && countType(key) >= c.max) { toast(`${c.name}最多 ${c.max} 個`); return; }
  if (c.category && countCategory(c.category) >= catMax(c.category)) { toast(`${CAT_NAME[c.category] || "這類動物"}最多 ${catMax(c.category)} 隻`); return; }
  if (centerLevel() < reqCenterFor(key)) { toast(`需要城鎮中心 Lv${reqCenterFor(key)} 才能蓋`); return; }
  const _sl = specialLock(key); if (_sl) { toast(_sl); return; }
  const p = getProgress(currentStudent);
  if (p.coins.balance < c.cost) { toast("金幣不夠！"); return; }
  if (c.gift) island.giftAvail = (island.giftAvail || 0) - 1;                       // 消耗禮物券
  if (c.visitor) island.visitorStock[key] = (island.visitorStock[key] || 0) - 1;    // 消耗上架商品
  p.coins.balance -= c.cost;
  p.coins.lifetimeSpent += c.cost;
  p.coins.transactions.push({ type: "spend", source: "islandBuild", amount: c.cost,
    balanceAfter: p.coins.balance, createdAt: new Date().toISOString(),
    meta: { buildingType: key, x: selectedTile.x, y: selectedTile.y } });
  saveProgress(currentStudent, p);

  const _paidCost = c.cost;
  island.buildings.push({
    paid: _paidCost,
    id: "b-" + Date.now() + "-" + selectedTile.x + "-" + selectedTile.y,
    type: key, x: selectedTile.x, y: selectedTile.y, level: 1,
    createdAt: new Date().toISOString(), lastProductionDate: null,
    activeDays: 0, customName: "", state: { isProducing: c.coin[0] > 0, isDecorative: c.beauty[0] > 0 },
  });
  recalcStats();
  saveIsland(currentStudent, island);
  closeSheet();
  render();
  if (typeof cloudSave === "function") cloudSave(currentStudent);
  toast(`${c.emoji} ${c.name} 蓋好了！`);
}

      const pop = island.stats.population, beauty = island.stats.beauty;
      const popOk = pop >= t.pop, beautyOk = beauty >= t.beauty;
      html += `<div class="detail-row" style="margin-top:6px">升到 Lv${b.level+1} 需要：</div>`;
      html += `<div class="detail-row" style="color:${popOk ? "var(--success)" : "var(--danger)"}">　人口 ${pop} / ${t.pop} ${popOk ? "✅" : ""}</div>`;
      html += `<div class="detail-row" style="color:${beautyOk ? "var(--success)" : "var(--danger)"}">　美化 ${beauty} / ${t.beauty} ${beautyOk ? "✅" : ""}</div>`;
      if (popOk && beautyOk) {
        html += `<button class="upgrade-btn" onclick="upgradeCenter('${b.id}')">⬆️ 升級城鎮中心！</button>`;
      } else {

      }

      html += `<div class="detail-row" style="color:var(--success)">城鎮中心已達最高等級 Lv${maxLv}！🏆</div>`;
    }
  } else if (c.levelDays) {
    const nextDays = b.level < maxLv ? c.levelDays[b.level - 1] : null;
    if (nextDays != null) html += `<div class="detail-row" style="color:var(--muted)">再過 <b>${Math.max(0, nextDays - b.activeDays)}</b> 天升到 Lv${b.level+1} ⬆️</div>`;
    else html += `<div class="detail-row" style="color:var(--success)">已經是最高等級 Lv${maxLv}！⭐</div>`;
  }

  // 合併升級：滿級 + 星未滿 + 有另一棟同類同星滿級的
  if (_canMergeType(b.type) && _atMaxLevel(b) && (b.star || 0) < MERGE_MAX_STAR) {
    const partners = _mergePartners(b);
    const fee = mergeCost(c, (b.star || 0) + 1);
    if (partners.length > 0) {
      html += `<button class="upgrade-btn" onclick="startMerge('${b.id}')">✨ 合併升級 → ${c.name}${"🌟".repeat((b.star || 0) + 1)} Lv1（🪙 ${fee}）</button>`;

  const refundLabel = refund === 0 ? "免費蓋的，拆除不退幣" : `🛠️ 拆除（退還 🪙 ${refund}）`;
  html += `<button class="demolish-btn" onclick="demolish('${b.id}')">${refundLabel}</button>`;
  document.getElementById("sheetContent").innerHTML = html;
  document.getElementById("sheet").classList.add("open");
}

function upgradeCenter(buildingId) {
  const b = island.buildings.find(x => x.id === buildingId);
  if (!b || b.type !== "center" || b.level >= (BUILDINGS.center.maxLevel || 5)) return;
  const t = CENTER_TARGETS[b.level - 1];
  if (island.stats.population < t.pop || island.stats.beauty < t.beauty) { toast("還沒達標喔"); return; }
  b.level++;
  recalcStats();
  saveIsland(currentStudent, island);
  closeSheet();
  render();
  if (typeof cloudSave === "function") cloudSave(currentStudent);
  toast(`🏛️ 城鎮中心升到 Lv${b.level}！🎉`);
}

const LEGACY_COSTS = { town: 400, solar: 220, windmill: 320, dock: 300, fishery: 360, oceanboat: 780, butterfly: 760, bear: 1050, salamander: 900, turtle: 950, dolphin: 1100, coral: 850, horseshoecrab: 880 };
// ─── 合併系統：兩棟同類型、同星、都滿級 → 保留第一棟 +1🌟、回到 Lv1（付費）─────
let mergeState = null;   // { firstId, type, star }
const MERGE_MAX_STAR = 5;
function mergeCost(c, newStar) { return Math.max(20, Math.round(c.cost * 0.25)) * newStar; }
function _atMaxLevel(b) { const c = BUILDINGS[b.type]; return b.level >= (c.maxLevel || 3); }
function _canMergeType(key) {
  const c = BUILDINGS[key];
  return c.cost > 0 && !c.unique && !c.pet && key !== "center";
}
function _mergePartners(b) {
  return island.buildings.filter(x => x.id !== b.id && x.type === b.type &&
    (x.star || 0) === (b.star || 0) && _atMaxLevel(x));
}
function _isMergeTarget(b) {
  return mergeState && b.id !== mergeState.firstId && b.type === mergeState.type &&
    (b.star || 0) === mergeState.star && _atMaxLevel(b);
}
function startMerge(buildingId) {
  const b = island.buildings.find(x => x.id === buildingId);
  if (!b) return;
  mergeState = { firstId: b.id, type: b.type, star: (b.star || 0) };
  closeSheet(); render();
  toast(`點另一棟滿級的 ${BUILDINGS[b.type].name} 完成合併（點空地取消）`);
}
function cancelMerge() { mergeState = null; render(); toast("已取消合併"); }
function tapDuringMerge(b) {
  if (!_isMergeTarget(b)) { cancelMerge(); return; }
  const first = island.buildings.find(x => x.id === mergeState.firstId);
  if (!first) { cancelMerge(); return; }
  const c = BUILDINGS[first.type];
  const newStar = (first.star || 0) + 1;
  const fee = mergeCost(c, newStar);
  const p = getProgress(currentStudent);
  if (p.coins.balance < fee) { toast(`金幣不夠！合併需要 🪙 ${fee}`); cancelMerge(); return; }
  p.coins.balance -= fee;
  p.coins.lifetimeSpent += fee;
  p.coins.transactions.push({ type: "spend", source: "islandMerge", amount: fee,
    balanceAfter: p.coins.balance, createdAt: new Date().toISOString(),
    meta: { buildingType: first.type, star: newStar } });
  saveProgress(currentStudent, p);
  island.buildings = island.buildings.filter(x => x.id !== b.id);   // 第二棟消失
  first.star = newStar; first.level = 1; first.activeDays = 0;      // 保留棟 +1🌟 回 Lv1
  mergeState = null;
  recalcStats(); saveIsland(currentStudent, island); render();
  if (typeof cloudSave === "function") cloudSave(currentStudent);
  toast(`✨ 合併成功！${c.emoji} ${c.name}${"🌟".repeat(newStar)} Lv1`);
}

function demolish(buildingId) {
  const idx = island.buildings.findIndex(b => b.id === buildingId);
  if (idx < 0) return;
  const b = island.buildings[idx];
  const c = BUILDINGS[b.type];
  const refund = (b.paid != null) ? b.paid : (LEGACY_COSTS[b.type] != null ? LEGACY_COSTS[b.type] : c.cost); // 退「當時買價」，防漲價套利
  island.buildings.splice(idx, 1);
  const p = getProgress(currentStudent);
  p.coins.balance += refund;
  p.coins.transactions.push({ type: "earn", source: "islandDemolish", amount: refund,
    balanceAfter: p.coins.balance, createdAt: new Date().toISOString(),
    meta: { buildingType: b.type, x: b.x, y: b.y } });
  saveProgress(currentStudent, p);
  recalcStats();
  saveIsland(currentStudent, island);
  closeSheet();
  render();
  if (typeof cloudSave === "function") cloudSave(currentStudent);
  toast(`${c.emoji} 拆除了，退還 🪙 ${refund}`);
}

const GIFT_EVERY = 5;                       // 每完成 5 天委託送 1 張禮物券
const TRADE_KEYS = ["balloon", "statue", "flowerclock"];
const VISITORS = [
  { emoji: "🧑‍✈️", name: "飛行員 Leo" }, { emoji: "👵", name: "奶奶 May" }, { emoji: "🧜‍♀️", name: "人魚 Nana" },
  { emoji: "🦉", name: "貓頭鷹博士" }, { emoji: "🏴‍☠️", name: "海盜 Jack" }
];
function _learnedWords() {
  try {
    const t = todayStr();
    const ws = allWeeks().filter(w => w.start <= t);
    const pool = (ws.length ? ws : allWeeks().slice(0, 1)).flatMap(w => w.words);
    return pool.length ? pool : null;
  } catch (e) { return null; }
}
function _mcOptions(ans, pool, n) {
  const opts = [ans]; const used = new Set([ans.en, ans.zh]);
  const sh = pool.slice().sort(() => Math.random() - .5);
  for (const w of sh) { if (opts.length >= n) break; if (used.has(w.en) || used.has(w.zh)) continue; used.add(w.en); used.add(w.zh); opts.push(w); }
  return opts.sort(() => Math.random() - .5);
}
function updateQuestBtns() {
  const t = todayStr();
  const b = document.getElementById("boardBtn"), v = document.getElementById("visitorBtn");
  if (b) { const done = island.board && island.board.last === t; b.textContent = done ? "📋 今日委託完成 ✅" : "📋 島民委託板"; b.style.opacity = done ? ".55" : "1"; }
  if (v) { const done = island.visitor && island.visitor.last === t; v.textContent = done ? "🛶 訪客已離開 ✅" : "🛶 今日訪客"; v.style.opacity = done ? ".55" : "1"; }
}
let _bq = null;
function openBoard() {
  if (island.board && island.board.last === todayStr()) { toast("今天的委託完成了，明天再來！"); return; }
  const pool = _learnedWords(); if (!pool) { toast("題庫還沒準備好"); return; }
  const picks = pool.slice().sort(() => Math.random() - .5).slice(0, 3);
  _bq = { qs: picks.map(w => ({ w, opts: _mcOptions(w, pool, 3) })), done: 0, ok: 0 };
  let h = `<h3>📋 島民委託板</h3><p style="color:var(--muted);font-size:.85rem;margin:4px 0 10px">島民需要你幫忙！選出正確的英文（每天一次，完成 ${GIFT_EVERY} 天送 1 張禮物券 🎁）</p>`;
  _bq.qs.forEach((q, i) => {
    h += `<div id="bq${i}" style="border-top:1px dashed #eee;padding:10px 0">
      <div style="font-weight:700;margin-bottom:6px">${i + 1}. 「${q.w.zh}」的英文是？</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">${q.opts.map((o, oi) => `<button onclick="boardAns(${i},${oi})" style="padding:9px 14px;border:2px solid #d9e2ec;border-radius:10px;background:#fff;font-weight:700;cursor:pointer">${o.en}</button>`).join("")}</div></div>`;
  });
  h += `<div id="boardMsg" style="font-weight:800;margin-top:10px"></div>`;
  document.getElementById("sheetContent").innerHTML = h;
  document.getElementById("sheet").classList.add("open");
}
function boardAns(i, oi) {
  const q = _bq.qs[i], box = document.getElementById("bq" + i);
  if (box.dataset.done) return; box.dataset.done = "1";
  const ok = q.opts[oi].en === q.w.en;
  box.querySelectorAll("button").forEach((b, bi) => { b.disabled = true;
    if (q.opts[bi].en === q.w.en) { b.style.borderColor = "#2fbf71"; b.style.background = "#d9f7e8"; }
    else if (bi === oi) { b.style.borderColor = "#ef476f"; b.style.background = "#fde0e8"; } });
  _bq.done++; if (ok) _bq.ok++;
  if (_bq.done === _bq.qs.length) finishBoard();
}
function finishBoard() {
  const earned = _bq.ok * 10 + (_bq.ok === 3 ? 10 : 0);
  const p = getProgress(currentStudent);
  p.coins.balance += earned; p.coins.lifetimeEarned += earned;
  p.coins.transactions.push({ type: "earn", source: "islandBoard", amount: earned, balanceAfter: p.coins.balance, createdAt: new Date().toISOString(), meta: { ok: _bq.ok } });
  saveProgress(currentStudent, p);
  island.board = { last: todayStr(), total: ((island.board && island.board.total) || 0) + 1 };
  let giftMsg = "";
  if (island.board.total % GIFT_EVERY === 0) { island.giftAvail = (island.giftAvail || 0) + 1; giftMsg = `<br>🎁 完成 ${island.board.total} 天委託，得到 1 張禮物券！去空地蓋 📮🧺🏮`; }
  saveIsland(currentStudent, island);
  if (typeof cloudSave === "function") cloudSave(currentStudent);
  document.getElementById("boardMsg").innerHTML = `🎉 答對 ${_bq.ok}/3，島民送你 🪙 ${earned}！${giftMsg}`;
  recalcStats(); render(); updateQuestBtns();
}
let _vq = null, _vAudio = null;
function _playWordIsland(en) {
  if (_vAudio) _vAudio.pause();
  const k = (typeof wordAudioKey === "function") ? wordAudioKey(en) : en.toLowerCase().replace(/[^a-z0-9]+/g, "");
  _vAudio = new Audio("audio/words/" + k + ".mp3");
  _vAudio.play().catch(() => { if (window.speechSynthesis) { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(en); u.lang = "en-US"; speechSynthesis.speak(u); } });
}
function openVisitor() {
  if (island.visitor && island.visitor.last === todayStr()) { toast("今天的訪客已經離開了，明天再來！"); return; }
  const pool = _learnedWords(); if (!pool) { toast("題庫還沒準備好"); return; }
  const dayN = Math.floor(Date.parse(todayStr()) / 86400000);
  const who = VISITORS[dayN % VISITORS.length];
  const tradeKey = TRADE_KEYS[dayN % TRADE_KEYS.length];
  const picks = pool.slice().sort(() => Math.random() - .5).slice(0, 3);
  _vq = { qs: picks.map(w => ({ w, opts: _mcOptions(w, pool, 3) })), done: 0, ok: 0, tradeKey };
  const tc = BUILDINGS[tradeKey];
  let h = `<h3>${who.emoji} ${who.name} 來訪！</h3>
    <p style="color:var(--muted);font-size:.85rem;margin:4px 0 10px">「聽我唸的單字，選出正確的字！答對 2 題，我就把 <b>${tc.emoji} ${tc.name}</b>（特價 🪙${tc.cost}）上架給你。」</p>`;
  _vq.qs.forEach((q, i) => {
    h += `<div id="vq${i}" style="border-top:1px dashed #eee;padding:10px 0">
      <div style="font-weight:700;margin-bottom:6px">${i + 1}. <button onclick="_playWordIsland('${q.w.en.replace(/'/g, "\\'")}')" style="padding:5px 12px;border:none;border-radius:9px;background:#2f80ed;color:#fff;font-weight:700;cursor:pointer">🔊 點我聽</button></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">${q.opts.map((o, oi) => `<button class="vopt" onclick="visitorAns(${i},${oi})" style="padding:9px 14px;border:2px solid #d9e2ec;border-radius:10px;background:#fff;font-weight:700;cursor:pointer">${o.en}</button>`).join("")}</div></div>`;
  });
  h += `<div id="visitorMsg" style="font-weight:800;margin-top:10px"></div>`;
  document.getElementById("sheetContent").innerHTML = h;
  document.getElementById("sheet").classList.add("open");
}
function visitorAns(i, oi) {
  const q = _vq.qs[i], box = document.getElementById("vq" + i);
  if (box.dataset.done) return; box.dataset.done = "1";
  const ok = q.opts[oi].en === q.w.en;
  box.querySelectorAll(".vopt").forEach((b, bi) => { b.disabled = true;
    if (q.opts[bi].en === q.w.en) { b.style.borderColor = "#2fbf71"; b.style.background = "#d9f7e8"; }
    else if (bi === oi) { b.style.borderColor = "#ef476f"; b.style.background = "#fde0e8"; } });
  _vq.done++; if (ok) _vq.ok++;
  if (_vq.done === _vq.qs.length) finishVisitor();
}
function finishVisitor() {
  const msg = document.getElementById("visitorMsg");
  if (_vq.ok >= 2) {
    if (!island.visitorStock) island.visitorStock = {};
    island.visitorStock[_vq.tradeKey] = (island.visitorStock[_vq.tradeKey] || 0) + 1;
    island.visitor = { last: todayStr() };
    saveIsland(currentStudent, island);
    if (typeof cloudSave === "function") cloudSave(currentStudent);
    const tc = BUILDINGS[_vq.tradeKey];
    msg.innerHTML = `🎉 答對 ${_vq.ok}/3！${tc.emoji} ${tc.name} 已上架，去空地用特價 🪙${tc.cost} 蓋它！`;
    updateQuestBtns();
  } else {
    msg.innerHTML = `答對 ${_vq.ok}/3，差一點！再試一次 👇 <button onclick="openVisitor()" style="padding:6px 14px;border:none;border-radius:9px;background:#2f80ed;color:#fff;font-weight:700;cursor:pointer">重新挑戰</button>`;
  }
}

// ─── Student select ──────────────────────────────────────────────────────────
function selectStudent(name) {
  if (typeof requireUnlock === "function" && !requireUnlock(name)) return;
  currentStudent = name;
  localStorage.setItem("kidsCurrentStudent", name);
  document.querySelectorAll(".stu-btn").forEach(b => b.classList.toggle("active", b.textContent.toLowerCase() === name));
  island = loadIsland(name);
  const migrated = migrateIsland(island, name);
  document.getElementById("pickStudentMsg").style.display = "none";
  document.getElementById("island").style.display = "grid";
  document.getElementById("statsRow").style.display = "flex";
  document.getElementById("dataPanel").style.display = "block";
  document.getElementById("questRow").style.display = "flex";
  updateQuestBtns();
  recalcStats();
  if (migrated) saveIsland(name, island);
  const produced = runDailyTick();
  render();
  const notice = document.getElementById("notice");
  if (lastMigration.removed > 0) {
    notice.style.display = "block";
    notice.innerHTML = `🗺️ 島嶼升級成 15×15！有 <b>${lastMigration.removed}</b> 個不在平地上的建築被拆除，退還 <b>🪙 ${lastMigration.refund}</b> 金幣。`;
  } else if (migrated) {
    notice.style.display = "block";
    notice.innerHTML = `🗺️ 島嶼已升級成 15×15 新地圖！海洋 / 丘陵 / 高山只能在平地蓋建築。`;
  } else if (produced > 0) {
    notice.style.display = "block";
    notice.innerHTML = `🌅 新的一天！島嶼建築生產了 <b>🪙 ${produced}</b> 金幣！（含賣出多餘食物）`;
  } else {
    notice.style.display = "none";
  }
  // 本機空 → 從雲端拉回（新/測試平板自動載入真實進度）；本機有 → 上傳備份
  if (typeof cloudSyncOnOpen === "function") cloudSyncOnOpen(currentStudent, () => selectStudent(currentStudent));
}

// ─── 匯出 / 匯入 / 雲端還原 ──────────────────────────────────────────────────
function buildSaveBundle(student) {
  return {
    type: "kids-english-save",
    version: 1,
    student,
    exportedAt: new Date().toISOString(),
    progress: getProgress(student),
    island: loadIsland(student),
  };
}

function exportSave() {
  if (!currentStudent) { toast("先選學生"); return; }
  const bundle = buildSaveBundle(currentStudent);
  const json = JSON.stringify(bundle, null, 2);
  const blob = new Blob([json], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = currentStudent + ".json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(a.href);
  toast(`已匯出 ${currentStudent}.json`);
}

function applyBundle(bundle) {
  if (!bundle || bundle.type !== "kids-english-save" || !bundle.student) {
    toast("檔案格式不對 😅"); return false;
  }
  const s = bundle.student;
  if (bundle.progress) saveProgress(s, bundle.progress);
  if (bundle.island)   localStorage.setItem("kidsIsland." + s, JSON.stringify(bundle.island));
  selectStudent(s);
  toast(`已還原 ${s} 的進度 🎉`);
  return true;
}

function importSave(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try { applyBundle(JSON.parse(e.target.result)); }
    catch (err) { toast("讀取失敗 😅"); }
  };
  reader.readAsText(file);
  event.target.value = "";
}

// 從 Google 試算表還原：列出近 10 天每日快照 → 選日期 → 還原該天完整進度
function restoreFromGoogle() {
  if (!currentStudent) { toast("先選學生"); return; }
  if (typeof cloudListHistory !== "function" || !CLOUD_URL) { toast("還沒設定 Google 同步"); return; }
  toast("讀取雲端紀錄中…");
  cloudListHistory(currentStudent).then(items => {
    if (!items || !items.length) { toast(`Google 上還沒有 ${currentStudent} 的存檔`); return; }
    openRestoreModal(items);
  });
}

function openRestoreModal(items) {
  const old = document.getElementById("restoreModal");
  if (old) old.remove();
  const wrap = document.createElement("div");
  wrap.id = "restoreModal";
  wrap.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px;";
  const card = document.createElement("div");
  card.style.cssText = "background:#fff;border-radius:16px;max-width:420px;width:100%;max-height:80vh;overflow:auto;padding:18px;box-sizing:border-box;";
  let html = `<h3 style="margin:0 0 4px">☁️ 選擇要還原的日期</h3>
    <p style="margin:0 0 12px;color:#666;font-size:13px">${currentStudent}　近 ${items.length} 天的存檔</p>`;
  items.forEach(it => {
    const s = it.summary || {};
    html += `<button class="restore-day" data-date="${it.date}" style="display:block;width:100%;text-align:left;border:1px solid #e2e2e2;border-radius:12px;padding:10px 12px;margin-bottom:8px;background:#fafafa;cursor:pointer">
      <b style="font-size:15px">${it.date}</b>
      <div style="font-size:12px;color:#555;margin-top:4px">🪙${s.coins||0}　👥${s.population||0}　🌸${s.beauty||0}　😊${s.happiness||0}%　🏠${s.buildings||0}　✅${s.correct||0}</div>
    </button>`;
  });
  html += `<button id="restoreCancel" style="width:100%;border:0;border-radius:12px;padding:10px;background:#eee;cursor:pointer;margin-top:4px">取消</button>`;
  card.innerHTML = html;
  wrap.appendChild(card);
  document.body.appendChild(wrap);
  wrap.addEventListener("click", e => { if (e.target === wrap) wrap.remove(); });
  card.querySelector("#restoreCancel").onclick = () => wrap.remove();
  card.querySelectorAll(".restore-day").forEach(btn => {
    btn.onclick = () => {
      const date = btn.dataset.date;
      if (!confirm(`要把 ${currentStudent} 的進度還原到 ${date} 那天嗎？\n金幣、答題、島嶼都會回到那天的狀態。`)) return;
      cloudLoadDate(currentStudent, date).then(d => {
        if (!d) { toast("還原失敗 😅"); return; }
        wrap.remove();
        selectStudent(currentStudent);   // 重讀 localStorage 重畫，並自動上傳成為最新
        toast(`已還原到 ${date} 🎉`);
      });
    };
  });
}

// 自動選學生由 supabase_auth.js 的 auto-gate 處理；沒 Supabase 時才走舊的本機還原
const last = localStorage.getItem("kidsCurrentStudent");
if (!window.sbClient && last) selectStudent(last);
</script>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Island 我的島嶼</title>
  <style>
    :root {
      --bg: #d8f3ff;
      --panel: #ffffff;
      --primary: #2f80ed;
      --primary-soft: #dbeafe;
      --accent: #ffb703;
      --gold: #f2a900;
      --success: #2fbf71;
      --danger: #ef476f;
      --text: #243042;
      --muted: #667085;
      --border: #cfe3ee;
      --sea: #5bb8e6;
      --land: #b7e08a;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, "Noto Sans TC", sans-serif;
      background: linear-gradient(#bfeaff, #d8f3ff);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 40px;
    }
    header {
      background: var(--primary);
      color: #fff;
      text-align: center;
      padding: 16px;
    }
    header h1 { font-size: 1.4rem; }
    header a { color: #ffe27a; font-size: .8rem; text-decoration: none; }

    /* student + coins bar */
    #topBar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 14px;
      background: var(--accent);
      flex-wrap: wrap;
    }
    .stu-group { display: flex; gap: 6px; }
    .stu-btn {
      padding: 5px 14px;
      border: 2px solid #3a2a00;
      border-radius: 18px;
      background: transparent;
      font-weight: 700;
      font-size: .85rem;
      cursor: pointer;
      color: #3a2a00;
    }
    .stu-btn.active { background: #3a2a00; color: #fff; }
    .coin-display {
      background: #fff;
      border-radius: 18px;
      padding: 6px 16px;
      font-weight: 800;
      font-size: 1.05rem;
      color: var(--gold);
      box-shadow: 0 1px 3px rgba(0,0,0,.15);
    }

    /* stats */
    #statsRow {
      display: flex;
      justify-content: space-around;
      gap: 6px;
      padding: 10px;
      background: var(--primary-soft);
      font-size: .8rem;
      flex-wrap: wrap;
    }
    #statsRow div { text-align: center; }
    #statsRow b { display: block; font-size: 1.1rem; color: var(--primary); }

    main { max-width: 520px; margin: 0 auto; padding: 14px; }
    #notice {
      background: #fff7dc;
      border: 2px solid var(--accent);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: .9rem;
      margin-bottom: 14px;
      display: none;
    }

    /* island grid */
    #island {
      display: grid;
      grid-template-columns: repeat(15, 1fr);
      gap: 1px;
      background: #3f9fd6;
      padding: 5px;
      border-radius: 12px;
      box-shadow: 0 3px 10px rgba(0,0,0,.2);
    }
    .tile {
      aspect-ratio: 1;
      background: var(--land);
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(.6rem, 2.6vw, 1rem);
      cursor: pointer;
      position: relative;
      user-select: none;
    }
    .tile.t-ocean   { background: #5bb8e6; cursor: default; }
    .tile.t-plains  { background: #aedd80; }
    .tile.t-hills   { background: #cca877; }
    .tile.t-mountain{ background: #b8bcca; cursor: default; }
    .tile-img { width: 100%; height: 100%; object-fit: contain; image-rendering: auto; pointer-events: none; }
    .opt-img { width: 2rem; height: 2rem; object-fit: contain; }
    .tile .lvl {
      position: absolute;
      bottom: 1px; right: 3px;
      font-size: .6rem;
      font-weight: 800;
      color: #3a2a00;
      background: rgba(255,255,255,.7);
      border-radius: 4px;
      padding: 0 3px;
    }

    /* build sheet */
    #sheet {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      background: #fff;
      border-radius: 18px 18px 0 0;
      box-shadow: 0 -3px 16px rgba(0,0,0,.2);
      padding: 16px 16px 24px;
      transform: translateY(100%);
      transition: transform .25s;
      z-index: 50;
      max-width: 520px;
      margin: 0 auto;
    }
    #sheet.open { transform: translateY(0); }
    #sheet h3 { font-size: 1rem; margin-bottom: 12px; text-align: center; }
    .build-opt {
      display: flex;
      align-items: center;
      gap: 12px;
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 10px;
      cursor: pointer;
    }
    .build-opt:active { background: var(--primary-soft); }
    .build-opt.locked { opacity: .5; }
    .build-opt .emoji { font-size: 1.8rem; }
    .build-opt .info { flex: 1; }
    .build-opt .bname { font-weight: 700; font-size: .95rem; }
    .build-opt .bdesc { font-size: .78rem; color: var(--muted); }
    .build-opt .bcost { font-weight: 800; color: var(--gold); font-size: .95rem; white-space: nowrap; }
    .sheet-close {
      width: 100%;
      padding: 10px;
      border: none;
      background: var(--border);
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 6px;
    }

    /* detail sheet reuse #sheet */
    .detail-row { font-size: .9rem; margin-bottom: 8px; }
    .detail-row b { color: var(--primary); }
    .demolish-btn {
      width: 100%;
      padding: 10px;
      border: 2px solid var(--danger);
      background: #fff;
      color: var(--danger);
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      font-size: .9rem;
    }
    .demolish-btn:active { background: #fde0e8; }
    .upgrade-btn {
      width: 100%; padding: 12px; border: none; background: var(--success); color: #fff;
      border-radius: 10px; font-weight: 800; cursor: pointer; margin-top: 12px; font-size: 1rem;
    }
    .upgrade-btn:active { opacity: .85; }

    /* toast */
    #toast {
      position: fixed;
      top: 16px; left: 50%;
      transform: translateX(-50%) translateY(-80px);
      background: #243042;
      color: #fff;
      padding: 10px 18px;
      border-radius: 20px;
      font-size: .9rem;
      font-weight: 600;
      transition: transform .3s;
      z-index: 100;
      max-width: 90%;
      text-align: center;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }

    #pickStudentMsg { text-align: center; padding: 40px 20px; color: var(--muted); }

    /* data backup panel */
    #dataPanel {
      margin-top: 18px;
      background: #fff;
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 14px;
    }
    .data-title { font-size: .95rem; color: var(--primary); margin-bottom: 10px; }
    .data-btns { display: flex; gap: 8px; flex-wrap: wrap; }
    .data-btn {
      flex: 1 1 calc(33% - 6px);
      min-width: 100px;
      padding: 10px 8px;
      border: 2px solid var(--primary);
      background: #fff;
      color: var(--primary);
      border-radius: 10px;
      font-weight: 700;
      font-size: .82rem;
      cursor: pointer;
    }
    .data-btn:active { background: var(--primary-soft); }
    .data-hint { font-size: .74rem; color: var(--muted); margin-top: 10px; line-height: 1.5; }
    .data-hint code { background: #eef3f8; padding: 1px 4px; border-radius: 4px; }
  </style>
</head>
<body>

<header>
  <h1>🏝️ My Island 我的島嶼</h1>
  <a href="index.html">← 回首頁</a>
</header>

<div id="topBar">
  <div class="stu-group">
    <button class="stu-btn" onclick="selectStudent('albert')">Albert</button>
    <button class="stu-btn" onclick="selectStudent('jonathan')">Jonathan</button>
    <button class="stu-btn" style="opacity:.7" onclick="selectStudent('test')">🧪 測試</button>
  </div>
  <div class="coin-display" id="coinDisplay">🪙 —</div>
</div>

<div id="statsRow" style="display:none">
  <div><b id="stPop">0</b>人口</div>
  <div><b id="stCap">0</b>容量</div>
  <div><b id="stBeauty">0</b>美化</div>
  <div><b id="stProd">0</b>金幣/天</div>
  <div><b id="stBld">0</b>建築</div>
</div>

<main>
  <div id="notice"></div>
  <div id="pickStudentMsg">👆 先選 Albert 或 Jonathan，開始蓋你的島！</div>
  <div id="island" style="display:none"></div>

  <div id="dataPanel" style="display:none">
    <h2 class="data-title">💾 進度備份</h2>
    <div class="data-btns">
      <button class="data-btn" onclick="exportSave()">⬇️ 匯出備份</button>
      <button class="data-btn" onclick="document.getElementById('importFile').click()">📂 從檔案匯入</button>
      <button class="data-btn" onclick="restoreFromGoogle()">☁️ 從 Google 還原</button>
    </div>
    <input type="file" id="importFile" accept="application/json,.json" style="display:none" onchange="importSave(event)" />
    <p class="data-hint">換手機 / 平板時用得到。匯出的檔案放進 repo 的 <code>kids/saves/</code> 再 push，其他裝置就能「從雲端還原」。</p>
  </div>
</main>

<!-- bottom sheet -->
<div id="sheet">
  <div id="sheetContent"></div>
  <button class="sheet-close" onclick="closeSheet()">關閉</button>
</div>

<div id="toast"></div>

<script src="cloud_sync.js"></script>
<script src="account_lock.js"></script>
<script>
// ─── Building catalog (v1) ───────────────────────────────────────────────────
const BUILDINGS = {
  forest: { emoji: "🌲", name: "森林", cost: 90,  desc: "美化島嶼，越久越茂密",
            beauty: [3, 6, 10], pop: [0,0,0], coin: [0,0,0], levelDays: [3, 7] },
  farm:   { emoji: "🌾", name: "農場", cost: 120, desc: "每天生產金幣",
            beauty: [0,0,0], pop: [0,0,0], coin: [15, 25, 40], levelDays: [4, 10] },
  house:  { emoji: "🏠", name: "房子", cost: 180, desc: "增加人口容量",
            beauty: [0,0,0], pop: [4, 8, 14], coin: [0,0,0], levelDays: [4, 10] },
  town:   { emoji: "🏘️", name: "小鎮", cost: 450, desc: "人口 + 金幣，最強建築",
            beauty: [0,0,0], pop: [12, 24, 40], coin: [20, 35, 55], levelDays: [7, 14] },
  ranch:  { emoji: "🐄", name: "牧場", cost: 150, desc: "金幣 + 一點人口",
            beauty: [0,0,0], pop: [2, 4, 7], coin: [18, 30, 46], levelDays: [4, 10] },
  pond:   { emoji: "🪷", name: "池塘", cost: 70,  desc: "美化島嶼（水景）",
            beauty: [4, 8, 13], pop: [0,0,0], coin: [0,0,0], levelDays: [3, 7] },
  center: { emoji: "🏛️", name: "城鎮中心", cost: 0, desc: "免費設置 1 個，達標才能升級",
            beauty: [5, 12, 25], pop: [0,0,0], coin: [10, 30, 60], levelDays: null, unique: true },
};
const BUILD_ORDER = ["center", "pond", "forest", "ranch", "farm", "house", "town"];

// 城鎮中心升級條件：index = 目前等級-1，達成下一級的人口與美化目標
// （地形已給 ~24 美化分，門檻相應提高）
const CENTER_TARGETS = [
  { pop: 20, beauty: 40 },  // Lv1 -> Lv2
  { pop: 50, beauty: 75 },  // Lv2 -> Lv3
];
const GRID = 15;

// 15×15 地形圖：O 海洋、P 平地（可蓋）、H 丘陵、M 高山
const TERRAIN_MAP = [
  "OOOOOOOOOOOOOOO",
  "OOOOPPPPPOOOOOO",
  "OOPPPPPPPPPOOOO",
  "OOPPPHHPPPPPOOO",
  "OPPPHHHHPPPPPOO",
  "OPPPHMMHHPPPPOO",
  "OPPPHMMMHPPPPPO",
  "OPPPPHHHPPPPPPO",
  "OPPPPPPPPPPPPPO",
  "OPPPPPPPPPPPPPO",
  "OOPPPPPPPPPPPOO",
  "OOPPPPPPPPPPPOO",
  "OOOPPPPPPPPOOOO",
  "OOOOOPPPPPOOOOO",
  "OOOOOOOOOOOOOOO",
];
function terrainAt(x, y) {
  if (y < 0 || y >= GRID || x < 0 || x >= GRID) return "O";
  return TERRAIN_MAP[y][x];
}
const TERR_CLASS = { O: "t-ocean", P: "t-plains", H: "t-hills", M: "t-mountain" };
const TERR_NAME = { O: "海洋", P: "平地", H: "丘陵", M: "高山" };

// ─── State ───────────────────────────────────────────────────────────────────
let currentStudent = null;
let island = null;
let selectedTile = null;

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

// ─── Progress (coins) storage — shared with drill pages ─────────────────────
function getProgress(s) {
  const raw = localStorage.getItem("kidsProgress." + s);
  const p = raw ? JSON.parse(raw) : { wrongCounts: {}, sessions: 0, totalCorrect: 0, totalWrong: 0 };
  if (!p.coins) p.coins = { balance: 0, lifetimeEarned: 0, lifetimeSpent: 0, transactions: [], claimedDrills: {} };
  return p;
}
function saveProgress(s, p) { localStorage.setItem("kidsProgress." + s, JSON.stringify(p)); }

// ─── Island storage ──────────────────────────────────────────────────────────
function newIsland(studentId) {
  return {
    schemaVersion: 2,
    studentId,
    createdAt: new Date().toISOString(),
    updatedAt: new Date().toISOString(),
    grid: { width: GRID, height: GRID },
    season: "spring",
    stats: { population: 0, populationCapacity: 0, beauty: 0, dailyCoinProduction: 0, totalBuildings: 0 },
    lastProcessedDate: todayStr(),
    buildings: [],
    events: [],
    settings: { emojiStyle: true, animationsEnabled: true },
  };
}
function loadIsland(s) {
  const raw = localStorage.getItem("kidsIsland." + s);
  return raw ? JSON.parse(raw) : newIsland(s);
}

// 升級到 15×15 地圖：把不在平地上的舊建築拆除並退還金幣
let lastMigration = { removed: 0, refund: 0 };
function migrateIsland(isl, student) {
  lastMigration = { removed: 0, refund: 0 };
  if (isl.schemaVersion >= 2 && isl.grid && isl.grid.width === GRID) return false;
  isl.schemaVersion = 2;
  isl.grid = { width: GRID, height: GRID };
  let refunded = 0, removed = 0;
  const kept = [];
  (isl.buildings || []).forEach(b => {
    if (terrainAt(b.x, b.y) === "P") { kept.push(b); }
    else { refunded += (BUILDINGS[b.type] && BUILDINGS[b.type].cost) || 0; removed++; }
  });
  isl.buildings = kept;
  if (refunded > 0) {
    const p = getProgress(student);
    p.coins.balance += refunded;
    p.coins.lifetimeEarned += refunded;
    p.coins.transactions.push({ type: "earn", source: "mapMigration", amount: refunded,
      balanceAfter: p.coins.balance, createdAt: new Date().toISOString(), meta: { removed } });
    saveProgress(student, p);
  }
  lastMigration = { removed: removed, refund: refunded };
  return true;
}
function saveIsland(s, isl) {
  isl.updatedAt = new Date().toISOString();
  localStorage.setItem("kidsIsland." + s, JSON.stringify(isl));
}

// ─── Daily tick: grow buildings + collect production ────────────────────────
function runDailyTick() {
  const today = todayStr();
  if (island.lastProcessedDate === today) return 0;
  // count number of days passed (at least 1)
  let totalProduced = 0;
  island.buildings.forEach(b => {
    const cat = BUILDINGS[b.type];
    b.activeDays = (b.activeDays || 0) + 1;
    // level up by activeDays thresholds (城鎮中心除外，它靠人口+美化達標升級)
    if (cat.levelDays && b.level < 3) {
      if (b.level === 1 && b.activeDays >= cat.levelDays[0]) b.level = 2;
      else if (b.level === 2 && b.activeDays >= cat.levelDays[1]) b.level = 3;
    }
    // production
    const produce = cat.coin[b.level - 1] || 0;
    if (produce > 0 && b.lastProductionDate !== today) {
      totalProduced += produce;
      b.lastProductionDate = today;
    }
  });
  island.lastProcessedDate = today;
  if (totalProduced > 0) {
    const p = getProgress(currentStudent);
    p.coins.balance += totalProduced;
    p.coins.lifetimeEarned += totalProduced;
    p.coins.transactions.push({ type: "earn", source: "islandProduction", amount: totalProduced,
      balanceAfter: p.coins.balance, createdAt: new Date().toISOString(), meta: { date: today } });
    saveProgress(currentStudent, p);
    island.events.push({ id: "prod-" + today, type: "production", date: today,
      message: `農場與小鎮生產了 ${totalProduced} 金幣`, coinsDelta: totalProduced, seen: false });
  }
  recalcStats();
  saveIsland(currentStudent, island);
  return totalProduced;
}

// ─── Stats ──────────────────────────────────────────────────────────────────
let TERRAIN_BEAUTY = null;
function terrainBeauty() {
  if (TERRAIN_BEAUTY === null) {
    let b = 0;
    for (let y = 0; y < GRID; y++) for (let x = 0; x < GRID; x++) {
      const t = TERRAIN_MAP[y][x];
      if (t === "H") b += 1; else if (t === "M") b += 2;
    }
    TERRAIN_BEAUTY = b;
  }
  return TERRAIN_BEAUTY;
}

function recalcStats() {
  let pop = 0, cap = 0, beauty = terrainBeauty(), prod = 0;  // 地形提供基礎美化分
  island.buildings.forEach(b => {
    const cat = BUILDINGS[b.type];
    cap += cat.pop[b.level - 1] || 0;
    beauty += cat.beauty[b.level - 1] || 0;
    prod += cat.coin[b.level - 1] || 0;
  });
  // population grows toward capacity (simple: pop = capacity for v1)
  pop = cap;
  island.stats = { population: pop, populationCapacity: cap, beauty, dailyCoinProduction: prod, totalBuildings: island.buildings.length };
}

// ─── Render ──────────────────────────────────────────────────────────────────
function render() {
  const p = getProgress(currentStudent);
  document.getElementById("coinDisplay").textContent = "🪙 " + p.coins.balance;
  document.getElementById("stPop").textContent = island.stats.population;
  document.getElementById("stCap").textContent = island.stats.populationCapacity;
  document.getElementById("stBeauty").textContent = island.stats.beauty;
  document.getElementById("stProd").textContent = island.stats.dailyCoinProduction;
  document.getElementById("stBld").textContent = island.stats.totalBuildings;

  const grid = document.getElementById("island");
  grid.innerHTML = "";
  const map = {};
  island.buildings.forEach(b => { map[b.x + "_" + b.y] = b; });
  for (let y = 0; y < GRID; y++) {
    for (let x = 0; x < GRID; x++) {
      const t = terrainAt(x, y);
      const tile = document.createElement("div");
      tile.className = "tile " + TERR_CLASS[t];
      const b = map[x + "_" + y];
      if (b) {
        const cat = BUILDINGS[b.type];
        tile.innerHTML = `<img class="tile-img" src="island_img/${b.type}.png" alt="${cat.name}" onerror="this.replaceWith(document.createTextNode('${cat.emoji}'))">` + (b.level > 1 ? `<span class="lvl">Lv${b.level}</span>` : "");
        tile.onclick = () => openDetail(b);
      } else if (t === "P") {
        tile.onclick = () => openBuild(x, y);
      } else {
        if (t === "H") tile.textContent = "⛰️";
        else if (t === "M") tile.textContent = "🏔️";
        tile.onclick = () => toast(TERR_NAME[t] + "不能蓋建築");
      }
      grid.appendChild(tile);
    }
  }
}

// ─── Build sheet ─────────────────────────────────────────────────────────────
function openBuild(x, y) {
  selectedTile = { x, y };
  const p = getProgress(currentStudent);
  const bal = p.coins.balance;
  const hasCenter = island.buildings.some(b => b.type === "center");
  let html = `<h3>蓋什麼？（你有 🪙 ${bal}）</h3>`;
  BUILD_ORDER.forEach(key => {
    const c = BUILDINGS[key];
    if (c.unique && hasCenter) return; // 城鎮中心只能蓋一個
    const afford = bal >= c.cost;
    const costLabel = c.cost === 0 ? "免費" : `🪙 ${c.cost}`;
    html += `
      <div class="build-opt ${afford ? "" : "locked"}" ${afford ? `onclick="build('${key}')"` : ""}>
        <div class="emoji"><img class="opt-img" src="island_img/${key}.png" alt="${c.name}" onerror="this.replaceWith(document.createTextNode('${c.emoji}'))"></div>
        <div class="info">
          <div class="bname">${c.name}</div>
          <div class="bdesc">${c.desc}</div>
        </div>
        <div class="bcost">${costLabel}</div>
      </div>`;
  });
  document.getElementById("sheetContent").innerHTML = html;
  document.getElementById("sheet").classList.add("open");
}

function build(key) {
  const c = BUILDINGS[key];
  if (!selectedTile || terrainAt(selectedTile.x, selectedTile.y) !== "P") { toast("只能蓋在平地上"); return; }
  if (c.unique && island.buildings.some(b => b.type === key)) { toast("已經有一個城鎮中心了"); return; }
  const p = getProgress(currentStudent);
  if (p.coins.balance < c.cost) { toast("金幣不夠！"); return; }
  p.coins.balance -= c.cost;
  p.coins.lifetimeSpent += c.cost;
  p.coins.transactions.push({ type: "spend", source: "islandBuild", amount: c.cost,
    balanceAfter: p.coins.balance, createdAt: new Date().toISOString(),
    meta: { buildingType: key, x: selectedTile.x, y: selectedTile.y } });
  saveProgress(currentStudent, p);

  island.buildings.push({
    id: "b-" + Date.now() + "-" + selectedTile.x + "-" + selectedTile.y,
    type: key, x: selectedTile.x, y: selectedTile.y, level: 1,
    createdAt: new Date().toISOString(), lastProductionDate: null,
    activeDays: 0, customName: "", state: { isProducing: c.coin[0] > 0, isDecorative: c.beauty[0] > 0 },
  });
  recalcStats();
  saveIsland(currentStudent, island);
  closeSheet();
  render();
  if (typeof cloudSave === "function") cloudSave(currentStudent);
  toast(`${c.emoji} ${c.name} 蓋好了！`);
}

function openDetail(b) {
  const c = BUILDINGS[b.type];
  const refund = c.cost; // 試用期：全額退還
  let html = `<h3>${c.emoji} ${c.name} Lv${b.level}</h3>`;
  html += `<div class="detail-row">已經存在：<b>${b.activeDays}</b> 天</div>`;
  if (c.coin[b.level-1] > 0) html += `<div class="detail-row">每天生產：<b>🪙 ${c.coin[b.level-1]}</b></div>`;
  if (c.pop[b.level-1] > 0)  html += `<div class="detail-row">人口容量：<b>${c.pop[b.level-1]}</b></div>`;
  if (c.beauty[b.level-1] > 0) html += `<div class="detail-row">美化分數：<b>${c.beauty[b.level-1]}</b></div>`;

  if (b.type === "center") {
    // 城鎮中心：靠人口 + 美化達標升級
    if (b.level < 3) {
      const t = CENTER_TARGETS[b.level - 1];
      const pop = island.stats.population, beauty = island.stats.beauty;
      const popOk = pop >= t.pop, beautyOk = beauty >= t.beauty;
      html += `<div class="detail-row" style="margin-top:6px">升到 Lv${b.level+1} 需要：</div>`;
      html += `<div class="detail-row" style="color:${popOk ? "var(--success)" : "var(--danger)"}">　人口 ${pop} / ${t.pop} ${popOk ? "✅" : ""}</div>`;
      html += `<div class="detail-row" style="color:${beautyOk ? "var(--success)" : "var(--danger)"}">　美化 ${beauty} / ${t.beauty} ${beautyOk ? "✅" : ""}</div>`;
      if (popOk && beautyOk) {
        html += `<button class="upgrade-btn" onclick="upgradeCenter('${b.id}')">⬆️ 升級城鎮中心！</button>`;
      } else {
        html += `<div class="detail-row" style="color:var(--muted)">多蓋房子/小鎮增加人口，多種森林/池塘增加美化 💡</div>`;
      }
    } else {
      html += `<div class="detail-row" style="color:var(--success)">城鎮中心已達最高等級！🏆</div>`;
    }
  } else if (c.levelDays) {
    const nextDays = b.level < 3 ? c.levelDays[b.level - 1] : null;
    if (nextDays) html += `<div class="detail-row" style="color:var(--muted)">再過 <b>${nextDays - b.activeDays}</b> 天升到 Lv${b.level+1} ⬆️</div>`;
    else html += `<div class="detail-row" style="color:var(--success)">已經是最高等級！⭐</div>`;
  }

  const refundLabel = refund === 0 ? "免費蓋的，拆除不退幣" : `🛠️ 拆除（退還 🪙 ${refund}）`;
  html += `<button class="demolish-btn" onclick="demolish('${b.id}')">${refundLabel}</button>`;
  document.getElementById("sheetContent").innerHTML = html;
  document.getElementById("sheet").classList.add("open");
}

function upgradeCenter(buildingId) {
  const b = island.buildings.find(x => x.id === buildingId);
  if (!b || b.type !== "center" || b.level >= 3) return;
  const t = CENTER_TARGETS[b.level - 1];
  if (island.stats.population < t.pop || island.stats.beauty < t.beauty) { toast("還沒達標喔"); return; }
  b.level++;
  recalcStats();
  saveIsland(currentStudent, island);
  closeSheet();
  render();
  if (typeof cloudSave === "function") cloudSave(currentStudent);
  toast(`🏛️ 城鎮中心升到 Lv${b.level}！🎉`);
}

function demolish(buildingId) {
  const idx = island.buildings.findIndex(b => b.id === buildingId);
  if (idx < 0) return;
  const b = island.buildings[idx];
  const c = BUILDINGS[b.type];
  const refund = c.cost; // 試用期：全額退還
  island.buildings.splice(idx, 1);
  const p = getProgress(currentStudent);
  p.coins.balance += refund;
  p.coins.transactions.push({ type: "earn", source: "islandDemolish", amount: refund,
    balanceAfter: p.coins.balance, createdAt: new Date().toISOString(),
    meta: { buildingType: b.type, x: b.x, y: b.y } });
  saveProgress(currentStudent, p);
  recalcStats();
  saveIsland(currentStudent, island);
  closeSheet();
  render();
  if (typeof cloudSave === "function") cloudSave(currentStudent);
  toast(`${c.emoji} 拆除了，退還 🪙 ${refund}`);
}

function closeSheet() { document.getElementById("sheet").classList.remove("open"); }

// ─── Toast ──────────────────────────────────────────────────────────────────
let toastTimer = null;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}

// ─── Student select ──────────────────────────────────────────────────────────
function selectStudent(name) {
  if (typeof requireUnlock === "function" && !requireUnlock(name)) return;
  currentStudent = name;
  localStorage.setItem("kidsCurrentStudent", name);
  document.querySelectorAll(".stu-btn").forEach(b => b.classList.toggle("active", b.textContent.toLowerCase() === name));
  island = loadIsland(name);
  const migrated = migrateIsland(island, name);
  document.getElementById("pickStudentMsg").style.display = "none";
  document.getElementById("island").style.display = "grid";
  document.getElementById("statsRow").style.display = "flex";
  document.getElementById("dataPanel").style.display = "block";
  recalcStats();
  if (migrated) saveIsland(name, island);
  const produced = runDailyTick();
  render();
  const notice = document.getElementById("notice");
  if (lastMigration.removed > 0) {
    notice.style.display = "block";
    notice.innerHTML = `🗺️ 島嶼升級成 15×15！有 <b>${lastMigration.removed}</b> 個不在平地上的建築被拆除，退還 <b>🪙 ${lastMigration.refund}</b> 金幣。`;
  } else if (migrated) {
    notice.style.display = "block";
    notice.innerHTML = `🗺️ 島嶼已升級成 15×15 新地圖！海洋 / 丘陵 / 高山只能在平地蓋建築。`;
  } else if (produced > 0) {
    notice.style.display = "block";
    notice.innerHTML = `🌅 新的一天！你的農場和小鎮生產了 <b>🪙 ${produced}</b> 金幣！`;
  } else {
    notice.style.display = "none";
  }
  // 本機空 → 從雲端拉回（新/測試平板自動載入真實進度）；本機有 → 上傳備份
  if (typeof cloudSyncOnOpen === "function") cloudSyncOnOpen(currentStudent, () => selectStudent(currentStudent));
}

// ─── 匯出 / 匯入 / 雲端還原 ──────────────────────────────────────────────────
function buildSaveBundle(student) {
  return {
    type: "kids-english-save",
    version: 1,
    student,
    exportedAt: new Date().toISOString(),
    progress: getProgress(student),
    island: loadIsland(student),
  };
}

function exportSave() {
  if (!currentStudent) { toast("先選學生"); return; }
  const bundle = buildSaveBundle(currentStudent);
  const json = JSON.stringify(bundle, null, 2);
  const blob = new Blob([json], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = currentStudent + ".json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(a.href);
  toast(`已匯出 ${currentStudent}.json`);
}

function applyBundle(bundle) {
  if (!bundle || bundle.type !== "kids-english-save" || !bundle.student) {
    toast("檔案格式不對 😅"); return false;
  }
  const s = bundle.student;
  if (bundle.progress) saveProgress(s, bundle.progress);
  if (bundle.island)   localStorage.setItem("kidsIsland." + s, JSON.stringify(bundle.island));
  selectStudent(s);
  toast(`已還原 ${s} 的進度 🎉`);
  return true;
}

function importSave(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try { applyBundle(JSON.parse(e.target.result)); }
    catch (err) { toast("讀取失敗 😅"); }
  };
  reader.readAsText(file);
  event.target.value = "";
}

// 從 Google 試算表還原（自動存檔的對應還原）
function restoreFromGoogle() {
  if (!currentStudent) { toast("先選學生"); return; }
  if (typeof cloudLoad !== "function" || !CLOUD_URL) { toast("還沒設定 Google 同步"); return; }
  if (!confirm(`要用 Google 雲端的存檔覆蓋目前 ${currentStudent} 的進度嗎？`)) return;
  cloudLoad(currentStudent).then(d => {
    if (d) { selectStudent(currentStudent); toast(`已從 Google 還原 ${currentStudent} 🎉`); }
    else toast(`Google 上還沒有 ${currentStudent} 的存檔`);
  });
}

// auto restore
const last = localStorage.getItem("kidsCurrentStudent");
if (last) selectStudent(last);
</script>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>四季小鎮</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Silkscreen&display=swap">
<style>
:root{
  --wood:#7a4b2a; --wood-d:#4e2e17; --wood-l:#a8703f; --panel:#fbf1d9; --panel2:#f3e2bb;
  --ink:#2f2416; --muted:#7a6a52; --ap:#e0a526; --coin:#c9861f; --ok:#3f8a3a; --bad:#c0453a;
  --grass:#8fcf6a; --grass2:#84c461; --soil:#9a6b43; --soil-wet:#6b4428; --water:#5aa3c8; --path:#e2cf9a;
  --pixel:"Silkscreen","Courier New",monospace;
}
body.s-秋{--grass:#c9b25a;--grass2:#bea64f}
body.s-冬{--grass:#e3ecef;--grass2:#d6e2e6}
body.s-春{--grass:#8fcf6a;--grass2:#84c461}
body.s-夏{--grass:#5fae4a;--grass2:#57a243}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:#5b3a20}
body{margin:0;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:var(--ink);
  background:repeating-linear-gradient(90deg,#5b3a20 0 38px,#62402a 38px 40px);min-height:100vh}
.wrap{max-width:780px;margin:0 auto;padding:12px 12px 90px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;color:#fbe7b8}
header h1{margin:0;font-size:1.35rem;font-weight:900;letter-spacing:.06em;text-shadow:2px 2px 0 #2a170a}
header a{color:#ffe08a;font-weight:700;text-decoration:none;font-size:.85rem}
.who{display:flex;gap:6px;flex-wrap:wrap}
.who button{border:2px solid #2a170a;background:#f3e2bb;color:var(--ink);font-weight:700;border-radius:6px;padding:4px 10px;cursor:pointer;font-family:inherit}
.who button.on{background:var(--ap);}
.frame{background:var(--panel);border:4px solid var(--wood);box-shadow:0 0 0 3px var(--wood-d),4px 6px 0 3px rgba(0,0,0,.35);border-radius:8px}
.hud{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;padding:8px 12px;margin:10px 0}
.hud .stat{display:flex;align-items:center;gap:6px;font-weight:700}
.hud .num{font-family:var(--pixel);font-size:1.05rem}
.bar{width:90px;height:12px;border:2px solid var(--wood-d);background:#3b2716;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(#ffd25a,#e0a526)}
.chip{font-size:.78rem;font-weight:900;padding:2px 9px;border-radius:4px;color:#fff;background:var(--wood)}
.chip.s-秋{background:#b8742a}.chip.s-冬{background:#4f6f8f}.chip.s-春{background:#5e9a48}.chip.s-夏{background:#2e8c8a}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:6px 0 10px}
.tabs button{font-family:inherit;font-weight:900;font-size:.9rem;padding:9px 4px;border:3px solid var(--wood-d);background:var(--panel2);color:var(--ink);border-radius:8px 8px 4px 4px;cursor:pointer}
.tabs button.on{background:var(--panel);transform:translateY(2px)}
.tabs button .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--bad);margin-left:4px;vertical-align:middle}
.pane{padding:12px}
.pane[hidden]{display:none}
h2{font-size:1.05rem;margin:4px 0 10px;font-weight:900}
.muted{color:var(--muted);font-size:.86rem}

/* 農莊 */
.map{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));grid-template-rows:repeat(12,minmax(0,1fr));background:var(--grass);aspect-ratio:16/12;width:100%;
  border:3px solid var(--wood-d);border-radius:4px;overflow:hidden;position:relative;user-select:none}
.cell{background:var(--grass);min-width:0;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:clamp(12px,3.2vw,22px);cursor:pointer}
.cell.alt{background:var(--grass2)}
.cell.water{background:var(--water);cursor:default}
.cell.path{background:var(--path)}
.cell.house{background:#c9533b;cursor:pointer}
.cell.bin{background:#8a5a32}
.cell.target{outline:2px dashed #fff;outline-offset:-3px}
.cell:hover{filter:brightness(1.07)}
.field{min-width:0;min-height:0;overflow:hidden;background:var(--soil);border:2px solid #5c3b20;display:flex;align-items:center;justify-content:center;flex-direction:column;
  font-size:clamp(16px,4.6vw,30px);cursor:pointer;position:relative;z-index:1}
.field.wet{background:var(--soil-wet)}
.field.ripe{box-shadow:inset 0 0 0 3px #ffd25a}
.field .pips{font-size:.4em;letter-spacing:2px;color:#ffe08a;font-family:var(--pixel)}
.decor{background:var(--grass);display:flex;align-items:center;justify-content:center;font-size:clamp(14px,3.6vw,24px);cursor:pointer;z-index:1}
.sel{outline:3px solid #fff;outline-offset:-3px;z-index:2}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn{font-family:inherit;font-weight:700;font-size:.92rem;border:3px solid var(--wood-d);background:#fff6e0;color:var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.go{background:#ffe08a}
.btn .cost{font-family:var(--pixel);font-size:.8rem;color:var(--wood)}
.sheet{margin-top:10px;padding:12px;background:#fff8e6;border:3px dashed var(--wood-l);border-radius:8px}
.sheet[hidden]{display:none}
.banner{background:#2f2416;color:#ffe08a;padding:8px 12px;border-radius:6px;margin-top:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.goal{display:block;text-decoration:none;color:inherit;padding:10px 12px;margin-bottom:10px;background:#fff3cf;border:2px solid var(--ap);border-radius:8px;cursor:pointer}
.goal .ttl{font-weight:900}
.goal .parts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.goal .pt{font-size:.82rem;font-weight:700;border-radius:999px;padding:2px 9px;background:#fff;border:1px solid var(--wood-l)}
.goal .pt.ok{background:#e7f5df;border-color:#9fd38f;color:var(--ok)}
.goal .foot{font-size:.78rem;color:var(--muted);margin-top:6px}
.hint{padding:9px 12px;margin-bottom:10px;background:#e8f4ff;border:2px dashed #6aa9e0;border-radius:8px;font-weight:700}
.today{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 12px;margin-bottom:10px;background:#fff8e6;border:2px solid var(--wood-l);border-radius:8px}

/* 商店 */
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.item{background:#fff8e6;border:2px solid var(--wood-l);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:4px}
.item .top{display:flex;align-items:center;gap:8px}
.item .em{font-size:1.6rem}
.item .en{font-weight:900}
.item .zh{font-size:.8rem;color:var(--muted)}
.item .n{font-family:var(--pixel);font-size:.85rem}

/* 信件 */
.card{background:#fffdf4;border:2px solid var(--wood-l);border-radius:8px;padding:12px;margin-bottom:10px}
.card.new{border-color:var(--ap);box-shadow:0 0 0 2px #ffe08a}
.card .who2{font-weight:900;display:flex;align-items:center;gap:6px}
.card .en{font-family:Georgia,"Times New Roman",serif;font-size:1.1rem;line-height:1.55;margin:8px 0}
.card .zh{color:var(--muted);font-size:.88rem}
.choice{display:block;width:100%;text-align:left;margin-top:6px;font-family:Georgia,serif;font-size:1rem}
.card:not(.showzh) .zh,.card:not(.showzh) .zhc{display:none}
.zhc{font-family:'Noto Sans TC',sans-serif;font-size:.82rem;color:var(--muted);margin-left:6px}
.choice.picked{background:#e7f5df;border-color:var(--ok)}
.story .line{font-family:Georgia,serif;font-size:1.05rem;margin:6px 0}
.say{margin-top:10px;padding:10px;background:#fff3cf;border-radius:8px}
.say .en{font-weight:900}
.hearts{font-size:1.1rem;letter-spacing:2px}
.folks{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.folk{display:flex;align-items:center;gap:10px;background:#fffdf4;border:3px solid var(--wood-l);border-radius:10px;padding:6px 12px 6px 6px;cursor:pointer;font-family:inherit;color:var(--ink)}
.folk:hover{border-color:var(--ap)}
.folk .nm{font-weight:900;text-align:left}
.folk .sm{font-size:.76rem;color:var(--muted);text-align:left}
.pic{width:56px;height:56px;border-radius:8px;background:#fff8e6;border:2px solid var(--wood-d);image-rendering:pixelated;object-fit:cover;display:inline-flex;align-items:center;justify-content:center;font-size:30px;flex-shrink:0}
.pic.sm{width:30px;height:30px;font-size:18px;border-width:1px;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(30,18,8,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:40}
.modal .box{max-width:520px;width:100%;max-height:90vh;overflow:auto;padding:16px}
.modal .head{display:flex;gap:14px;align-items:center}
.modal .pic{width:120px;height:120px;font-size:64px}
.modal h3{margin:0;font-size:1.3rem}
.modal .en{font-family:Georgia,"Times New Roman",serif;font-size:1.08rem;line-height:1.55;margin:10px 0 4px}
.modal .zh{color:var(--muted);font-size:.88rem}
.modal:not(.showzh) .zh{display:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chips span{background:#fff8e6;border:1px solid var(--wood-l);border-radius:999px;padding:2px 10px;font-size:.86rem}
.chips span i{font-style:normal;color:var(--muted);font-size:.78rem;margin-left:4px}
.modal:not(.showzh) .chips i{display:none}
.lbl{font-weight:900;margin-top:10px;font-size:.9rem}

/* 小鎮 */
.prosper{padding:10px 12px;margin-bottom:12px;background:#fff3cf;border:2px solid var(--ap);border-radius:8px}
.prosper .ttl{font-weight:900;font-size:1.05rem}
.pbar{height:12px;background:#fff;border:2px solid var(--wood-d);border-radius:999px;overflow:hidden;margin:6px 0}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,#f6c453,#f08a24)}
.residents{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}
.residents .pic{cursor:pointer}
.residents .soon{width:56px;height:56px;border:2px dashed var(--wood-l);border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:26px;color:var(--muted)}
.sum{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.sum span{font-size:.85rem;font-weight:700;border-radius:999px;padding:3px 10px;background:#fff;border:1px solid var(--wood-l)}
.sum span.ok{background:#e7f5df;border-color:#9fd38f;color:var(--ok)}
.tasks{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.task{background:#fffdf4;border:2px solid var(--wood-l);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:4px;min-width:0}
.task.ready{border-color:var(--ap);box-shadow:0 0 0 2px #ffe08a}
.task.done{opacity:.6;background:#f1f6ec}
.task .who2{font-weight:900;display:flex;align-items:center;gap:6px}
.task .en{font-family:Georgia,"Times New Roman",serif;font-size:1rem;line-height:1.45}
.task .zh{color:var(--muted);font-size:.84rem}
.task:not(.showzh) .zh{display:none}
.task .nd{font-weight:900}
.task .nd.ok{color:var(--ok)}
.task .where{font-size:.78rem;color:var(--muted)}
.task .actions{margin-top:4px}
.later{margin:4px 0;padding:6px 10px;border:2px dashed var(--wood-l);border-radius:8px;color:var(--muted);font-size:.9rem}
.cele{text-align:center}
.cele .big{font-size:3.2rem;margin:6px 0}
.landmark{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.landmark .look{font-size:2.6rem;background:#fff8e6;border:2px solid var(--wood-l);border-radius:8px;padding:8px 14px}
.need li{margin:2px 0}
.need .miss{color:var(--bad)}
.book h3{font-size:.95rem;margin:12px 0 4px}
.book li{margin:3px 0;font-size:.9rem}
.book .en{font-family:Georgia,serif;font-weight:700}

.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#2f2416;color:#ffe08a;
  padding:10px 16px;border-radius:10px;font-weight:700;z-index:50;max-width:90vw;box-shadow:0 4px 0 rgba(0,0,0,.3)}
.toast[hidden]{display:none}
:focus-visible{outline:3px solid #ffe08a;outline-offset:2px}
@media (max-width:520px){.tabs button{font-size:.78rem;padding:8px 2px}.bar{width:60px}.wrap{padding:8px 8px 90px}.btn{font-size:.85rem;padding:7px 9px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🌾 四季小鎮</h1>
    <div class="who" id="who"></div>
    <a href="../index.html">← 回首頁</a>
  </header>

  <div class="frame hud" id="hud"></div>

  <div class="tabs" role="tablist">
    <button id="t-farm" class="on" onclick="tab('farm')">🌾 農莊</button>
    <button id="t-shop" onclick="tab('shop')">🛒 商店</button>
    <button id="t-mail" onclick="tab('mail')">📨 村民</button>
    <button id="t-town" onclick="tab('town')">🏛️ 小鎮</button>
  </div>

  <div class="frame">
    <section class="pane" id="p-farm">
      <div class="today" id="today"></div>
      <div id="goal"></div>
      <div class="hint" id="hint" hidden></div>
      <div class="map" id="map" aria-label="農莊地圖"></div>
      <div class="banner" id="moveBar" hidden><span id="moveMsg"></span><button class="btn" onclick="cancelMove()">✕ 取消</button></div>
      <div class="actions">
        <button class="btn go" id="careBtn" onclick="doCare()">🚿 照料全部田 <span class="cost">1⚡</span></button>
        <button class="btn" id="woodBtn" onclick="doGather('wood')"></button>
        <button class="btn" id="stoneBtn" onclick="doGather('stone')"></button>
      </div>
      <div class="sheet" id="sheet" hidden></div>
      <p class="muted">點空地可以開田或擺裝飾；點田可以播種、收成或搬家。作物要照料 3 天，每天照料一次，隔天才會長大。沒來的日子它會停在原地等你，不會枯掉。</p>
    </section>

    <section class="pane" id="p-shop" hidden></section>
    <section class="pane" id="p-mail" hidden></section>
    <section class="pane" id="p-town" hidden></section>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<div class="modal" id="folkModal" hidden onclick="if(event.target===this)closeFolk()"><div class="frame box" id="folkBox"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../cloud_sync.js?v=202610090052"></script>
<script src="../supabase_auth.js?v=202610090052"></script>
<script src="../drills_list.js?v=202610090052"></script>
<script src="town_core.js?v=202610090052"></script>
<script src="town_content.js?v=202610090052"></script>
<script>
"use strict";
const T = TownCore, C = TownContent;
const STUDENTS = [["albert", "Albert"], ["jonathan", "Jonathan"], ["test", "🧪 測試"]];
let student = null, st = null, sel = null, moving = null;
let authed = null;             // 有登入時＝帳號名，畫面上就不給切換學生
const zhOpen = new Set();      // 按過「看中文」的卡片，重繪時保持展開

// 今天：測試帳號可以用 ?date=YYYY-MM-DD 假裝是別天，才能試跨日成長
function today() {
  const q = new URLSearchParams(location.search).get("date");
  if (student === "test" && q && /^\d{4}-\d{2}-\d{2}$/.test(q)) return q;
  return T.ymd(new Date());
}
function storage() { return window.localStorage; }
function progress() { try { return JSON.parse(storage().getItem("kidsProgress." + student) || "null"); } catch (e) { return null; } }
// 存檔：別的分頁先存了更新的版本就不蓋過去，改成重新載入那一份
function persist() {
  try {
    const r = T.save(storage(), st);
    if (r.conflict) { reload("另一個分頁更新了進度，已經重新載入"); return false; }
    pushCloud();
    return true;
  } catch (e) { toast("存檔失敗：" + e.message); return false; }
}
// 雲端備份：連續操作只送最後一次；切到背景時馬上送
let cloudTimer = null;
function pushCloud(now) {
  if (typeof cloudSave !== "function" || !student || student === "guest") return;
  clearTimeout(cloudTimer);
  if (now) { cloudSave(student); return; }
  cloudTimer = setTimeout(() => { cloudTimer = null; cloudSave(student); }, 4000);
}
function reload(msg) {
  const r = T.load(storage(), student, today(), C);
  st = r.st; sel = null; moving = null;
  T.syncFromProgress(st, progress());
  if (msg) toast(msg);
  render();
}

function toast(msg) {
  const t = document.getElementById("toast"); if (!msg) return;
  t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, Math.max(2600, msg.length * 110));
}
function play(path) { try { new Audio(path).play().catch(() => {}); } catch (e) {} }
const wordAudio = en => "../audio/words/" + String(en).toLowerCase().replace(/[^a-z0-9]+/g, "") + ".mp3";
const townAudio = key => "../audio/town/" + key + ".mp3";
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// 測試帳號專用：直接加體力，不經過每週上限。先放進儲備，再補滿體力條（跟正式溢出規則一樣的顯示）
function testBoost(n) {
  if (student !== "test") return;
  st.energy.reserve += n;
  T.spend(st, 0);
  st.rev++;
  act({ ok: true, msg: "🧪 +" + n + " ⚡（測試用，不算週上限）" });
}
function act(r) {
  if (r && r.ok) persist();
  if (r && r.ok && (r.stageDone || (r.arrived && r.arrived.length))) celebrate(r); else if (r && r.msg) toast(r.msg);
  render(); return r;
}

// ── 帳號 ─────────────────────────────────────────────────────────────
// 登入守門（supabase_auth.js）登入後會呼叫這裡；訪客跟舊島一樣不能玩
function selectStudent(name) {
  if (name === "guest") {
    document.getElementById("who").innerHTML = "";
    document.querySelector(".wrap").innerHTML = `<div class="frame" style="margin-top:24px;text-align:center;line-height:1.8">
      🎫 訪客帳號不能玩四季小鎮喔！<br>小鎮要用自己的帳號，進度才存得住。<br><br><a href="../index.html">← 回首頁</a></div>`;
    return;
  }
  authed = name;
  pick(name);
  if (typeof cloudSyncOnOpen === "function") cloudSyncOnOpen(name, () => reload("已經讀取雲端的小鎮進度"));
}
window.selectStudent = selectStudent;
function pick(name) {
  student = name; try { storage().setItem("kidsCurrentStudent", name); } catch (e) {}
  const r = T.load(storage(), student, today(), C);
  st = r.st;
  const got = T.syncFromProgress(st, progress());
  persist();
  if (r.problem) toast("原本的存檔讀不懂（" + r.problem + "），已經另存備份，先開一份新的");
  else if (got) toast("做英文換來的體力：+" + got + " ⚡");
  sel = null; moving = null; render();
}

// ── 畫面 ─────────────────────────────────────────────────────────────
function render() {
  document.getElementById("who").innerHTML = authed
    ? `<span>${esc(authed.charAt(0).toUpperCase() + authed.slice(1))}</span><button onclick="doLogout()">登出</button>`
    : STUDENTS.map(([k, n]) => `<button class="${k === student ? "on" : ""}" onclick="pick('${k}')">${n}</button>`).join("");
  if (!st) return;
  const d = today(), season = T.season(d), wk = T.contentWeek(d), W = C.WEEKS[wk];
  document.body.className = "s-" + season;
  const e = st.energy;
  document.getElementById("hud").innerHTML = `
    <span class="stat">⚡ <span class="bar"><i style="width:${Math.round(e.wallet / T.AP_WALLET_CAP * 100)}%"></i></span>
      <span class="num" title="用不完的會存進儲備，不會不見">${e.wallet}/${T.AP_WALLET_CAP}</span>${e.reserve ? `<span class="muted">＋儲備 <span class="num">${e.reserve}</span></span>` : ""}</span>
    <span class="stat">🪙 <span class="num">${st.money}</span> <span class="muted">小鎮幣</span></span>
    <span class="stat" style="cursor:pointer" onclick="tab('town')" title="小鎮越繁榮，越多村民搬來">🏘️ <span class="num">${T.prosperity(st, C)}</span> <span class="muted">繁榮度</span></span>
    <span class="chip s-${season}">${season}季</span>
    <span class="muted">本週：${W ? W.theme : "（內容準備中）"}</span>
    ${student === "test" ? `<button class="btn" title="跟做一份練習一樣，算進每週 70 的上限" onclick="act(T.grant(st,'test:'+Date.now(),10,today()))">🧪 +10⚡</button>
      <button class="btn" title="只有測試帳號有，不算進每週上限" onclick="testBoost(50)">🧪 +50⚡ 不限</button>` : ""}`;
  // 有新信的分頁加紅點
  const unread = visibleCards().some(c => !st.cards[c.id]);
  document.getElementById("t-mail").innerHTML = "📨 村民" + (unread ? '<span class="dot"></span>' : "");
  renderToday(d); renderGoal(); renderHint(); renderGather(); renderMap(d); renderSheet(d); renderShop(); renderMail(d); renderTown(d);
}

function renderToday(d) {
  const used = (st.energy.byWeek || {})[T.apWeek(d)] || 0;
  const got = Object.keys(st.energy.receipts).some(k => k.startsWith("daily:" + d + "::"));
  const hasDrill = typeof DRILLS !== "undefined" && DRILLS.some(x => x.date === d);
  const dow = new Date(d + "T12:00:00").getDay();
  let h;
  if (got) h = `<span>✅ 今天的英文做完了，體力已經補進來。</span><span class="muted">本週已拿 ${used}/${T.AP_WEEKLY_CAP}</span>`;
  else if (hasDrill) h = `<span>📝 做完今天的每日練習，就能 +${T.AP_PER_TASK} ⚡</span><a class="btn go" href="../drills/daily_${d}.html">去做練習 →</a>`;
  else if (dow === 6) h = `<span>🏁 週六沒有每日練習，可以去做本週總複習。體力用之前存的。</span><a class="btn" href="../weekly_review.html">本週總複習 →</a>`;
  else h = `<span>😴 今天沒有每日練習，體力用之前存的。</span><span class="muted">本週已拿 ${used}/${T.AP_WEEKLY_CAP}</span>`;
  document.getElementById("today").innerHTML = h;
}

// 東西的圖示、名字、去哪裡拿
const ICON = { ap: "⚡", money: "🪙", wood: "🪵", stone: "🪨" };
const itemIcon = k => ICON[k] || (C.CROPS[k] && C.CROPS[k].emoji) || (C.DECOR[k] && C.DECOR[k].emoji) || "📦";
const itemName = k => C.NAME[k] || k;
function whereToGet(k) {
  if (k === "ap") return "做英文練習換體力";
  if (k === "wood" || k === "stone") return "在農莊撿";
  if (C.CROPS[k]) return C.CROPS[k].freeSeed ? "種田收成（種子免費）" : "去商店買種子，種田收成";
  if (C.DECOR[k]) return "去商店買（擺在農莊的可以收回再交）";
  return "";
}
// 下一個目標：孩子每次打開農莊都知道自己在攢什麼
function renderGoal() {
  const g = T.nextGoal(st, C), el = document.getElementById("goal");
  if (!g) { el.innerHTML = `<div class="goal">🎉 廣場修好了！下一個地標還在準備中。</div>`; return; }
  el.innerHTML = `<div class="goal" onclick="tab('town')" role="button" tabindex="0">
    <div class="ttl">🎯 ${g.name}第 ${g.stage + 1} 階「${esc(g.title)}」：任務完成 ${5 - g.left}/5${g.ready ? "　✅ 有任務可以交了，點這裡！" : ""}</div>
    <div class="parts">${g.parts.map(x => `<span class="pt${x.have >= x.need ? " ok" : ""}">${itemIcon(x.k)} ${itemName(x.k)} ${Math.min(x.have, x.need)}/${x.need}</span>`).join("")}</div>
    <div class="foot">⚡ 用不完的體力會存進儲備，永遠不會不見。不用急著花掉。</div></div>`;
}
// 第一次玩：還沒收成過、田也還沒開第二片時，告訴他田可以自己開
function renderHint() {
  const el = document.getElementById("hint");
  const fresh = !st.firstHarvest && st.farm.fields.length < 2;
  el.hidden = !fresh;
  if (fresh) el.innerHTML = st.farm.fields.some(f => f.crop)
    ? "👆 點<b>綠色空地</b>可以再開一片田，最多 8 片。田越多，一次收成越多。"
    : "👆 先點<b>咖啡色的田</b>種稻米（種子免費）。再點<b>綠色空地</b>可以多開幾片田，最多 8 片。";
}
// 撿材料：寫出用途和進度，夠了就不給撿
function renderGather() {
  [["wood", "woodBtn", "🪵", "木材"], ["stone", "stoneBtn", "🪨", "石頭"]].forEach(([k, id, em, zh]) => {
    const need = T.materialNeed(st, k, C), have = st.inv[k] || 0, b = document.getElementById(id);
    b.hidden = false;
    if (!need) { b.disabled = true; b.innerHTML = `${em} 這一階用不到${zh}`; return; }
    b.disabled = have >= need;
    b.innerHTML = have >= need ? `${em} ${zh}夠了 ✓ <span class="cost">${have}/${need}</span>`
      : `${em} 撿${zh}（修廣場用 ${have}/${need}） <span class="cost">2⚡</span>`;
  });
}

function fieldAt(x, y) { return st.farm.fields.find(f => x >= f.x && x <= f.x + 1 && y >= f.y && y <= f.y + 1); }
function decorAt(x, y) { return st.farm.decor.find(q => q.x === x && q.y === y); }

function renderMap(d) {
  let h = "";
  for (let y = 0; y < T.H; y++) for (let x = 0; x < T.W; x++) {
    const t = T.terrainAt(x, y);
    if (fieldAt(x, y) || decorAt(x, y)) continue;
    let cls = "cell" + ((x + y) % 2 ? " alt" : ""), em = "";
    if (t === "water") { cls = "cell water"; em = (x * 7 + y) % 9 === 0 ? "〰️" : ""; }
    else if (t === "house") { cls = "cell house"; em = (x === 0 && y === 0) ? "🏠" : ""; }
    else if (t === "path") { cls = "cell path"; em = x === 15 ? "🪧" : ""; }
    else if (t === "bin") { cls = "cell bin"; em = "📦"; }
    if (moving && t === "free") cls += " target";
    h += `<div class="${cls}" style="grid-column:${x + 1};grid-row:${y + 1}" onclick="tapCell(${x},${y})"></div>`.replace("></div>", `>${em}</div>`);
  }
  st.farm.fields.forEach(f => {
    const g = T.growth(f, d), ripe = T.isRipe(f, d), wet = T.caredToday(f, d);
    const c = f.crop && C.CROPS[f.crop];
    const em = !f.crop ? "" : ripe ? c.emoji : ["🟤", "🌱", "🌿"][g];
    const pips = f.crop && !ripe ? "●".repeat(g) + "○".repeat(T.GROW_DAYS - g) : "";
    h += `<div class="field${wet ? " wet" : ""}${ripe ? " ripe" : ""}${sel === f.id ? " sel" : ""}"
      style="grid-column:${f.x + 1}/span 2;grid-row:${f.y + 1}/span 2" onclick="tapThing('${f.id}')"
      aria-label="${c ? c.zh : "空田"}">${em}${pips ? `<span class="pips">${pips}</span>` : ""}</div>`;
  });
  st.farm.decor.forEach(q => {
    h += `<div class="decor${sel === q.id ? " sel" : ""}" style="grid-column:${q.x + 1};grid-row:${q.y + 1}" onclick="tapThing('${q.id}')">${C.DECOR[q.type].emoji}</div>`;
  });
  document.getElementById("map").innerHTML = h;
  const growing = st.farm.fields.filter(f => f.crop && !T.isRipe(f, d) && !T.caredToday(f, d)).length;
  const btn = document.getElementById("careBtn");
  btn.disabled = !growing;
  btn.innerHTML = growing ? `🚿 照料 ${growing} 片田 <span class="cost">1⚡</span>` : (st.farm.lastCare === d ? "🚿 今天照料過了" : "🚿 沒有要照料的田");
  document.getElementById("moveBar").hidden = !moving;
  if (moving) document.getElementById("moveMsg").textContent = "點一塊空地放下" + (moving.type ? "：" + C.DECOR[moving.type].zh : "");
}

function tapCell(x, y) {
  const t = T.terrainAt(x, y);
  if (moving) {
    const r = moving.type ? T.placeDecor(st, moving.type, x, y, today(), C) : T.move(st, moving.id, x, y);
    if (r.ok) { moving = null; sel = null; }
    return act(r);
  }
  if (t === "bin") { tab("shop"); return; }
  if (t === "house") { sel = "house"; return render(); }
  if (t !== "free") return;
  sel = { x, y }; render();
}
function tapThing(id) { if (moving) return toast("要放在空地上"); sel = id; render(); }
function cancelMove() { moving = null; render(); }

function renderSheet(d) {
  const el = document.getElementById("sheet");
  if (!sel) { el.hidden = true; return; }
  el.hidden = false;
  if (sel === "house") {
    el.innerHTML = `<h2>🏠 我的家</h2><p class="muted">做英文就像吃早餐，吃飽了才有體力下田。</p>
      <button class="btn" onclick="sel=null;render()">關閉</button>`; return;
  }
  if (typeof sel === "object") {
    const owned = Object.keys(st.decorOwned).filter(k => st.decorOwned[k] > 0);
    el.innerHTML = `<h2>這塊空地</h2><div class="actions">
      <button class="btn" onclick="act(T.addField(st,${sel.x},${sel.y}));sel=null;render()">🟫 開一片田（2×2，免費）</button>
      ${owned.map(k => `<button class="btn" onclick="act(T.placeDecor(st,'${k}',${sel.x},${sel.y},today(),C));sel=null;render()">${C.DECOR[k].emoji} 擺${C.DECOR[k].zh}（${st.decorOwned[k]}）</button>`).join("")}
      <button class="btn" onclick="sel=null;render()">關閉</button></div>
      ${owned.length ? "" : '<p class="muted">裝飾可以在商店買。</p>'}`;
    return;
  }
  const f = st.farm.fields.find(q => q.id === sel);
  if (f) {
    const c = f.crop && C.CROPS[f.crop], g = T.growth(f, d), ripe = T.isRipe(f, d);
    let h = `<h2>${c ? `${c.emoji} ${c.en} <span class="muted">${c.zh}</span> <button class="btn" onclick="play(wordAudio('${c.en}'))">🔊</button>` : "🟫 空田"}</h2>`;
    if (!f.crop) {
      h += `<p class="muted">要種什麼？播種要 2 ⚡。</p><div class="actions">` + Object.keys(C.CROPS).map(k => {
        const cc = C.CROPS[k], n = cc.freeSeed ? "免費" : `種子 ${st.inv[k + "_seed"] || 0}`;
        return `<button class="btn" onclick="act(T.plant(st,'${f.id}','${k}',today(),C))">${cc.emoji} ${cc.en} <span class="cost">${n}</span></button>`;
      }).join("") + `</div>`;
    } else if (ripe) {
      h += `<p>成熟了！收成不花體力。</p><div class="actions"><button class="btn go" onclick="act(T.harvest(st,'${f.id}',today(),C));sel=null;render()">🧺 收成</button></div>`;
    } else {
      h += `<p>照料了 ${g}/${T.GROW_DAYS} 天。${T.caredToday(f, d) ? "今天照料過了，明天會長大。" : "今天還沒照料。"}</p>`;
    }
    h += `<div class="actions"><button class="btn" onclick="moving={id:'${f.id}'};sel=null;render()">↔ 搬家（免費）</button><button class="btn" onclick="sel=null;render()">關閉</button></div>`;
    el.innerHTML = h; return;
  }
  const q = st.farm.decor.find(z => z.id === sel);
  if (q) {
    const dd = C.DECOR[q.type];
    el.innerHTML = `<h2>${dd.emoji} ${dd.en} <span class="muted">${dd.zh}</span> <button class="btn" onclick="play(wordAudio('${dd.en}'))">🔊</button></h2>
      <div class="actions"><button class="btn" onclick="moving={id:'${q.id}'};sel=null;render()">↔ 搬家</button>
      <button class="btn" onclick="act(T.storeDecor(st,'${q.id}'));sel=null;render()">🎒 收回背包</button>
      <button class="btn" onclick="sel=null;render()">關閉</button></div>`;
    return;
  }
  sel = null; el.hidden = true;
}

function doCare() { act(T.care(st, today(), C)); }
function doGather(m) { act(T.gather(st, m, today(), C)); }

// ── 商店與背包 ─────────────────────────────────────────────────────
function renderShop() {
  const sellRows = Object.keys(C.SELL).map(k => {
    const c = C.CROPS[k], n = st.inv[k] || 0;
    return `<div class="item"><div class="top"><span class="em">${c.emoji}</span><div><div class="en">${c.en}</div><div class="zh">${c.zh}　有 <span class="n">${n}</span></div></div></div>
      <button class="btn" ${n ? "" : "disabled"} onclick="act(T.sell(st,'${k}',1,C))">賣 1 個 +${C.SELL[k]}🪙</button>

  }).join("");
  const seeds = ["carrot", "potato"].map(k => {
    const c = C.CROPS[k];
    return `<div class="item"><div class="top"><span class="em">${c.emoji}</span><div><div class="en">${c.en} seeds</div><div class="zh">${c.zh}種子　有 <span class="n">${st.inv[k + "_seed"] || 0}</span></div></div></div>
      <button class="btn" onclick="act(T.buy(st,'${k}_seed',1,C))">買 1 包 −${C.BUY[k + "_seed"]}🪙</button></div>`;
  }).join("");
  const decor = Object.keys(C.DECOR).map(k => {

      <button class="btn" onclick="act(T.buy(st,'${k}',1,C))">買 −${C.BUY[k]}🪙</button></div>`;

  document.getElementById("p-shop").innerHTML = `
    <h2>📦 出貨</h2><p class="muted">作物賣掉換小鎮幣。稻米種子永遠免費，錢花光也能重新開始。</p><div class="grid2">${sellRows}</div>
    <h2 style="margin-top:16px">🌱 種子</h2><div class="grid2">${seeds}</div>
    <h2 style="margin-top:16px">🌼 裝飾</h2><p class="muted">擺在農莊裡不會賺錢，純粹好看。買了可以隨時免費搬家或收回。</p><div class="grid2">${decor}</div>
    <h2 style="margin-top:16px">🎒 材料</h2><p>🪵 wood <span class="n">${st.inv.wood}</span>　🪨 stone <span class="n">${st.inv.stone}</span></p>`;

// ── 村民與信件 ─────────────────────────────────────────────────────
function visibleWeeks() { const wk = T.contentWeek(today()); return Object.keys(C.WEEKS).filter(k => k <= wk).sort().reverse(); }
// 新村民搬來時寄的信：跟每週的信一樣可以聽、看中文、標已讀
function welcomeCards() {
  return Object.keys(C.VILLAGERS).filter(v => C.VILLAGERS[v].welcome && st.residents[v]).map(v => ({
    id: "arrive_" + v, type: "letter", speaker: v, week: T.contentWeek(T.TOWN_START), en: C.VILLAGERS[v].welcome, zh: C.VILLAGERS[v].welcomeZh }));
}
function visibleCards() { return welcomeCards().concat(visibleWeeks().flatMap(k => C.WEEKS[k].cards)); }
const residents = () => Object.keys(C.VILLAGERS).filter(v => T.isResident(st, v, C));
// 還沒搬來的下一位：只給門檻，不透露是誰
function soonHtml() {
  const lv = T.prosperityLevel(st, C), v = lv.nextVillager;
  if (!v) return "";
  const need = C.VILLAGERS[v].arrive;
  return `<span class="soon" title="繁榮度 ${need} 搬來">❔</span><span class="muted">繁榮度到 <b>${need}</b> 會有新村民搬來（還差 ${Math.max(0, need - lv.score)}）</span>`;
}

function renderMail(d) {
  const weeks = visibleWeeks();
  if (!weeks.length) { document.getElementById("p-mail").innerHTML = "<p>村民還沒搬來，下週再來看看。</p>"; return; }
  let h = `<div class="folks">${residents().map(v => { const p = C.VILLAGERS[v];
    return `<button class="folk" onclick="openFolk('${v}')" aria-label="看 ${v} 的介紹">${pic(v)}<span><div class="nm">${v}</div>
      <div class="sm">${p.role.zh}　<span class="hearts">${"❤️".repeat(st.hearts[v] || 0) || "🤍"}</span></div><div class="sm">點我看介紹</div></span></button>`; }).join("")}</div>
    <div class="residents">${soonHtml()}</div>`;
  const wel = welcomeCards();
  if (wel.length) { h += `<h2>🏠 新鄰居</h2>`; wel.slice().reverse().forEach(c => h += cardHtml(c)); }
  weeks.forEach(wk => {
    const W = C.WEEKS[wk];
    h += `<h2>${wk.slice(5).replace("-", "/")} 那週・${W.theme}</h2>`;
    W.cards.forEach(c => h += cardHtml(c));
    const s = W.story, open = st.cards[s.needCard], doneS = st.stories[s.id] && st.stories[s.id].done;
    h += open ? storyHtml(s, doneS) : `<div class="card"><span class="muted">🔒 先讀 ${s.speaker} 的信，會解鎖一段小故事。</span></div>`;
  });
  document.getElementById("p-mail").innerHTML = h;
}
function cardHtml(c) {
  const v = C.VILLAGERS[c.speaker], seen = st.cards[c.id], icon = { letter: "📨", talk: "💬", quest: "📋" }[c.type];
  let h = `<div class="card${seen ? "" : " new"}${zhOpen.has(c.id) ? " showzh" : ""}"><div class="who2">${icon} <span onclick="openFolk('${c.speaker}')">${pic(c.speaker, true)}</span> ${c.speaker}${seen ? "" : ' <span class="chip">新</span>'}</div>
    <div class="en">${esc(c.en)}</div>
    <div class="actions"><button class="btn" onclick="play(townAudio('${c.id}'));markRead('${c.id}')">🔊 聽</button>
    <button class="btn" onclick="showZh('${c.id}')">看中文</button></div>
    <div class="zh">${esc(c.zh)}</div>`;
  if (c.type === "talk") {
    const chosen = seen && seen.choice;
    h += c.choices.map(o => `<button class="btn choice${chosen === o.id ? " picked" : ""}" onclick="act(T.answer(st,findCard('${c.id}'),'${o.id}',today()));play(townAudio('${c.id}_${o.id}'))">
      ${esc(o.en)}<span class="zhc">${esc(o.zh)}</span></button>`).join("");
    if (chosen) h += `<p class="muted">每個回答都可以，${c.speaker} 會記得你的選擇。</p>`;
  }
  if (c.type === "quest") {
    const q = c.quest, cr = C.CROPS[q.item], have = st.inv[q.item] || 0, doneQ = st.quests[c.id];
    h += doneQ ? `<p>✅ 已經交給 ${c.speaker} 了</p>`
      : `<div class="actions"><button class="btn go" ${have >= q.n ? "" : "disabled"} onclick="act(T.deliver(st,findCard('${c.id}'),today(),C))">交出 ${cr.emoji}×${q.n}（你有 ${have}）</button></div>`;
  }
  return h + `</div>`;
}
function storyHtml(s, doneS) {
  return `<div class="card story${zhOpen.has(s.id) ? " showzh" : ""}"><div class="who2">✨ <span onclick="openFolk('${s.speaker}')">${pic(s.speaker, true)}</span> ${s.speaker} 的小故事：${s.title}</div>
    <div class="actions"><button class="btn" onclick="play(townAudio('${s.id}'))">🔊 聽故事</button><button class="btn" onclick="showZh('${s.id}')">看中文</button></div>
    ${s.lines.map(l => `<div class="line">${esc(l.en)}</div><div class="zh">${esc(l.zh)}</div>`).join("")}
    <div class="say"><div>🗣️ 換你說最後一句，大聲念出來：</div><div class="en" style="font-family:Georgia,serif;font-size:1.15rem">${esc(s.speak)}</div>
    <div class="zh">${esc(s.speakZh)}</div>
    <div class="actions"><button class="btn" onclick="play(townAudio('${s.id}_say'))">🔊 先聽一次</button>
    ${doneS ? `<span>✅ 完成了（${esc(doneS)}）</span>` : `<button class="btn go" onclick="act(T.finishStory(st,findStory('${s.id}'),today(),C))">我念好了 ❤️</button>`}</div></div></div>`;
}
// 村民頭像：有圖用圖，圖還沒好或載入失敗就退回 emoji
function pic(v, small) {
  const p = C.VILLAGERS[v];
  return `<img class="pic${small ? " sm" : ""}" src="${p.img}" alt="${v}" onerror="this.outerHTML='<span class=&quot;pic${small ? " sm" : ""}&quot;>${p.emoji}</span>'">`;
}
// 人物卡：英文自我介紹（有語音）、個性、喜歡與討厭的東西
function openFolk(v) {
  const p = C.VILLAGERS[v]; if (!p) return;
  const chips = arr => arr.map(x => `<span>${x.emoji} ${esc(x.en)}<i>${esc(x.zh)}</i></span>`).join("");
  const m = document.getElementById("folkModal");
  m.classList.remove("showzh");
  document.getElementById("folkBox").innerHTML = `
    <div class="head">${pic(v)}<div><h3>${v}</h3><div>${esc(p.role.en)} <span class="muted">${esc(p.role.zh)}</span></div>
      <div class="muted">📍 ${esc(p.place.en)}（${esc(p.place.zh)}）</div>
      <div class="hearts">${"❤️".repeat(st.hearts[v] || 0) || "🤍"} <span class="muted">好感</span></div></div></div>
    <div class="en">${esc(p.intro)}</div><div class="zh">${esc(p.introZh)}</div>
    <div class="actions"><button class="btn" onclick="play(townAudio('villager_${v}'))">🔊 聽自我介紹</button>
      <button class="btn" onclick="document.getElementById('folkModal').classList.add('showzh')">看中文</button></div>
    <div class="lbl">個性</div><div class="chips">${chips(p.traits.map(t => ({ emoji: "✨", en: t.en, zh: t.zh })))}</div>
    <div class="lbl">💛 喜歡</div><div class="chips">${chips(p.likes)}</div>
    <div class="lbl">💢 不喜歡</div><div class="chips">${chips(p.dislikes)}</div>
    <div class="lbl">口頭禪</div><div class="en">“${esc(p.motto)}”</div><div class="zh">${esc(p.mottoZh)}</div>
    <div class="actions"><button class="btn" onclick="play(townAudio('villager_${v}_motto'))">🔊 聽口頭禪</button></div>
    <p class="muted" style="margin-top:10px">${esc(p.about)}</p>
    <div class="actions"><button class="btn go" onclick="closeFolk()">關閉</button></div>`;
  m.hidden = false;
}
function closeFolk() { document.getElementById("folkModal").hidden = true; }
function celebrate(r) {
  const L = C.LANDMARKS.plaza, stage = st.town.plaza || 0, came = r.arrived || [];
  const m = document.getElementById("folkModal");
  m.classList.remove("showzh");
  let h = `<div class="cele">`;
  if (r.stageDone) h += `<h3>🎉 ${L.zh}第 ${stage} 階修好了！</h3><div class="big">${L.look[stage].split(" ")[0]}</div>
    <p>${esc(L.look[stage].split(" ").slice(1).join(" "))}</p><p class="muted">🏘️ 繁榮度現在是 ${T.prosperity(st, C)}</p>`;
  came.forEach(v => { const p = C.VILLAGERS[v];
    h += `<h3>🏠 ${v} 搬來小鎮了！</h3><div>${pic(v)}</div><p><b>${esc(p.role.en)}</b> <span class="muted">${esc(p.role.zh)}</span></p>
      <div class="en">${esc(p.welcome || p.intro)}</div><div class="zh">${esc(p.welcomeZh || p.introZh)}</div>
      <div class="actions" style="justify-content:center"><button class="btn" onclick="play(townAudio('${p.welcome ? "arrive_" + v : "villager_" + v}'))">🔊 聽 ${v} 說話</button>
      <button class="btn" onclick="document.getElementById('folkModal').classList.add('showzh')">看中文</button>
      <button class="btn" onclick="openFolk('${v}')">認識 ${v}</button></div>`; });
  h += `<div class="actions" style="justify-content:center"><button class="btn go" onclick="closeFolk()">太好了！</button></div></div>`;
  document.getElementById("folkBox").innerHTML = h;
  m.hidden = false;
}

function findCard(id) { return visibleCards().find(c => c.id === id); }
function findStory(id) { return Object.values(C.WEEKS).map(w => w.story).find(s => s.id === id); }
function showZh(id) { zhOpen.add(id); if (findCard(id)) markRead(id); render(); }
function markRead(id) { const c = findCard(id); if (c && !st.cards[id]) { T.readCard(st, c, today()); persist(); render(); } }

// ── 小鎮與生活冊 ───────────────────────────────────────────────────
function prosperHtml() {
  const lv = T.prosperityLevel(st, C), P = C.PROSPERITY;
  const from = lv.level.at, to = lv.next ? lv.next.at : from, pct = lv.next ? Math.round((lv.score - from) / (to - from) * 100) : 100;
  return `<div class="prosper"><div class="ttl">🏘️ 繁榮度 ${lv.score}　${lv.level.emoji} ${lv.level.zh}</div>
    <div class="pbar"><i style="width:${Math.min(100, pct)}%"></i></div>
    <div class="muted">${lv.next ? `下一級 ${lv.next.at}「${lv.next.zh}」` : "已經是最高一級"}</div>
    <div class="residents">${residents().map(n => `<span onclick="openFolk('${n}')">${pic(n)}</span>`).join("")}${soonHtml()}</div>
    <div class="muted" style="font-size:.78rem">繁榮度怎麼來：完成任務 +${P.task}、修好一階 +${P.stage}、村民每顆 ❤️ +${P.heart}、農莊擺裝飾每件 +${P.decor}（最多算 ${P.decorMax} 件）</div></div>`;
}
function taskHtml(x) {
  const t = x.task, id = t.id, k = t.need.item, enough = x.have >= x.need;
  let foot;
  if (x.done) foot = `<span>✅ 已經交給 ${t.by} 了</span>`;
  else if (!x.here) foot = `<span class="muted">🔒 ${t.by} 還沒搬來</span>`;
  else foot = `<button class="btn go" ${x.ready ? "" : "disabled"} onclick="act(T.doTask(st,'plaza','${id}',today(),C))">交給 ${t.by}</button>`;
  return `<div class="task${x.done ? " done" : ""}${x.ready ? " ready" : ""}${zhOpen.has(id) ? " showzh" : ""}">
    <div class="who2"><span onclick="openFolk('${t.by}')">${pic(t.by, true)}</span> ${t.by}</div>
    <div class="en">${esc(t.en)}</div><div class="zh">${esc(t.zh)}</div>
    <div class="nd${x.done || enough ? " ok" : ""}">${itemIcon(k)} ${itemName(k)} ${x.done ? x.need : Math.min(x.have, x.need)}/${x.need}</div>
    ${x.done || enough ? "" : `<div class="where">👉 ${whereToGet(k)}</div>`}
    <div class="actions"><button class="btn" onclick="play(townAudio('task_${id}'))">🔊</button><button class="btn" onclick="showZh('${id}')">看中文</button>${foot}</div></div>`;
}
function renderTown(d) {
  const L = C.LANDMARKS.plaza, stage = st.town.plaza || 0, g = T.stageView(st, "plaza", C);
  let h = prosperHtml();
  h += `<h2>🏛️ ${L.zh}</h2><div class="landmark"><div class="look">${L.look[stage].split(" ")[0]}</div><div><b>${L.look[stage].split(" ").slice(1).join(" ")}</b>
    <div class="muted">已修好 ${stage}/${L.stages.length} 階</div></div></div>`;
  if (g) {
    h += `<h3>第 ${stage + 1} 階「${esc(g.title)}」：任務完成 ${5 - g.left}/5</h3>
      <p class="muted">5 個任務都交完，這一階就修好了：${esc(g.done)}。順序隨便你。</p>
      <div class="sum"><b>還需要：</b>${g.parts.map(x => `<span class="${x.have >= x.need ? "ok" : ""}">${itemIcon(x.k)} ${itemName(x.k)} ${Math.min(x.have, x.need)}/${x.need}</span>`).join("")}</div>
      <div class="tasks">${g.tasks.map(taskHtml).join("")}</div>`;
    L.stages.slice(stage + 1).forEach((sg, j) => h += `<div class="later">🔒 第 ${stage + 2 + j} 階「${esc(sg.title)}」：上一階修好後開放</div>`);
  } else h += `<p>✅ 廣場三階都修好了！下一個地標還在準備中。</p>`;
  const weeks = Object.keys(st.book).sort().reverse();
  h += `<h2 style="margin-top:18px">📖 四季生活冊</h2>` + (weeks.length ? `<div class="book">` + weeks.map(w =>
    `<h3>${w.slice(5).replace("-", "/")} 那週（${T.season(w)}季）</h3><ul>${st.book[w].map(e =>
      `<li>${e.date.slice(5)}　${esc(e.text)}${e.en ? `　<span class="en">${esc(e.en)}</span>` : ""}</li>`).join("")}</ul>`).join("") + `</div>`
    : `<p class="muted">收成、讀信、跟村民聊天，都會記在這裡。</p>`);
  h += `<h2 style="margin-top:18px">💾 存檔</h2><p class="muted">登入帳號後，進度會自動備份到雲端。也可以匯出一份檔案自己留著。</p>
    <div class="actions"><button class="btn" onclick="exportSave()">⬇ 匯出存檔</button>
    <label class="btn">⬆ 匯入存檔<input type="file" accept="application/json" hidden onchange="importSave(this)"></label></div>`;
  document.getElementById("p-town").innerHTML = h;
}
function exportSave() {
  const blob = new Blob([JSON.stringify(st, null, 1)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = `town_${student}_${today()}.json`; a.click();
}
function importSave(inp) {
  const f = inp.files[0]; if (!f) return;
  f.text().then(t => {
    const next = T.normalize(JSON.parse(t), student, today(), C);
    T.arrive(next, today(), C);             // 跟讀檔一樣：繁榮度夠的村民直接搬來
    next._baseRev = -1;                     // 匯入是有意覆蓋，不做分頁衝突檢查
    T.save(storage(), next);                // 寫不進去會丟例外，原本的 st 不動
    st = next; sel = null; moving = null; render(); toast("匯入完成");
  }).catch(e => toast("匯入失敗：" + e.message + "（原本的存檔沒有被動到）"));
  inp.value = "";
}

function tab(name) {
  ["farm", "shop", "mail", "town"].forEach(k => {
    document.getElementById("p-" + k).hidden = k !== name;
    document.getElementById("t-" + k).classList.toggle("on", k === name);
  });
}

function refresh() {
  if (!st) return;
  let cur = null;
  try { cur = JSON.parse(storage().getItem(T.key(student)) || "null"); } catch (e) {}
  if (cur && cur.rev > st._baseRev && st._baseRev >= 0) return reload("另一個分頁更新了進度，已經重新載入");
  const got = T.syncFromProgress(st, progress());
  if (got) { persist(); toast("做英文換來的體力：+" + got + " ⚡"); }
  render();
}
document.addEventListener && document.addEventListener("visibilitychange", () => {
  if (!document.hidden) refresh();
  else if (cloudTimer) pushCloud(true);
});
window.addEventListener && window.addEventListener("focus", refresh);
let lastDay = null;
setInterval(() => { const d = today(); if (d !== lastDay) { lastDay = d; refresh(); } }, 60000);

(function boot() {
  if (window.sbClient) return;   // 有登入系統：等守門確認帳號後呼叫 selectStudent
  let last = null; try { last = storage().getItem("kidsCurrentStudent"); } catch (e) {}
  pick(STUDENTS.some(s => s[0] === last) ? last : "test");
})();
</script>
</body>

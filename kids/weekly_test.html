<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>每週綜合測驗</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  background:#f6f8fa;color:#22303f;line-height:1.7;padding:0 0 70px}
header{background:linear-gradient(135deg,#efe6ff,#eef7ff);padding:19px 16px 15px;text-align:center;
  border-bottom:3px solid #b49ae0}
header h1{margin:0 0 3px;font-size:1.22rem}
header p{margin:0;font-size:.8rem;color:#5a6875}
header a{color:#2f80ed;text-decoration:none}
.wrap{max-width:720px;margin:0 auto;padding:0 14px}
.stubar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;background:#fff;border:1px solid #e3e8ee;
  border-radius:12px;padding:9px 12px;margin:14px 0}
.stubar .lab{font-size:.8rem;color:#6b7a8c}
.stu-btn{border:1px solid #cfd8e3;background:#fff;border-radius:16px;padding:5px 13px;font-size:.85rem;cursor:pointer;font-family:inherit}
.stu-btn.active{background:#2f80ed;color:#fff;border-color:#2f80ed;font-weight:700}
.coin{margin-left:auto;background:#fff6dc;border:1px solid #f2d38a;border-radius:14px;padding:4px 11px;font-size:.85rem;font-weight:700}
#coinBox.bump{animation:coinBump .6s ease}
@keyframes coinBump{0%,100%{transform:scale(1)}30%{transform:scale(1.35);background:#ffe27a}}
.card{background:#fff;border:1px solid #e3e8ee;border-radius:14px;padding:15px 16px;margin:13px 0}
.card h2{font-size:1rem;margin:0 0 4px}
.note{font-size:.86rem;color:#5a6875}
.q{border-top:1px solid #eef1f5;padding:13px 0}
.q:first-of-type{border-top:0}
.q .ask{font-weight:700;font-size:.94rem;margin-bottom:7px}
.q .sent{display:block;font-weight:400;color:#3d4b5a;margin-top:3px}
.q .from{font-size:.72rem;color:#9aa6b3;font-weight:400}
.opt{display:block;width:100%;text-align:left;border:1px solid #cfd8e3;background:#fff;border-radius:10px;
  padding:9px 12px;margin:5px 0;font-size:.9rem;cursor:pointer;font-family:inherit}
.opt:hover{border-color:#2f80ed}
.opt.ok{background:#e8f7ee;border-color:#2fbf71;font-weight:700}
.opt.no{background:#fdecec;border-color:#e88}
.opt[disabled]{cursor:default}
.why{font-size:.82rem;color:#6b7a8c;margin-top:5px;padding-left:2px}
.spk{border:0;background:#e6f0fb;border-radius:8px;padding:2px 8px;font-size:.8rem;cursor:pointer;font-family:inherit}
.fin{width:100%;border:0;border-radius:12px;padding:13px;font-size:1rem;font-weight:700;color:#fff;
  background:#5b3aa0;cursor:pointer;font-family:inherit}
.fin[disabled]{background:#c3ccd8;cursor:default}
/* 紅黃綠：以節點／單元為單位，才知道要回去複習哪一課 */
.rag{display:flex;justify-content:space-between;gap:9px;align-items:center;padding:9px 0;border-top:1px solid #eef1f5;font-size:.89rem}
.rag:first-child{border-top:0}
.rag a{color:#22303f;text-decoration:none}
.rag .dot{font-size:.78rem;font-weight:700;white-space:nowrap}
.g{color:#1f8a4c}.y{color:#b3621a}.r{color:#c0392b}
.bonus{background:linear-gradient(135deg,#fff3cd,#fffdf5);border:2px solid #f2c94c;border-radius:12px;
  padding:13px;margin:12px 0;text-align:center}
#toast{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-90px);background:#243042;color:#fff;
  padding:11px 20px;border-radius:20px;font-size:.95rem;font-weight:700;transition:transform .3s;z-index:100;
  max-width:90%;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<header>
  <h1>📝 每週綜合測驗</h1>
  <p>考你這陣子學過的東西，看看還記不記得　·　<a href="index.html">← 回首頁</a></p>
</header>

<div class="wrap">
  <div class="stubar">
    <span class="lab">我是：</span>
    <button class="stu-btn" onclick="pickStudent('albert')">Albert</button>
    <button class="stu-btn" onclick="pickStudent('jonathan')">Jonathan</button>
    <button class="stu-btn" onclick="pickStudent('ryder')">Ryder</button>
    <button class="stu-btn" style="opacity:.7" onclick="pickStudent('test')">🧪 測試</button>
    <span class="coin" id="coinBox">🪙 —</span>
  </div>
  <div id="main"><div class="card note">先選上面的名字。</div></div>
</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="cloud_sync.js?v=202607280551"></script>
<script src="account_lock.js?v=202607280551"></script>
<script src="supabase_auth.js?v=202607280551"></script>
<script src="ai_review.js?v=202607280551"></script>
<script src="week_key.js?v=202607280551"></script>
<script src="grammar_nodes.js?v=202607280551"></script>
<script src="grammar_plan.js?v=202607280551"></script>
<script src="vocab_units.js?v=202607280551"></script>
<script src="vocab_unit_plan.js?v=202607280551"></script>
<script src="weekly_bank.js?v=202607280551"></script>
<script>
var currentStudent = null, curAudio = null;
var TEST = null, answers = {}, graded = false, wrongForAI = [];

var GRAMMAR_ITEMS = 3, VOCAB_ITEMS = 3, Q_PER_ITEM = 2;   // 3+3 項 × 2 題 = 12 題，約 10 分鐘
var COIN_BASE = 20, COIN_ACC = 30;                        // 20 + 依正確率最多 30
var KEEP_TESTS = 8;

function getProgress(s) {
  var raw = localStorage.getItem("kidsProgress." + s);
  var p = raw ? JSON.parse(raw) : { wrongCounts:{}, sessions:0, totalCorrect:0, totalWrong:0 };
  if (!p.coins) p.coins = { balance:0, lifetimeEarned:0, lifetimeSpent:0, transactions:[], claimedDrills:{} };
  if (!p.grammar) p.grammar = { schemaVersion:1, nodes:{}, completedCount:0, coinsEarned:0, updatedAt:null };
  if (!p.vocab) p.vocab = { schemaVersion:1, units:{}, completedCount:0, coinsEarned:0, updatedAt:null };
  if (!p.vocab.units) p.vocab.units = {};
  if (!p.weeklyTests) p.weeklyTests = [];
  return p;
}
function saveProgress(s, p) { localStorage.setItem("kidsProgress." + s, JSON.stringify(p)); }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
  return { "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;" }[c]; }); }

// 週次定義與作業共用 week_key.js —— 週六同時是上週作業截止與本週測驗開放，
// 兩邊各自實作一份遲早會算出不同的週。
var ymd = WeekKey.ymd, testWeekKey = WeekKey.weekKey;
function doneThisWeek(p) {
  var k = testWeekKey();
  return (p.weeklyTests || []).some(function (t) { return t.week === k; });
}

function play(src) {
  if (curAudio) { curAudio.pause(); curAudio = null; }
  var a = new Audio(src); curAudio = a; a.play().catch(function () {});
}
function refreshCoin(bump) {
  var el = document.getElementById("coinBox");
  el.textContent = currentStudent ? "🪙 " + getProgress(currentStudent).coins.balance : "🪙 —";
  if (bump) { el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); }
}
var _tt = null;
function toast(msg) {
  var t = document.getElementById("toast");
  t.innerHTML = msg; t.classList.add("show");
  clearTimeout(_tt); _tt = setTimeout(function () { t.classList.remove("show"); }, 3200);
}

// ── 組卷 ────────────────────────────────────────────────────────────────
// 只考「已經完成過的」節點與單元 —— 沒學過的拿來考不是抓遺忘，是打擊信心。
// 本月課表裡完成的排前面，其餘依最久沒複習的排序（間隔複習）。
function eligible(p, kind) {
  var recs = kind === "grammar" ? p.grammar.nodes : p.vocab.units;
  var bank = WEEKLY_BANK[kind];
  var planned = [];
  var plan = kind === "grammar"
    ? (window.GrammarPlan && GrammarPlan.activePlan(p))
    : (window.VocabPlan && VocabPlan.activePlan(p));
  if (plan) planned = (plan.nodes || plan.units || []);

  var ids = Object.keys(recs || {}).filter(function (id) {
    return bank[id] && bank[id].length >= Q_PER_ITEM;
  });
  ids.sort(function (a, b) {
    var pa = planned.indexOf(a) >= 0 ? 0 : 1, pb = planned.indexOf(b) >= 0 ? 0 : 1;
    if (pa !== pb) return pa - pb;
    return String((recs[a] || {}).lastAt || "").localeCompare(String((recs[b] || {}).lastAt || ""));
  });
  return ids;
}

// 每週抽到的題目要不一樣，但同一週重新整理頁面必須拿到同一份卷子。
var offsetFor = WeekKey.seedOf;

function buildTest(p) {
  var week = testWeekKey();
  var qs = [];
  [["grammar", GRAMMAR_ITEMS], ["vocab", VOCAB_ITEMS]].forEach(function (pair) {
    var kind = pair[0], want = pair[1];
    var ids = eligible(p, kind).slice(0, want);
    ids.forEach(function (id) {
      var bank = WEEKLY_BANK[kind][id];
      var off = offsetFor(week, currentStudent, id);
      for (var i = 0; i < Q_PER_ITEM; i++) {
        var q = bank[(off + i) % bank.length];
        qs.push({ kind: kind, itemId: id, q: q });
      }
    });
  });
  return { week: week, questions: qs };
}

function itemTitle(kind, id) {
  var o = kind === "grammar" ? (window.GrammarPlan && GrammarPlan.byId(id)) : (window.VocabPlan && VocabPlan.byId(id));
  return o ? o.titleZh : id;
}
function itemHref(kind, id) {
  return kind === "grammar" ? "grammar_db/lessons/" + id + ".html" : "vocab_db/units/" + id + ".html";
}

// ── 畫面 ────────────────────────────────────────────────────────────────
function render() {
  var box = document.getElementById("main");
  if (!currentStudent) { box.innerHTML = '<div class="card note">先選上面的名字。</div>'; refreshCoin(); return; }
  var p = getProgress(currentStudent);

  if (doneThisWeek(p)) { box.innerHTML = renderDone(p); refreshCoin(); return; }

  TEST = buildTest(p); answers = {}; graded = false;
  if (TEST.questions.length < 4) {
    box.innerHTML = '<div class="card"><b>這一週還沒有東西可以考</b>' +
      '<p class="note">週測只考你<b>已經上過</b>的課，這樣才知道你是不是還記得。' +
      '你目前完成的課還太少，先去上兩課再回來。</p>' +
      '<p class="note" style="margin-top:8px">' +
      '<a href="grammar_month.html" style="color:#2f80ed;font-weight:700">🗓️ 本月文法課表</a>　·　' +
      '<a href="vocab_month.html" style="color:#2f80ed;font-weight:700">🔤 本月單字課表</a></p></div>';
    refreshCoin(); return;
  }

  var h = '<div class="card"><b>' + TEST.questions.length + ' 題　·　大約 10 分鐘</b>' +
    '<p class="note" style="margin:4px 0 0">這些都是你這陣子學過的。答完按最下面的按鈕看結果，' +
    '一週可以領一次金幣。</p></div><div class="card">';
  TEST.questions.forEach(function (item, i) {
    var q = item.q;
    h += '<div class="q" id="q' + i + '"><div class="ask">' + (i + 1) + ". " + q.ask +
      (q.audio ? ' <button class="spk" onclick="play(\'' + q.audio + '\')">🔊</button>' : "") +
      '<br><span class="from">來自：' + esc(itemTitle(item.kind, item.itemId)) + '</span></div>';
    q.options.forEach(function (o, j) {
      h += '<button class="opt" onclick="choose(' + i + ',' + j + ')">' + esc(o) + '</button>';
    });
    h += '<div class="why" id="w' + i + '"></div></div>';
  });
  h += '</div><div class="card"><button class="fin" id="finBtn" onclick="grade()">看結果並領金幣 🪙</button></div>';
  box.innerHTML = h;
  refreshCoin();
}

function choose(qi, oi) {
  if (graded) return;
  answers[qi] = oi;
  var btns = document.getElementById("q" + qi).querySelectorAll(".opt");
  for (var i = 0; i < btns.length; i++) btns[i].style.borderColor = (i === oi) ? "#2f80ed" : "#cfd8e3";
}

function grade() {
  if (graded) return;
  var unanswered = [];
  for (var i = 0; i < TEST.questions.length; i++) if (answers[i] === undefined) unanswered.push(i + 1);
  if (unanswered.length) { toast("還有第 " + unanswered.slice(0, 3).join("、") + " 題沒作答"); return; }
  graded = true;

  var byItem = { grammar: {}, vocab: {} };
  var correct = 0;
  TEST.questions.forEach(function (item, i) {
    var q = item.q, chosen = q.options[answers[i]], good = chosen === q.answer;
    if (good) correct++;
    var m = byItem[item.kind];
    if (!m[item.itemId]) m[item.itemId] = { correct: 0, total: 0 };
    m[item.itemId].total++;
    if (good) m[item.itemId].correct++;

    var btns = document.getElementById("q" + i).querySelectorAll(".opt");
    for (var j = 0; j < btns.length; j++) {
      btns[j].disabled = true; btns[j].style.borderColor = "";
      if (q.options[j] === q.answer) btns[j].classList.add("ok");
      else if (j === answers[i]) btns[j].classList.add("no");
    }
    if (!good && q.why) document.getElementById("w" + i).textContent = "💡 " + q.why;
    // 錯題內容留給 AI 複習：標明是哪一課的，AI 才知道該補哪個觀念
    if (!good) wrongForAI.push({
      q: "（" + itemTitle(item.kind, item.itemId) + "）" + q.ask.replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim(),
      chose: chosen, answer: q.answer, note: q.why || null,
    });
  });

  var total = TEST.questions.length;
  var p = getProgress(currentStudent);
  var earned = COIN_BASE + Math.round(COIN_ACC * correct / total);
  var now = new Date(), day = ymd(now);

  p.weeklyTests.push({ week: TEST.week, at: day, correct: correct, total: total,
    grammar: byItem.grammar, vocab: byItem.vocab });
  if (p.weeklyTests.length > KEEP_TESTS) p.weeklyTests = p.weeklyTests.slice(-KEEP_TESTS);
  p.totalCorrect = (p.totalCorrect || 0) + correct;
  p.totalWrong = (p.totalWrong || 0) + (total - correct);
  p.coins.balance += earned; p.coins.lifetimeEarned += earned;
  p.coins.transactions.push({ type:"earn", source:"weeklyTest", amount:earned,
    balanceAfter:p.coins.balance, createdAt:day, meta:{ week:TEST.week, correct:correct, total:total } });
  saveProgress(currentStudent, p);
  if (typeof cloudSave === "function") cloudSave(currentStudent);

  document.getElementById("finBtn").disabled = true;
  document.getElementById("finBtn").textContent = "已完成這一週的測驗";
  refreshCoin(true);
  toast("🪙 +" + earned + " 金幣！答對 " + correct + " / " + total);

  var res = document.createElement("div");
  res.innerHTML = renderResult(p, byItem, correct, total, earned);
  document.querySelector(".wrap").insertBefore(res, document.getElementById("main"));
  if (window.AIReview) {
    var aiWrap = document.createElement("div");
    aiWrap.id = "aiBox";
    res.appendChild(aiWrap);
    AIReview.render("aiBox", {
      subject: "綜合測驗", topic: "這一週學過的文法與單字",
      goal: "把這陣子上過的課再確認一次",
      wrong: wrongForAI, correct: correct, total: total,
    });
  }
  res.scrollIntoView({ behavior: "smooth", block: "start" });
}

function ragOf(c, t) {
  var r = t ? c / t : 0;
  if (r >= 1) return { cls: "g", txt: "🟢 很穩" };
  if (r >= 0.5) return { cls: "y", txt: "🟡 有點忘了" };
  return { cls: "r", txt: "🔴 要重看" };
}

function renderResult(p, byItem, correct, total, earned) {
  var rows = "";
  [["grammar", "文法"], ["vocab", "單字"]].forEach(function (pair) {
    var kind = pair[0];
    Object.keys(byItem[kind]).forEach(function (id) {
      var s = byItem[kind][id], rag = ragOf(s.correct, s.total);
      rows += '<div class="rag"><a href="' + itemHref(kind, id) + '">' +
        pair[1] + '｜' + esc(itemTitle(kind, id)) + '</a>' +
        '<span class="dot ' + rag.cls + '">' + rag.txt + ' ' + s.correct + '/' + s.total + '</span></div>';
    });
  });
  return '<div class="bonus"><div style="font-size:1.6rem">🪙</div>' +
      '<b>答對 ' + correct + ' / ' + total + '　領到 ' + earned + ' 金幣</b></div>' +
    '<div class="card"><h2>哪些還記得，哪些忘了</h2>' +
    '<p class="note">🔴 的那幾課點進去重看一次。下個月選課時，系統也會把它們排進「修復」路線。</p>' +
    rows + '</div>';
}

function renderDone(p) {
  var t = p.weeklyTests.filter(function (x) { return x.week === testWeekKey(); })[0];
  var rows = "";
  [["grammar", "文法"], ["vocab", "單字"]].forEach(function (pair) {
    var m = t[pair[0]] || {};
    Object.keys(m).forEach(function (id) {
      var s = m[id], rag = ragOf(s.correct, s.total);
      rows += '<div class="rag"><a href="' + itemHref(pair[0], id) + '">' +
        pair[1] + '｜' + esc(itemTitle(pair[0], id)) + '</a>' +
        '<span class="dot ' + rag.cls + '">' + rag.txt + ' ' + s.correct + '/' + s.total + '</span></div>';
    });
  });
  var nextWeek = WeekKey.nextWeekKey();
  return '<div class="card"><b>這一週的測驗已經考完了 ✅</b>' +
    '<p class="note">答對 ' + t.correct + ' / ' + t.total + '（' + t.at + '）。' +
    '下一份測驗 ' + ymd(next) + ' 星期六開放。</p></div>' +
    '<div class="card"><h2>上次的結果</h2>' + rows + '</div>';
}

function pickStudent(name) {
  if (typeof requireUnlock === "function" && !requireUnlock(name)) return;
  currentStudent = name;
  localStorage.setItem("kidsCurrentStudent", name);
  var btns = document.querySelectorAll(".stu-btn");
  for (var i = 0; i < btns.length; i++)
    btns[i].classList.toggle("active", btns[i].textContent.toLowerCase().indexOf(name) >= 0);
  render();
}

(function () {
  var last = localStorage.getItem("kidsCurrentStudent");
  if (!window.sbClient && last && last !== "guest") pickStudent(last); else render();
})();
</script>
</body>
</html>

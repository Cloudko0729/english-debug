<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="英文打字練習遊戲 - 透過下落字母方塊提升你的打字速度與準確度">
  <title>英文打字方塊遊戲 | Typing Block Game</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Noto+Sans+TC:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-primary: #0f0f1a;
      --bg-secondary: #1a1a2e;
      --bg-card: rgba(30, 30, 55, 0.7);
      --text-primary: #e8e8f0;
      --text-secondary: #9898b8;
      --accent-cyan: #00d4ff;
      --accent-purple: #a855f7;
      --accent-pink: #f472b6;
      --accent-green: #34d399;
      --accent-orange: #fb923c;
      --accent-red: #f87171;
      --accent-yellow: #fbbf24;
      --grid-border: rgba(100, 100, 180, 0.2);
      --grid-bg: rgba(15, 15, 30, 0.85);
      --finger-pinky: #f472b6;
      --finger-ring: #86efac;
      --finger-middle: #fcd34d;
      --finger-l-index: #d8b4fe;
      --finger-r-index: #93c5fd;
      --finger-thumb: #d1d5db;
      --finger-pinky-bg: rgba(244, 114, 182, 0.15);
      --finger-ring-bg: rgba(134, 239, 172, 0.15);
      --finger-middle-bg: rgba(253, 211, 77, 0.15);
      --finger-l-index-bg: rgba(216, 180, 254, 0.15);
      --finger-r-index-bg: rgba(147, 197, 253, 0.15);
      --finger-thumb-bg: rgba(209, 213, 219, 0.15);
    }

    body {
      font-family: 'Inter', 'Noto Sans TC', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
      background-image:
        radial-gradient(ellipse at 20% 0%, rgba(168, 85, 247, 0.12) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 0%, rgba(0, 212, 255, 0.10) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 100%, rgba(244, 114, 182, 0.08) 0%, transparent 50%);
    }

    .app-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 16px 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ===== HEADER ===== */
    .header {
      text-align: center;
    }

    .header h1 {
      font-size: 2rem;
      font-weight: 900;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple), var(--accent-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .header p {
      color: var(--text-secondary);
      font-size: 0.85rem;
      margin-top: 4px;
    }

    /* ===== WORD LIST (COLLAPSIBLE) ===== */
    .word-list-section {
      background: var(--bg-card);
      border: 1px solid var(--grid-border);
      border-radius: 16px;
      backdrop-filter: blur(12px);
      overflow: hidden;
    }

    .word-list-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      cursor: pointer;
      user-select: none;
      transition: background 0.2s;
    }

    .word-list-toggle:hover {
      background: rgba(255,255,255,0.03);
    }

    .word-list-title {
      font-size: 0.8rem;
      color: var(--accent-cyan);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .word-list-title::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 14px;
      background: linear-gradient(180deg, var(--accent-cyan), var(--accent-purple));
      border-radius: 2px;
    }

    .toggle-arrow {
      font-size: 0.9rem;
      color: var(--text-secondary);
      transition: transform 0.3s ease;
    }

    .toggle-arrow.open {
      transform: rotate(180deg);
    }

    .word-list-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s ease, padding 0.4s ease;
      padding: 0 18px;
    }

    .word-list-body.open {
      max-height: 300px;
      padding: 0 18px 14px;
      overflow-y: auto;
    }

    .word-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }

    .word-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 8px;
      border-radius: 8px;
      background: rgba(255,255,255, 0.03);
      border: 1px solid transparent;
      transition: all 0.3s ease;
      font-size: 0.78rem;
      cursor: default;
    }

    .word-item.completed {
      opacity: 0.35;
      text-decoration: line-through;
    }

    .word-item.active {
      border-color: var(--accent-cyan);
      background: rgba(0, 212, 255, 0.08);
      box-shadow: 0 0 12px rgba(0, 212, 255, 0.15);
    }

    .word-item .en {
      font-weight: 700;
      color: var(--text-primary);
      text-transform: uppercase;
    }

    .word-item .zh {
      color: var(--text-secondary);
      font-size: 0.72rem;
    }

    /* ===== GAME AREA ===== */
    .game-section {
      display: flex;
      gap: 16px;
      align-items: flex-start;
    }

    .game-board-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Current Word Display */
    .current-word-display {
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 20px;
      background: var(--bg-card);
      border: 1px solid var(--grid-border);
      border-radius: 12px;
      backdrop-filter: blur(12px);
      min-height: 52px;
    }

    .current-word-display .label {
      font-size: 0.72rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .current-word-display .word-letters {
      display: flex;
      gap: 4px;
    }

    .current-word-display .letter-box {
      width: 30px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      font-weight: 900;
      font-size: 1rem;
      text-transform: uppercase;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--grid-border);
      color: var(--text-secondary);
      transition: all 0.3s ease;
    }

    .current-word-display .letter-box.typed {
      background: rgba(52, 211, 153, 0.2);
      border-color: var(--accent-green);
      color: var(--accent-green);
      box-shadow: 0 0 8px rgba(52, 211, 153, 0.3);
    }

    .current-word-display .letter-box.current {
      background: rgba(0, 212, 255, 0.15);
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
      animation: pulse-border 1s ease-in-out infinite;
      box-shadow: 0 0 12px rgba(0, 212, 255, 0.3);
    }

    @keyframes pulse-border {
      0%, 100% { border-color: var(--accent-cyan); }
      50% { border-color: var(--accent-purple); }
    }

    .current-word-display .meaning {
      font-size: 1.3rem;
      color: var(--accent-pink);
      font-weight: 700;
    }

    /* Round indicator */
    .round-badge {
      font-size: 0.7rem;
      color: var(--accent-yellow);
      background: rgba(251, 191, 36, 0.12);
      border: 1px solid rgba(251, 191, 36, 0.25);
      padding: 2px 10px;
      border-radius: 20px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    /* Game Grid — 10 x 5 */
    .game-grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      grid-template-rows: repeat(5, 1fr);
      gap: 3px;
      padding: 10px;
      background: var(--grid-bg);
      border: 1px solid var(--grid-border);
      border-radius: 14px;
      width: 100%;
      aspect-ratio: 10 / 5.2;
      backdrop-filter: blur(12px);
      box-shadow:
        0 0 40px rgba(0, 212, 255, 0.05),
        inset 0 0 40px rgba(0, 0, 0, 0.3);
      position: relative;
      overflow: hidden;
    }

    .game-grid::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(0,212,255,0.03) 0%, transparent 20%),
        linear-gradient(0deg, rgba(248,113,113,0.05) 0%, transparent 15%);
      pointer-events: none;
      border-radius: 14px;
    }

    .grid-cell {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(100, 100, 180, 0.08);
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 1.3rem;
      text-transform: uppercase;
      transition: background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
      position: relative;
    }

    .grid-cell.has-letter {
      background: linear-gradient(135deg, rgba(0, 212, 255, 0.25), rgba(168, 85, 247, 0.25));
      border-color: rgba(0, 212, 255, 0.4);
      color: #fff;
      box-shadow: 0 0 12px rgba(0, 212, 255, 0.2), inset 0 0 8px rgba(0, 212, 255, 0.1);
      text-shadow: 0 0 8px rgba(0, 212, 255, 0.5);
      animation: block-glow 1.5s ease-in-out infinite alternate;
    }

    @keyframes block-glow {
      0% { box-shadow: 0 0 12px rgba(0, 212, 255, 0.2), inset 0 0 8px rgba(0, 212, 255, 0.1); }
      100% { box-shadow: 0 0 20px rgba(168, 85, 247, 0.3), inset 0 0 12px rgba(168, 85, 247, 0.15); }
    }

    .grid-cell.danger {
      background: linear-gradient(135deg, rgba(248, 113, 113, 0.3), rgba(251, 146, 60, 0.3));
      border-color: rgba(248, 113, 113, 0.5);
      box-shadow: 0 0 16px rgba(248, 113, 113, 0.3);
      animation: danger-pulse 0.4s ease-in-out infinite alternate;
    }

    @keyframes danger-pulse {
      0% { box-shadow: 0 0 16px rgba(248, 113, 113, 0.3); }
      100% { box-shadow: 0 0 24px rgba(248, 113, 113, 0.5); }
    }

    .grid-cell.stacked {
      background: linear-gradient(135deg, rgba(120, 80, 160, 0.35), rgba(80, 60, 130, 0.35));
      border-color: rgba(168, 85, 247, 0.3);
      color: rgba(255,255,255,0.5);
      box-shadow: inset 0 0 6px rgba(168, 85, 247, 0.15);
      animation: none;
      text-shadow: none;
    }

    .grid-cell.correct-flash {
      background: linear-gradient(135deg, rgba(52, 211, 153, 0.4), rgba(52, 211, 153, 0.2));
      border-color: var(--accent-green);
      animation: correct-burst 0.4s ease-out;
    }

    @keyframes correct-burst {
      0% { transform: scale(1.15); box-shadow: 0 0 30px rgba(52, 211, 153, 0.6); }
      100% { transform: scale(1); box-shadow: 0 0 0 transparent; }
    }

    .grid-cell.top-row {
      border-top: 2px solid rgba(248, 113, 113, 0.15);
    }

    /* Pause overlay on grid */
    .pause-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 15, 30, 0.8);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
      border-radius: 14px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .pause-overlay.visible {
      opacity: 1;
      pointer-events: all;
    }

    .pause-overlay .pause-text {
      font-size: 1.6rem;
      font-weight: 900;
      color: var(--accent-yellow);
      text-transform: uppercase;
      letter-spacing: 6px;
      text-shadow: 0 0 20px rgba(251, 191, 36, 0.4);
    }

    /* Stats Panel */
    .stats-panel {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 155px;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .btn-game {
      padding: 11px 14px;
      font-size: 0.8rem;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-game:hover { transform: translateY(-2px); }
    .btn-game:active { transform: translateY(0); }

    .btn-start {
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
      color: #fff;
      box-shadow: 0 4px 20px rgba(0, 212, 255, 0.3);
    }
    .btn-start:hover { box-shadow: 0 6px 28px rgba(0, 212, 255, 0.4); }

    .btn-pause {
      background: linear-gradient(135deg, var(--accent-yellow), var(--accent-orange));
      color: #1a1a2e;
      box-shadow: 0 4px 16px rgba(251, 191, 36, 0.2);
      opacity: 0.5;
      pointer-events: none;
    }
    .btn-pause.enabled { opacity: 1; pointer-events: all; }
    .btn-pause:hover { box-shadow: 0 6px 24px rgba(251, 191, 36, 0.35); }

    .btn-restart {
      background: linear-gradient(135deg, rgba(248, 113, 113, 0.8), rgba(244, 114, 182, 0.8));
      color: #fff;
      box-shadow: 0 4px 16px rgba(248, 113, 113, 0.2);
      opacity: 0.5;
      pointer-events: none;
    }
    .btn-restart.enabled { opacity: 1; pointer-events: all; }
    .btn-restart:hover { box-shadow: 0 6px 24px rgba(248, 113, 113, 0.35); }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--grid-border);
      border-radius: 12px;
      padding: 10px 14px;
      backdrop-filter: blur(12px);
      text-align: center;
    }

    .stat-card .stat-label {
      font-size: 0.63rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 3px;
    }

    .stat-card .stat-value {
      font-size: 1.4rem;
      font-weight: 900;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .stat-card .stat-value.score { background: linear-gradient(135deg, var(--accent-green), var(--accent-cyan)); -webkit-background-clip: text; background-clip: text; }
    .stat-card .stat-value.combo { background: linear-gradient(135deg, var(--accent-orange), var(--accent-pink)); -webkit-background-clip: text; background-clip: text; }
    .stat-card .stat-value.accuracy { background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink)); -webkit-background-clip: text; background-clip: text; }
    .stat-card .stat-value.time { background: linear-gradient(135deg, var(--accent-yellow), var(--accent-orange)); -webkit-background-clip: text; background-clip: text; }

    .timer-card {
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .timer-card.warning {
      border-color: rgba(248, 113, 113, 0.65);
      box-shadow: 0 0 18px rgba(248, 113, 113, 0.16);
    }

    .timer-card.warning .stat-value.time {
      background: linear-gradient(135deg, var(--accent-red), var(--accent-orange));
      -webkit-background-clip: text;
      background-clip: text;
    }

    .speed-control {
      background: var(--bg-card);
      border: 1px solid var(--grid-border);
      border-radius: 12px;
      padding: 10px 14px;
      backdrop-filter: blur(12px);
    }

    .speed-control .stat-label {
      font-size: 0.63rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 4px;
      text-align: center;
    }

    .speed-control input[type="range"] {
      width: 100%;
      accent-color: var(--accent-cyan);
    }

    .speed-control .speed-val {
      text-align: center;
      font-size: 0.8rem;
      color: var(--accent-cyan);
      font-weight: 700;
      margin-top: 2px;
    }

    /* ===== KEYBOARD ===== */
    .keyboard-section {
      background: var(--bg-card);
      border: 1px solid var(--grid-border);
      border-radius: 16px;
      padding: 16px 20px 12px;
      backdrop-filter: blur(12px);
    }

    .keyboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .keyboard-title {
      font-size: 0.75rem;
      color: var(--accent-purple);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .keyboard-title::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 14px;
      background: linear-gradient(180deg, var(--accent-purple), var(--accent-pink));
      border-radius: 2px;
    }

    .finger-legend {
      display: none;
      gap: 12px;
      font-size: 0.68rem;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .finger-legend.open { display: flex; }

    .finger-legend-item {
      display: flex;
      align-items: center;
      gap: 4px;
      color: var(--text-secondary);
    }

    .finger-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .finger-dot.pinky { background: var(--finger-pinky); }
    .finger-dot.ring { background: var(--finger-ring); }
    .finger-dot.middle { background: var(--finger-middle); }
    .finger-dot.l-index { background: var(--finger-l-index); }
    .finger-dot.r-index { background: var(--finger-r-index); }
    .finger-dot.thumb { background: var(--finger-thumb); }

    .keyboard-rows {
      display: flex;
      flex-direction: column;
      gap: 4px;
      align-items: center;
    }

    .keyboard-row {
      display: flex;
      gap: 4px;
    }

    .key {
      min-width: 42px;
      height: 42px;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.85rem;
      text-transform: uppercase;
      border: 1px solid rgba(255,255,255,0.08);
      transition: all 0.15s ease;
      cursor: default;
      position: relative;
    }

    .key.finger-pinky { background: var(--finger-pinky-bg); border-color: rgba(244, 114, 182, 0.2); color: var(--finger-pinky); }
    .key.finger-ring { background: var(--finger-ring-bg); border-color: rgba(134, 239, 172, 0.2); color: var(--finger-ring); }
    .key.finger-middle { background: var(--finger-middle-bg); border-color: rgba(253, 211, 77, 0.2); color: var(--finger-middle); }
    .key.finger-l-index { background: var(--finger-l-index-bg); border-color: rgba(216, 180, 254, 0.2); color: var(--finger-l-index); }
    .key.finger-r-index { background: var(--finger-r-index-bg); border-color: rgba(147, 197, 253, 0.2); color: var(--finger-r-index); }
    .key.finger-thumb { background: var(--finger-thumb-bg); border-color: rgba(209, 213, 219, 0.2); color: var(--finger-thumb); }

    .key.space-key {
      min-width: 260px;
      font-size: 0.7rem;
      letter-spacing: 2px;
      color: var(--text-secondary);
      background: var(--finger-thumb-bg);
      border-color: rgba(209, 213, 219, 0.2);
    }

    .key.highlight {
      transform: scale(1.12);
      z-index: 2;
      box-shadow: 0 0 20px currentColor;
      border-width: 2px;
    }

    .key.finger-pinky.highlight { background: rgba(244, 114, 182, 0.35); box-shadow: 0 0 20px var(--finger-pinky); }
    .key.finger-ring.highlight { background: rgba(134, 239, 172, 0.35); box-shadow: 0 0 20px var(--finger-ring); }
    .key.finger-middle.highlight { background: rgba(253, 211, 77, 0.35); box-shadow: 0 0 20px var(--finger-middle); }
    .key.finger-l-index.highlight { background: rgba(216, 180, 254, 0.35); box-shadow: 0 0 20px var(--finger-l-index); }
    .key.finger-r-index.highlight { background: rgba(147, 197, 253, 0.35); box-shadow: 0 0 20px var(--finger-r-index); }

    .key.pressed {
      transform: scale(0.92);
      filter: brightness(1.5);
    }

    .hand-labels {
      display: flex;
      justify-content: space-between;
      margin-top: 6px;
      padding: 0 30px;
      width: 100%;
    }

    .hand-label {
      font-size: 0.72rem;
      color: var(--text-secondary);
      font-weight: 600;
      letter-spacing: 1px;
    }

    /* ===== GAME OVER OVERLAY ===== */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 15, 26, 0.92);
      backdrop-filter: blur(16px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .overlay.visible {
      opacity: 1;
      pointer-events: all;
    }

    .overlay-content {
      text-align: center;
      padding: 40px;
      background: var(--bg-card);
      border: 1px solid var(--grid-border);
      border-radius: 24px;
      max-width: 420px;
    }

    .overlay-content h2 {
      font-size: 2rem;
      font-weight: 900;
      margin-bottom: 16px;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .overlay-content .final-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }

    .overlay-content .final-stat {
      padding: 12px;
      background: rgba(255,255,255,0.03);
      border-radius: 10px;
    }

    .overlay-content .final-stat .fs-label {
      font-size: 0.7rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .overlay-content .final-stat .fs-value {

  <script>
    // ===== WORD LIST =====
    let WORDS = [];
    let ALL_WORDS = [], KID_WORDS = [];
    let wordMode = localStorage.getItem("typingWordMode") || "all";

    // ===== 與主站整合：字庫切換 + 每日金幣 =====
    function _td() { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
    function _curStu() { return localStorage.getItem("kidsCurrentStudent") || ""; }
    function _getProg(s) { try { return JSON.parse(localStorage.getItem("kidsProgress." + s) || "null"); } catch (e) { return null; } }

    // ===== 本週單字（與課程聯動）：前 30 個方塊出本週單字，之後才其他字 =====
    let _weekWordsCache = null, _weekSetCache = null;
    function getWeekWords() {
      if (_weekWordsCache) return _weekWordsCache;
      try {
        const d = new Date(), td = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
        _weekWordsCache = (typeof vocabWeekForDate === "function") ? (vocabWeekForDate(td).week.words || []) : [];
      } catch (e) { _weekWordsCache = []; }
      return _weekWordsCache;
    }
    function getWeekSet() {
      if (!_weekSetCache) _weekSetCache = new Set(getWeekWords().map(w => String(w.en).toLowerCase()));
      return _weekSetCache;
    }
    // 把本週單字補進字庫（缺的才補），確保都能打到
    function mergeWeekWords(base) {
      const have = new Set(base.map(w => String(w.en).toLowerCase()));
      const extra = getWeekWords().filter(w => /^[a-z]+$/.test(String(w.en).toLowerCase()) && !have.has(String(w.en).toLowerCase()))
        .map(w => ({ en: String(w.en).toLowerCase(), zh: w.zh }));
      return extra.length ? base.concat(extra) : base;
    }
    // 單字發音：Web Audio 預解碼成 buffer 播放（不卡主執行緒）；沒 mp3 的字用瀏覽器語音。
    let _actx = null;
    const _bufCache = {};   // key -> AudioBuffer | 'loading' | 'fail'
    let _mp3Keys = null;    // 「有 mp3」的 key 集合（避免對沒檔的字 fetch 出 404）
    function _audioKey(en) { return (typeof wordAudioKey === "function") ? wordAudioKey(en) : String(en).toLowerCase().replace(/[^a-z0-9]+/g, ""); }
    function _initMp3Keys() {
      if (_mp3Keys) return;
      _mp3Keys = new Set();   // 先用字庫當底（manifest 載到後再補上 csv 等其餘字）
      try { if (typeof WORDBANK !== "undefined") WORDBANK.forEach(w => _mp3Keys.add(_audioKey(w.en))); } catch (e) {}
    }
    function _hasMp3(key) { _initMp3Keys(); return _mp3Keys.has(key); }
    // 載入音檔清單（所有已產生的 <key>.mp3），讓 csv 等非字庫字也算「有 mp3」
    function loadAudioManifest() {
      fetch("../kids/audio/words/manifest.json").then(r => r.ok ? r.json() : Promise.reject())
        .then(arr => { _initMp3Keys(); arr.forEach(k => _mp3Keys.add(k)); })
        .catch(() => {});
    }
    function _ensureCtx() {
      if (!_actx) { try { _actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { _actx = null; } }
      if (_actx && _actx.state === "suspended") { _actx.resume().catch(() => {}); }
      return _actx;
    }
    function _loadBuf(key) {
      if (_bufCache[key] !== undefined) return;       // 載入中／已載／失敗都不重載
      if (!_hasMp3(key)) { _bufCache[key] = 'fail'; return; }   // 沒檔 → 標記失敗（之後用 TTS）
      const ctx = _ensureCtx(); if (!ctx) return;     // 還沒有 AudioContext（手勢前）→ 先不標記，之後再試
      _bufCache[key] = 'loading';
      fetch("../kids/audio/words/" + key + ".mp3")
        .then(r => r.ok ? r.arrayBuffer() : Promise.reject())
        .then(ab => ctx.decodeAudioData(ab, b => { _bufCache[key] = b; }, () => { _bufCache[key] = 'fail'; }))
        .catch(() => { _bufCache[key] = 'fail'; });
    }
    function preloadWeekAudio() { try { getWeekWords().forEach(w => _loadBuf(_audioKey(w.en))); } catch (e) {} }

    // 預熱「接下來要落下的」單字：近 6 個立即載，其餘閒置時載（只載有 mp3 的，已快取的會跳過）
    function prewarmUpcoming() {
      try {
        const keys = [];
        for (let n = 1; n <= 24; n++) {
          let w = null;
          const idx = currentWordPoolIndex + n;
          if (idx < wordOrder.length) w = WORDS[wordOrder[idx]];
          else if (nextRoundWordOrder.length) w = WORDS[nextRoundWordOrder[(idx - wordOrder.length) % nextRoundWordOrder.length]];
          if (w) keys.push(_audioKey(w.en));
        }
        keys.slice(0, 6).forEach(_loadBuf);
        const rest = keys.slice(6);
        const idle = window.requestIdleCallback || (cb => setTimeout(() => cb(), 200));
        idle(() => rest.forEach(_loadBuf), { timeout: 1000 });
      } catch (e) {}
    }

    function _playBuf(buf) { const ctx = _ensureCtx(); if (!ctx) return; const s = ctx.createBufferSource(); s.buffer = buf; s.connect(ctx.destination); s.start(0); }
    function _speak(en) { if (!window.speechSynthesis) return; try { speechSynthesis.cancel(); } catch (e) {} const u = new SpeechSynthesisUtterance(en); u.lang = "en-US"; u.rate = .9; speechSynthesis.speak(u); }
    let _playSeq = 0;
    function playWordSound(en) {
      const seq = ++_playSeq, k = _audioKey(en);
      _ensureCtx();
      const buf = _bufCache[k];
      if (buf && buf !== 'loading' && buf !== 'fail') { _playBuf(buf); return; }   // 已解碼 → 自然發音
      if (buf === 'fail' || !_hasMp3(k)) { _speak(en); return; }                   // 沒檔 → 瀏覽器語音
      _loadBuf(k);                                                                 // loading/還沒載 → 載入並等一下
      setTimeout(() => {
        if (seq !== _playSeq) return;                                              // 已換下個字，別補播
        const b = _bufCache[k];
        if (b && b !== 'loading' && b !== 'fail') _playBuf(b);
        else _speak(en);                                                           // 還沒好 → 用瀏覽器語音
      }, 220);
    }

    function toggleLegend() {
      const l = document.getElementById('fingerLegend');
      const a = document.getElementById('legendArrow');
      if (!l) return;
      const open = l.classList.toggle('open');
      if (a) a.textContent = open ? '▼ 收起' : '▶ 看手指顏色';
    }

    function buildKidWords() {
      const basic = new Set();
      if (typeof WORDBANK !== "undefined") WORDBANK.forEach(w => {

      if (!who) return;
      if (!s) { who.textContent = "未登入"; st.innerHTML = '到 <a href="../kids/index.html" style="color:#2f80ed">主站</a>登入後，玩這個可賺金幣（20 分 = 1 🪙，每天取前三次最高分）'; return; }
      who.textContent = "目前：" + s.charAt(0).toUpperCase() + s.slice(1);
      const daily = JSON.parse(localStorage.getItem("typingDaily") || "{}");
      const rec = (daily[s] || {})[_td()] || { attempts: [], awarded: 0 };
      const best = rec.attempts.length ? Math.max.apply(null, rec.attempts) : 0;
      const bal = ((_getProg(s) || {}).coins || {}).balance || 0;
      st.textContent = `今天第 ${Math.min(rec.attempts.length,3)}/3 次 · 最佳 ${best} 分 · 今天換得 ${rec.awarded} 🪙 · 餘額 ${bal} 🪙`;

    // 結算：每天取前三次最高分，floor(最高分/20) 個金幣（已換的不重複給）
    function awardTypingCoins(finalScore) {
      const s = _curStu();
      if (!s) return { delta: 0, best: 0, coinsForBest: 0, attempt: 0, noStudent: true };
      const today = _td();
      const daily = JSON.parse(localStorage.getItem("typingDaily") || "{}");
      daily[s] = daily[s] || {};
      const rec = daily[s][today] || { attempts: [], awarded: 0 };
      if (rec.attempts.length < 3) rec.attempts.push(finalScore);   // 只算前三次
      const best = Math.max.apply(null, rec.attempts);
      const coinsForBest = Math.floor(best / 20);
      const delta = coinsForBest - rec.awarded;
      if (delta > 0) {
        const p = _getProg(s) || { wrongCounts: {}, sessions: 0, totalCorrect: 0, totalWrong: 0 };
        if (!p.coins) p.coins = { balance: 0, lifetimeEarned: 0, lifetimeSpent: 0, transactions: [], claimedDrills: {} };
        p.coins.balance += delta; p.coins.lifetimeEarned += delta;
        p.coins.transactions.push({ type: "earn", source: "typingGame", amount: delta, balanceAfter: p.coins.balance, createdAt: new Date().toISOString(), meta: { date: today, best: best, score: finalScore } });
        localStorage.setItem("kidsProgress." + s, JSON.stringify(p));
        rec.awarded = coinsForBest;
      }
      daily[s][today] = rec;
      localStorage.setItem("typingDaily", JSON.stringify(daily));
      return { delta: delta, best: best, coinsForBest: coinsForBest, attempt: Math.min(rec.attempts.length, 3) };
    }

    function parseCsvLine(line) {
      const cells = [];
      let current = '';
      let inQuotes = false;

      for (let i = 0; i < line.length; i++) {
        const char = line[i];
        if (char === '"') {
          if (inQuotes && line[i + 1] === '"') {
            current += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (char === ',' && !inQuotes) {
          cells.push(current);
          current = '';
        } else {
          current += char;
        }
      }

      cells.push(current);
      return cells;
    }

          const text = (await res.text()).replace(/^\uFEFF/, '');
          const parsedWords = text.trim().split(/\r?\n/)
            .map(parseCsvLine)
            .filter(row => !(row[0]?.trim().toLowerCase() === 'en' && row[1]?.trim().toLowerCase() === 'zh'))
            .map(([en, zh]) => ({ en: en ? en.trim().toLowerCase() : '', zh: zh ? zh.trim() : '' }))
            .filter(word => /^[a-z]{2,}$/.test(word.en) && word.zh);

          if (parsedWords.length > 0) {
            WORDS = parsedWords;
            loadedFromCsv = true;
          }
        }
      } catch (e) {
        console.warn('Failed to load words.csv, falling back to default wordlist:', e);

    // ===== COUNTDOWN TIMER =====
    function formatTime(totalSeconds) {
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      return String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0');
    }

    function updateCountdownDisplay() {
      document.getElementById('statTime').textContent = formatTime(remainingTime);
      document.getElementById('timerCard').classList.toggle('warning', remainingTime <= 30);
    }

    function stopCountdownTimer() {
      if (countdownTimer) {
        clearInterval(countdownTimer);
        countdownTimer = null;
      }
      countdownDeadline = null;
    }

    function resetCountdown() {
      stopCountdownTimer();
      remainingTime = GAME_DURATION_SECONDS;
      updateCountdownDisplay();
    }

    function startCountdown() {
      stopCountdownTimer();
      countdownDeadline = Date.now() + remainingTime * 1000;
      updateCountdownDisplay();
      countdownTimer = setInterval(tickCountdown, 250);
    }

    function pauseCountdown() {
      if (countdownDeadline !== null) {
        remainingTime = Math.max(0, Math.ceil((countdownDeadline - Date.now()) / 1000));
      }
      stopCountdownTimer();
      updateCountdownDisplay();
    }

    function tickCountdown() {
      if (!gameRunning || gamePaused || countdownDeadline === null) return;

      const nextRemaining = Math.max(0, Math.ceil((countdownDeadline - Date.now()) / 1000));
      if (nextRemaining !== remainingTime) {
        remainingTime = nextRemaining;
        updateCountdownDisplay();
      }

      if (remainingTime <= 0) {
        stopCountdownTimer();
        gameOver('time');
      }
    }

        for (let r = ROWS - 1; r >= 0; r--) {
          if (stackGrid[r][c] !== null) colHeight++;
          else break;
        }
        if (colHeight > maxHeight) maxHeight = colHeight;
      }

    // ===== SHUFFLE =====
    function _shuffleInPlace(a) {
      for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
      return a;
    }
    function createShuffledWordOrder() {
      // 本週單字的 index 先（隨機），其餘字在後（隨機）→ 前 30 個就是本週單字
      const weekSet = getWeekSet();
      const weekIdx = [], restIdx = [];
      for (let i = 0; i < WORDS.length; i++) (weekSet.has(String(WORDS[i].en).toLowerCase()) ? weekIdx : restIdx).push(i);
      return _shuffleInPlace(weekIdx).concat(_shuffleInPlace(restIdx));
    }

    function shuffleWordOrder() {
      wordOrder = createShuffledWordOrder();
    }

    // ===== FAST INPUT FLOW =====
    function stopAdvanceTimer() {
      if (advanceTimer) {
        clearTimeout(advanceTimer);
        advanceTimer = null;
      }
    }

    function resetInputFlow() {
      stopAdvanceTimer();
      pendingAdvance = null;
      inputBuffer = [];
    }

    function scheduleAdvance(action, delay) {
      stopAdvanceTimer();
      pendingAdvance = action;
      advanceTimer = setTimeout(() => {
        advanceTimer = null;
        runPendingAdvance();
      }, delay);
    }

    function runPendingAdvance() {
      if (!gameRunning) {
        resetInputFlow();
        return;
      }
      if (gamePaused) return;

      const action = pendingAdvance;
      pendingAdvance = null;
      if (action === 'word') nextWord();
      else if (action === 'letter') dropNextLetter();
    }

    function resumePendingAdvance() {
      if (pendingAdvance && !advanceTimer) {
        scheduleAdvance(pendingAdvance, 0);
      }
    }

    function flushBufferedInput() {
      if (!gameRunning || gamePaused || !fallingLetter || inputBuffer.length === 0) return;
      const bufferedKey = inputBuffer.shift();
      processTypedKey(bufferedKey);
    }

    function startGame(mode) {
      if (gameRunning || counting) return;
      _ensureCtx();   // 在使用者手勢內喚醒音訊 + 觸發本週字預載
      preloadWeekAudio();
      mode = mode || 'practice';

        const s = _curStu(); let n = 0;

      // UI

    // ===== PAUSE / RESUME =====
    function togglePause() {
      if (!gameRunning) return;

      if (gamePaused) {
        // Resume
        gamePaused = false;
        startCountdown();
        document.getElementById('pauseOverlay').classList.remove('visible');
        document.getElementById('btnPause').innerHTML = '⏸ PAUSE';
        // Resume falling or finish the pending fast transition
        if (fallingLetter) {
          scheduleFallTick();
        } else {
          resumePendingAdvance();
        }
      } else {
        // Pause
        gamePaused = true;
        stopFalling();
        pauseCountdown();
        stopAdvanceTimer();
        document.getElementById('pauseOverlay').classList.add('visible');
        document.getElementById('btnPause').innerHTML = '▶ RESUME';
      }
    }

    // ===== CLEAR GRID VISUAL =====
    function clearGridVisual() {
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          gridCells[r][c].className = 'grid-cell' + (r === 0 ? ' top-row' : '');
          gridCells[r][c].textContent = '';
        }
      }
    }

    // ===== RENDER GRID =====
    function renderGrid() {
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const cell = gridCells[r][c];
          // Reset classes
          cell.className = 'grid-cell' + (r === 0 ? ' top-row' : '');
          cell.textContent = '';

          // Draw stacked blocks
          if (stackGrid[r][c] !== null) {
            cell.classList.add('stacked');
            cell.textContent = stackGrid[r][c].toUpperCase();
          }
        }
      }

      // Draw falling letter on top
      if (fallingLetter) {
        const { row, col, letter } = fallingLetter;
        const cell = gridCells[row][col];
        cell.textContent = letter.toUpperCase();
        cell.classList.remove('stacked');
        cell.classList.add('has-letter');
        // Danger when close to stack or bottom
        const landRow = getLandingRow(col);
        if (row >= landRow - 1) {
          cell.classList.add('danger');
        }
      }
    }

    // ===== GET LANDING ROW =====
    // Returns the row where a block would land in column c
    function getLandingRow(col) {
      for (let r = 0; r < ROWS; r++) {
        if (stackGrid[r][col] !== null) return r - 1;
      }
      return ROWS - 1;
    }

    // ===== NEXT WORD =====
    function nextWord() {
      currentWordPoolIndex++;
      if (currentWordPoolIndex >= WORDS.length) {
        // All 20 words done — start new round
        currentRound++;
        wordsCompletedThisRound = 0;
        currentWordPoolIndex = 0;
        wordOrder = nextRoundWordOrder.length > 0 ? nextRoundWordOrder : createShuffledWordOrder();
        nextRoundWordOrder = createShuffledWordOrder();
        resetWordListHighlights();
      }
      currentLetterIndex = 0;

      // Highlight in word list
      const realIdx = wordOrder[currentWordPoolIndex];
      resetWordListHighlights();
      // Mark earlier words in this round as completed
      for (let i = 0; i < currentWordPoolIndex; i++) {
        const el = document.getElementById(`word-item-${wordOrder[i]}`);
        el.classList.add('completed');
      }
      document.getElementById(`word-item-${realIdx}`).classList.add('active');

      updateCurrentWordDisplay();
      dropNextLetter();                   // 先讓字母落下、輸入就緒
      const _w = WORDS[realIdx];          // 再延後一拍念發音 + 預熱接下來的字，不卡輸入
      setTimeout(() => { if (_w) playWordSound(_w.en); prewarmUpcoming(); }, 0);
    }

    // ===== DROP NEXT LETTER =====
    function dropNextLetter() {
      if (!gameRunning || gamePaused) return;
      const word = WORDS[wordOrder[currentWordPoolIndex]];
      if (currentLetterIndex >= word.en.length) {
        // Word completed
        wordsCompletedTotal++;
        wordsCompletedThisRound++;
        score += 50;
        updateStats();

        const realIdx = wordOrder[currentWordPoolIndex];
        const el = document.getElementById(`word-item-${realIdx}`);
        el.classList.remove('active');
        el.classList.add('completed');

        scheduleAdvance('word', WORD_ADVANCE_DELAY);
        return;
      }

      const letter = word.en[currentLetterIndex];
      // Pick a random column, prefer columns with lower stacks
      const col = pickColumn();

      // Check if landing row is valid (>= 0)
      const landRow = getLandingRow(col);
      if (landRow < 0) {
        // This column is full — game over
        gameOver();
        return;
      }

      fallingLetter = { letter, col, row: 0 };

      // If row 0 is already stacked, game over
      if (stackGrid[0][col] !== null) {
        gameOver();
        return;
      }

      highlightKey(letter);
      renderGrid();
      scheduleFallTick();
      queueMicrotask(flushBufferedInput);
    }

    function pickColumn() {
      // Weight towards columns with less stack
      const heights = [];
      for (let c = 0; c < COLS; c++) {
        let h = 0;
        for (let r = ROWS - 1; r >= 0; r--) {
          if (stackGrid[r][c] !== null) h++;
          else break;
        }
        heights.push(h);
      }
      const minH = Math.min(...heights);
      // Collect columns with height <= minH + 1
      const candidates = [];
      for (let c = 0; c < COLS; c++) {
        if (heights[c] <= minH + 1) candidates.push(c);
      }
      return candidates[Math.floor(Math.random() * candidates.length)];
    }

    // ===== FALL TIMER =====
    function scheduleFallTick() {
      stopFalling();
      fallTimer = setTimeout(() => fallTick(), fallSpeed);
    }

    function stopFalling() {
      if (fallTimer) {
        clearTimeout(fallTimer);
        fallTimer = null;
      }
    }

    // ===== FALL TICK =====
    function fallTick() {
      if (!fallingLetter || !gameRunning || gamePaused) return;

      const landRow = getLandingRow(fallingLetter.col);

      if (fallingLetter.row >= landRow) {
        // Landed — stack it
        stackBlock();
        return;
      }

      fallingLetter.row++;

      // Check again after moving
      if (fallingLetter.row >= landRow) {
        // Will land next tick or now at land position
        if (fallingLetter.row === landRow) {
          renderGrid();
          // Give one more tick before stacking
          scheduleFallTick();
          return;
        }
        stackBlock();
        return;
      }

      renderGrid();
      scheduleFallTick();
    }

    // ===== STACK BLOCK =====
    function stackBlock() {
      if (!fallingLetter) return;
      stopFalling();

      const { col, letter } = fallingLetter;
      const landRow = getLandingRow(col);

      if (landRow < 0) {
        // Column full — game over
        gameOver();
        return;
      }

      // Place in stack
      stackGrid[landRow][col] = letter;
      fallingLetter = null;
      combo = 0;

      renderGrid();
      updateStats();
      updateStackWarning();

      // Check if any column is full (stacked to row 0)
      if (isTopReached()) {
        gameOver();
        return;
      }

      // Move to next letter
      currentLetterIndex++;
      updateCurrentWordDisplay();
      scheduleAdvance('letter', MISSED_LETTER_DELAY);
    }

    function isTopReached() {
      // Game over if row 0 has any stacked block
      for (let c = 0; c < COLS; c++) {
        if (stackGrid[0][c] !== null) return true;
      }
      return false;
    }

    // ===== KEY INPUT =====
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (gameRunning) togglePause();
        return;
      }

      if (!gameRunning || gamePaused || e.key.length !== 1) return;

      const pressed = e.key.toLowerCase();
      pressKeyVisual(pressed);

      if (!fallingLetter) {
        if (pendingAdvance && inputBuffer.length < MAX_INPUT_BUFFER) {
          inputBuffer.push(pressed);
        }
        return;
      }

      processTypedKey(pressed);
    });

    function processTypedKey(pressed) {
      if (!fallingLetter || !gameRunning || gamePaused) return;

      const expected = fallingLetter.letter.toLowerCase();
      totalKeys++;

      if (pressed === expected) {
        // Correct!
        correctKeys++;
        combo++;
        if (combo > maxCombo) maxCombo = combo;
        score += 10 + Math.min(combo * 2, 20);

        const { row, col } = fallingLetter;
        stopFalling();
        fallingLetter = null;

        // Flash effect
        gridCells[row][col].classList.remove('has-letter', 'danger');
        gridCells[row][col].classList.add('correct-flash');
        gridCells[row][col].textContent = '✓';
        setTimeout(() => {
          gridCells[row][col].classList.remove('correct-flash');
          renderGrid();
        }, 180);

        currentLetterIndex++;
        updateCurrentWordDisplay();
        updateStats();
        scheduleAdvance('letter', LETTER_ADVANCE_DELAY);
      } else {
        // Wrong key
        combo = 0;
        updateStats();

        const { row, col } = fallingLetter;
        gridCells[row][col].classList.add('danger');
        setTimeout(() => {
          if (fallingLetter && gridCells[row]) {
            gridCells[row][col].classList.remove('danger');
            renderGrid();
          }
        }, 120);

        if (inputBuffer.length > 0) {
          queueMicrotask(flushBufferedInput);
        }
      }
    }

    // ===== GAME OVER =====
    function gameOver(reason = 'stack') {
      pauseCountdown();
      gameRunning = false;
      stopFalling();
      resetInputFlow();
      highlightKey(null);

      setStartVisible(true);
      document.getElementById('btnPause').classList.remove('enabled');
      document.getElementById('btnPause').innerHTML = '⏸ PAUSE';

      const acc = totalKeys > 0 ? Math.round((correctKeys / totalKeys) * 100) : 0;
      document.getElementById('overlayTitle').textContent = reason === 'time'
        ? '⏱ 時間到 — 成績結算'
        : '💀 遊戲結束 — 方塊堆滿了！';
      document.getElementById('finalScore').textContent = score;
      document.getElementById('finalCombo').textContent = maxCombo;
      document.getElementById('finalAccuracy').textContent = acc + '%';
      document.getElementById('finalWords').textContent = wordsCompletedTotal;

      // 只有「正式測驗」才換金幣（每天前三次取最高分，20 分 = 1 金幣）；練習不計
      const coinEl = document.getElementById('finalCoin');
      if (currentMode === 'test') {
        const tc = awardTypingCoins(score);
        if (coinEl) {
          if (tc.noStudent) coinEl.innerHTML = '未登入，這次沒換金幣。到 <a href="../kids/index.html" style="color:#2f80ed">主站</a>登入後再玩可賺金幣 🪙';
          else coinEl.innerHTML = `🏆 正式測驗 第 ${tc.attempt}/3 次 · 最佳 ${tc.best} 分 → 共 ${tc.coinsForBest} 🪙`
            + (tc.delta > 0 ? ` <span style="color:#2fbf71">（這次 +${tc.delta} 🪙）</span>` : '（沒超過今天最佳，未加幣）');
        }
      } else if (coinEl) {
        coinEl.innerHTML = '📝 練習模式 · 不計金幣（想換金幣請按「正式測驗」）';
      }
      refreshDailyBar();
      updateTestBtn();

      document.getElementById('gameOverOverlay').classList.add('visible');
    }

    // ===== INIT =====
    init();
  </script>
</body>

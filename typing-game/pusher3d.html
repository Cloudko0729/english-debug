<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⌨️🪙 3D 推幣機打字</title>
<style>
  :root{--bg:#151a33;--panel:#242b52;--gold:#ffd24d;--text:#eef1ff;--muted:#9aa3c7;--green:#2fbf71;--blue:#4da3ff;--danger:#ff5d7a;}
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:Arial,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:0 10px 40px;}
  header{width:100%;max-width:560px;text-align:center;padding:12px 0 4px;}
  header h1{font-size:1.15rem;color:var(--gold);}
  header a{color:var(--blue);font-size:.78rem;text-decoration:none;margin:0 6px;}
  #statBar{width:100%;max-width:560px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;font-size:.8rem;margin:6px 0;}
  #statBar .st{background:var(--panel);border-radius:10px;padding:5px 11px;font-weight:700;}
  #statBar .st b{color:var(--gold);}
  #wordArea{position:relative;width:100%;max-width:640px;background:var(--panel);border-radius:12px;padding:6px 112px 6px 12px;text-align:center;margin-bottom:6px;display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;min-height:52px;}
  #wordZh{font-size:1.45rem;color:var(--gold);font-weight:800;cursor:pointer;white-space:nowrap;}
  #wordLetters{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;}
  .lb{width:30px;height:36px;border-radius:7px;background:#181e3c;display:flex;align-items:center;justify-content:center;font-size:1.2rem;font-weight:900;border:2px solid #3a4370;}
  .lb.done{background:#153c2b;border-color:var(--green);color:var(--green);}
  .lb.cur{border-color:var(--gold);color:var(--gold);animation:pulse .9s infinite;}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  .lb.err{border-color:var(--danger);animation:shake .18s;}
  @keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
  #combo{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:96px;text-align:right;font-size:.8rem;color:var(--gold);font-weight:700;line-height:1.3;}
  #machineRow{display:flex;gap:10px;align-items:stretch;justify-content:center;width:100%;max-width:640px;}
  #cv3d{border-radius:14px;border:3px solid #3a4370;touch-action:manipulation;max-width:calc(100% - 120px);}
  #cd{display:none;position:absolute;inset:0;align-items:center;justify-content:center;font-size:5.5rem;font-weight:900;color:var(--gold);text-shadow:0 3px 22px rgba(0,0,0,.9);z-index:5;pointer-events:none;}
  #sideBtns{display:flex;flex-direction:column;gap:8px;justify-content:center;min-width:106px;}
  #sideBtns button{border:none;border-radius:10px;font-weight:800;padding:10px 8px;cursor:pointer;font-size:.85rem;}
  /* 指位鍵盤 */
  #kb{margin-top:8px;display:flex;flex-direction:column;gap:4px;align-items:center;}
  .kb-row{display:flex;gap:4px;}
  .key{width:34px;height:34px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.85rem;text-transform:uppercase;border:1.5px solid transparent;}
  .key.f-pinky{background:rgba(244,114,182,.15);color:#f472b6;}
  .key.f-ring{background:rgba(134,239,172,.15);color:#86efac;}
  .key.f-middle{background:rgba(253,211,77,.15);color:#fcd34d;}
  .key.f-l-index{background:rgba(216,180,254,.15);color:#d8b4fe;}
  .key.f-r-index{background:rgba(147,197,253,.15);color:#93c5fd;}
  .key.hl{border-color:currentColor;transform:scale(1.15);}
  .key.f-pinky.hl{background:rgba(244,114,182,.4);box-shadow:0 0 14px #f472b6;}
  .key.f-ring.hl{background:rgba(134,239,172,.4);box-shadow:0 0 14px #86efac;}
  .key.f-middle.hl{background:rgba(253,211,77,.4);box-shadow:0 0 14px #fcd34d;}
  .key.f-l-index.hl{background:rgba(216,180,254,.4);box-shadow:0 0 14px #d8b4fe;}
  .key.f-r-index.hl{background:rgba(147,197,253,.4);box-shadow:0 0 14px #93c5fd;}
  #tray{width:100%;max-width:420px;text-align:center;font-weight:800;color:var(--gold);margin-top:6px;font-size:1rem;min-height:1.4em;}
  #hint{color:var(--muted);font-size:.73rem;margin-top:6px;text-align:center;max-width:440px;line-height:1.6;}
  #mobileInput{position:absolute;opacity:0;height:1px;width:1px;pointer-events:none;}
  #pickMsg{background:var(--panel);border-radius:14px;padding:26px 18px;margin-top:20px;text-align:center;color:var(--muted);max-width:400px;}
  .stu-btn{padding:7px 18px;border:2px solid var(--gold);border-radius:18px;background:transparent;color:var(--gold);font-weight:700;cursor:pointer;margin:4px;}
</style>
</head>

<header>
  <h1>⌨️🪙 3D 推幣機打字</h1>
  <div><a href="../kids/index.html">← 回首頁</a><a href="../kids/island.html">🏝️ 我的島嶼</a><a href="pusher.html">🕹️ 2D 版</a><a href="index.html">🧱 打字方塊</a></div>

<div id="pickMsg">👆 選一下你是誰，開始推金幣！<br><br>
  <button class="stu-btn" onclick="selectStudent('albert')">Albert</button>
  <button class="stu-btn" onclick="selectStudent('jonathan')">Jonathan</button>
 <button class="stu-btn" onclick="selectStudent('ryder')">Ryder</button>
 <button class="stu-btn" onclick="selectStudent('guest')">🎫 訪客</button>

<div id="game" style="display:none;flex-direction:column;align-items:center;width:100%">
  <div id="statBar">
    <span class="st">🪙 <b id="stCoin">—</b></span>
    <span class="st">🏆 <b id="stTries">正式 0/3</b></span>
    <span class="st">本局 <b id="stSession">0</b></span>
    <span class="st">掉落 <b id="stFall">0</b> 代幣</span>
    <span class="st">⏱ <b id="stTime">3:00</b></span>
  </div>
  <div id="wordArea">
    <div id="wordZh" onclick="sayCurrent()" title="點我再聽一次">—</div>
    <div id="wordLetters"></div>
    <div id="combo"></div>
  </div>
  <div id="machineRow">
    <div id="cvWrap" style="position:relative;display:flex">

    <div id="sideBtns">

      <button id="practiceBtn" onclick="startSession('practice')" style="background:#5f6cb0;color:#fff">🎮 試玩</button>

      <button id="resetBtn" onclick="resetMachine()" style="background:#3a4370;color:#cfd6ff">♻️ 重置</button>
    </div>
  </div>
  <div id="kb"></div>
  <div id="tray"></div>
  <div id="hint">打對掉 🪙（1）｜連擊 5 掉 💠（3）｜連擊 10 掉 🌈（10）｜每天 3 次正式取最佳：<b>1 代幣 = 1 島嶼金幣</b>。點中文可再聽一次；平板點機台叫出鍵盤。</div>
  <input id="mobileInput" autocomplete="off" autocapitalize="none">
  <div id="overEl" onclick="if(event.target===this)closeOver()" style="display:none;position:fixed;inset:0;background:rgba(10,13,30,.82);z-index:50;align-items:center;justify-content:center">
    <div style="position:relative;background:var(--panel);border:3px solid var(--gold);border-radius:18px;padding:26px 24px;text-align:center;max-width:320px">
      <button onclick="closeOver()" title="關閉" style="position:absolute;top:8px;right:10px;border:none;background:transparent;color:var(--muted);font-size:1.3rem;font-weight:800;cursor:pointer;line-height:1">✕</button>
      <div style="font-size:2.2rem">⏱️</div>
      <h2 style="color:var(--gold);margin:6px 0">時間到！</h2>
      <p id="overStats" style="margin:8px 0 16px;line-height:1.8"></p>
      <button onclick="closeOver()" style="padding:11px 26px;border:none;border-radius:11px;background:var(--gold);color:#3a2a00;font-weight:800;font-size:1rem;cursor:pointer">✔ 關閉</button>
      <div style="margin-top:10px"><a href="../kids/island.html" style="color:var(--blue);font-size:.85rem">🏝️ 回我的島嶼</a></div>
    </div>

</div>

{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","cannon-es":"https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"}}

<script type="module">
import * as THREE from "three";
import * as CANNON from "cannon-es";

// ─── 常數 ────────────────────────────────────────────────────────────────────
const TOKENS_PER_COIN = 1, SEED_COINS = 40, MAX_COINS = 120;
// 幣種：value=代幣值、mass=重量（輕的容易被撞上去）、色
const COIN_TYPES = {
  gold:    { value: 1,  mass: 6,   r: 0.55, color: 0xffd24d, emis: 0x332200 },
  silver:  { value: 3,  mass: 3.5, r: 0.65, color: 0x55ccff, emis: 0x2266aa },
  rainbow: { value: 10, mass: 2,   r: 0.70, color: 0xff55ee, emis: 0x992288 },
};
let currentStudent = null;

// ─── 進度（與全站一致）───────────────────────────────────────────────────────
const todayStr = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const getProgress = s => { const raw = localStorage.getItem("kidsProgress." + s); const p = raw ? JSON.parse(raw) : { wrongCounts: {}, sessions: 0, totalCorrect: 0, totalWrong: 0 }; if (!p.coins) p.coins = { balance: 0, lifetimeEarned: 0, lifetimeSpent: 0, transactions: [], claimedDrills: {} }; return p; };
const saveProgress = (s, p) => localStorage.setItem("kidsProgress." + s, JSON.stringify(p));

// ─── 單字（本週優先）＋ 發音（Web Audio 預解碼）───────────────────────────────
let WORDS = [], order = [], oi = -1, cur = null, li = 0, combo = 0;
async function loadWords() {
  let csv = [];
  try {
    const res = await fetch("./words.csv", { cache: "no-store" });
    csv = (await res.text()).split(/\r?\n/).filter(l => l.includes(",")).map(l => { const i = l.indexOf(","); return { en: l.slice(0, i).trim().toLowerCase(), zh: l.slice(i + 1).trim() }; }).filter(w => /^[a-z]{2,}$/.test(w.en));
  } catch (e) {}
  let week = [];
  try { week = vocabWeekForDate(todayStr()).week.words.map(w => ({ en: String(w.en).toLowerCase(), zh: w.zh })).filter(w => /^[a-z]+$/.test(w.en)); } catch (e) {}
  const have = new Set(week.map(w => w.en));
  WORDS = week.concat(csv.filter(w => !have.has(w.en)));
  const shuf = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  order = shuf(week.map((_, i) => i)).concat(shuf(WORDS.slice(week.length).map((_, i) => i + week.length)));
}
let actx = null; const bufs = {};
const akey = en => (typeof wordAudioKey === "function") ? wordAudioKey(en) : en.replace(/[^a-z0-9]+/g, "");
function ctx() { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (actx && actx.state === "suspended") actx.resume().catch(() => {}); return actx; }
function loadBuf(k) { if (bufs[k] !== undefined || !ctx()) return; bufs[k] = "l"; fetch("../kids/audio/words/" + k + ".mp3").then(r => r.ok ? r.arrayBuffer() : Promise.reject()).then(ab => ctx().decodeAudioData(ab, b => { bufs[k] = b; }, () => { bufs[k] = "f"; })).catch(() => { bufs[k] = "f"; }); }
function prewarm() { for (let n = 0; n <= 10; n++) { const w = WORDS[order[(oi + n) % order.length]]; if (w) loadBuf(akey(w.en)); } }
function sayCurrent() {
  if (!cur) return; const k = akey(cur.en), b = bufs[k];
  if (b && b !== "l" && b !== "f") { const s = ctx().createBufferSource(); s.buffer = b; s.connect(ctx().destination); s.start(0); }
  else if (b === "f" && window.speechSynthesis) { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(cur.en); u.lang = "en-US"; u.rate = .9; speechSynthesis.speak(u); }
  else loadBuf(k);
}
function nextWord() { oi = (oi + 1) % order.length; cur = WORDS[order[oi]]; li = 0; document.getElementById("wordZh").textContent = cur.zh; renderLetters(); sayCurrent(); }
function renderLetters(err) {
  document.getElementById("wordLetters").innerHTML = cur.en.split("").map((ch, i) => `<div class="lb ${i < li ? "done" : i === li ? ("cur" + (err ? " err" : "")) : ""}">${ch}</div>`).join("");
  highlightKey(li < cur.en.length ? cur.en[li] : null);
}
window.sayCurrent = sayCurrent;

// ─── 指位鍵盤 ────────────────────────────────────────────────────────────────
const FINGER_MAP = { q:"pinky",a:"pinky",z:"pinky", w:"ring",s:"ring",x:"ring", e:"middle",d:"middle",c:"middle",
  r:"l-index",f:"l-index",v:"l-index", t:"l-index",g:"l-index",b:"l-index",
  y:"r-index",h:"r-index",n:"r-index", u:"r-index",j:"r-index",m:"r-index",
  i:"middle",k:"middle", o:"ring",l:"ring", p:"pinky" };
(function buildKb() {
  const rows = ["qwertyuiop", "asdfghjkl", "zxcvbnm"];
  document.getElementById("kb").innerHTML = rows.map((r, ri) =>
    `<div class="kb-row"${ri === 1 ? ' style="padding-left:14px"' : ""}>` +
    r.split("").map(k => `<div class="key f-${FINGER_MAP[k]}" id="key-${k}">${k}</div>`).join("") +
    `</div>`).join("");
})();
function highlightKey(ch) {
  document.querySelectorAll(".key.hl").forEach(k => k.classList.remove("hl"));
  if (ch) { const el = document.getElementById("key-" + ch.toLowerCase()); if (el) el.classList.add("hl"); }
}

// ─── 3D 場景 + 物理 ──────────────────────────────────────────────────────────
// 檯面座標：x -4..4（寬）、z -5(後)..+4(前緣)、y 上。前緣外掉下去 = 獲得。
const canvas = document.getElementById("cv3d");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x10142b);
const camera = new THREE.PerspectiveCamera(46, canvas.width / canvas.height, 0.1, 60);
camera.position.set(0, 10.8, 11.2); camera.lookAt(0, -0.2, 0.2);
scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x2a2145, 1.1));
const dl = new THREE.DirectionalLight(0xffffff, 1.4); dl.position.set(4, 10, 6); scene.add(dl);

const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -9.8, 0) });
world.allowSleep = false;
world.broadphase = new CANNON.SAPBroadphase(world);
world.solver.iterations = 20;
world.solver.tolerance = 0.001;
const matCoin = new CANNON.Material("coin"), matTable = new CANNON.Material("table");
world.addContactMaterial(new CANNON.ContactMaterial(matCoin, matTable, { friction: 0.08, restitution: 0.02, contactEquationStiffness: 1e7, contactEquationRelaxation: 4, frictionEquationStiffness: 1e7, frictionEquationRelaxation: 4 }));
world.addContactMaterial(new CANNON.ContactMaterial(matCoin, matCoin, { friction: 0.18, restitution: 0.02, contactEquationStiffness: 1e7, contactEquationRelaxation: 4, frictionEquationStiffness: 1e7, frictionEquationRelaxation: 4 }));

function staticBox(sx, sy, sz, x, y, z, color, visible = true, rotX = 0) {
  const body = new CANNON.Body({ mass: 0, material: matTable, shape: new CANNON.Box(new CANNON.Vec3(sx / 2, sy / 2, sz / 2)), position: new CANNON.Vec3(x, y, z) });
  if (rotX) body.quaternion.setFromEuler(rotX, 0, 0);
  world.addBody(body);
  if (visible) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), new THREE.MeshStandardMaterial({ color, roughness: .85 }));
    m.position.set(x, y, z); if (rotX) m.rotation.x = rotX; scene.add(m);
  }
  return body;
}
staticBox(8, 1, 9, 0, -0.5, -0.5, 0x2c355f, true, -0.035);       // 檯面前傾 2°
staticBox(0.35, 3.4, 10.6, -4.18, 1.0, -0.2, 0x232a4e);         // 左牆
staticBox(0.35, 3.4, 10.6, 4.18, 1.0, -0.2, 0x232a4e);          // 右牆
staticBox(0.35, 6, 10.6, -4.18, 5.0, -0.2, 0, false);           // 左隱形高牆
staticBox(0.35, 6, 10.6, 4.18, 5.0, -0.2, 0, false);            // 右隱形高牆
staticBox(8.8, 3.6, 0.4, 0, 1.3, -5.2, 0x232a4e);               // 後牆
staticBox(8.8, 6, 0.4, 0, 5.6, -5.2, 0, false);                 // 後隱形高牆
// 移除隱形天花板（Codex: 天花板造成壓縮/穿透/飄浮）

// 推板（kinematic，前後滑動）
const PLATE = { minZ: -5.7, maxZ: -2.0, w: 7.94, h: 1.5, d: 7.0 };
const plateBody = new CANNON.Body({ mass: 0, type: CANNON.Body.KINEMATIC, material: matTable, shape: new CANNON.Box(new CANNON.Vec3(PLATE.w / 2, PLATE.h / 2, PLATE.d / 2)), position: new CANNON.Vec3(0, PLATE.h / 2, PLATE.minZ) });
world.addBody(plateBody);
const plateMesh = new THREE.Mesh(new THREE.BoxGeometry(PLATE.w, PLATE.h, PLATE.d),
  new THREE.MeshStandardMaterial({ color: 0x5f6cb0, metalness: .5, roughness: .35 }));
scene.add(plateMesh);

// 前緣提示條
const edge = new THREE.Mesh(new THREE.BoxGeometry(8, 0.06, 0.18), new THREE.MeshStandardMaterial({ color: 0xffd24d, emissive: 0x554400 }));
edge.position.set(0, 0.04, 4); scene.add(edge);

// ─── 硬幣 ────────────────────────────────────────────────────────────────────
const coinGeoCache = {}, coinMatCache = {};
function coinAssets(type) {
  const t = COIN_TYPES[type];
  if (!coinGeoCache[type]) coinGeoCache[type] = new THREE.CylinderGeometry(t.r, t.r, 0.16, 20);
  if (!coinMatCache[type]) coinMatCache[type] = new THREE.MeshStandardMaterial({ color: t.color, emissive: t.emis, metalness: .75, roughness: .3 });
  return { geo: coinGeoCache[type], mat: coinMatCache[type] };
}
let coins = [];   // {body, mesh, type}
function addCoin(type, x, y, z, randomSpin) {
  const t = COIN_TYPES[type];
  const body = new CANNON.Body({ mass: t.mass, material: matCoin, shape: new CANNON.Cylinder(t.r, t.r, 0.16, 12), position: new CANNON.Vec3(x, y, z), allowSleep: false, linearDamping: 0.03, angularDamping: 0.35 });
  if (randomSpin) {
    body.angularVelocity.set((Math.random() - .5) * 6, (Math.random() - .5) * 4, (Math.random() - .5) * 6);
    body.velocity.set((Math.random() - .5) * 1.2, 0, (Math.random() - .2) * 0.8);
  }
  world.addBody(body);
  const a = coinAssets(type);
  const mesh = new THREE.Mesh(a.geo, type === "rainbow" ? a.mat.clone() : a.mat);
  scene.add(mesh);
  coins.push({ body, mesh, type });
}
function dropCoin(type) {
  if (coins.length >= MAX_COINS) compress(true);
  const x = (Math.random() - .5) * 6.4;
  const ff = plateBody.position.z + PLATE.d / 2;
  addCoin(type, x, 3.4 + Math.random() * 0.8, ff - 1.5 + Math.random() * 1.2, true);
}
// 自動合成：檯面太滿時，後排 3 枚金幣 → 1 枚藍鑽幣（價值 3=3 守恆，清出空間）
function compress(force) {
  const LIMIT = 100;
  if (!force && coins.length <= LIMIT) return;
  while (coins.length > (force ? MAX_COINS - 3 : LIMIT)) {
    const golds = coins.filter(c => c.type === "gold").sort((a, b) => a.body.position.z - b.body.position.z).slice(0, 3);
    if (golds.length < 3) break;
    const pos = golds[0].body.position.clone();
    golds.forEach(gc => { world.removeBody(gc.body); scene.remove(gc.mesh); coins.splice(coins.indexOf(gc), 1); });
    addCoin("silver", pos.x, pos.y + 0.6, Math.max(pos.z, PLATE.maxZ + PLATE.d / 2 + 0.8), false);
    showTray("🪙×3 → 💠 自動合成！");
  }
}
function seed(n) { for (let i = 0; i < n; i++) addCoin("gold", (Math.random() - .5) * 6.8, 0.35 + Math.random() * 1.2, 0.9 + Math.random() * 2.8, false); }

// ─── 掉落 → 換金幣 ───────────────────────────────────────────────────────────
let fallTokens = 0, sessionTokens = 0, trayTimer = null;
function showTray(msg) { const el = document.getElementById("tray"); el.textContent = msg; clearTimeout(trayTimer); trayTimer = setTimeout(() => el.textContent = "", 1700); }
function dailyRec() {
  const all = JSON.parse(localStorage.getItem("kidsPusherDaily." + currentStudent) || "{}");
  const t = todayStr();
  if (!all[t]) all[t] = { attempts: [], credited: 0 };
  return { all, rec: all[t] };
}
function saveDaily(all) { localStorage.setItem("kidsPusherDaily." + currentStudent, JSON.stringify(all)); }
function updateStats() {
  const p = getProgress(currentStudent);
  document.getElementById("stCoin").textContent = p.coins.balance;
  document.getElementById("stFall").textContent = fallTokens;
  document.getElementById("stSession").textContent = sessionTokens;
  const { rec } = dailyRec();
  document.getElementById("stTries").textContent = "正式 " + rec.attempts.length + "/3";
}
function creditCoin(n) {
  if (n <= 0) return;
  const p = getProgress(currentStudent);
  p.coins.balance += n; p.coins.lifetimeEarned += n;
  p.coins.transactions.push({ type: "earn", source: "typingPusher", amount: n, balanceAfter: p.coins.balance, createdAt: new Date().toISOString(), meta: { date: todayStr(), game: "pusher3d" } });
  saveProgress(currentStudent, p);
  if (typeof cloudSave === "function") cloudSave(currentStudent);
  updateStats(); showTray("🪙 +" + n + "！");
}
function onFall(type) {
  const v = COIN_TYPES[type].value;
  fallTokens += v;
  if (running && !paused) sessionTokens += v;   // 只有進行中的局才計入本局
  if (type !== "gold") showTray((type === "rainbow" ? "🌈 彩虹幣" : "💠 藍鑽幣") + " +" + v + " 代幣！");
  updateStats();
}

// ─── 物理迴圈 ────────────────────────────────────────────────────────────────
let t = 0, lastStepTime = performance.now();
function stepWorld() {
  t++;
  const now = performance.now();
  const dt = Math.min((now - lastStepTime) / 1000, 0.1);
  lastStepTime = now;
  // 推板：正弦運動（速度 clamp 防暴力彈射）
  const w = 0.030;
  const targetZ = PLATE.minZ + (PLATE.maxZ - PLATE.minZ) * (0.5 + 0.5 * Math.sin(t * w));
  const err = targetZ - plateBody.position.z;
  plateBody.velocity.set(0, 0, Math.max(-2.4, Math.min(2.0, err * 18)));
  // 向前輔助力（防死堆，模擬微傾斜）
  for (const c of coins) {
    const p = c.body.position;
    if (p.y < 1.2 && p.z > -1.5 && p.z < 4.5) {
      c.body.applyForce(new CANNON.Vec3(0, 0, 0.35 * c.body.mass), p);
    }
  }
  world.step(1 / 60, dt, 8);
  plateMesh.position.copy(plateBody.position);
  plateMesh.quaternion.copy(plateBody.quaternion);
  // 掉落偵測 + 彩虹幣閃色
  for (let i = coins.length - 1; i >= 0; i--) {
    const c = coins[i];
    c.mesh.position.copy(c.body.position);
    c.mesh.quaternion.copy(c.body.quaternion);
    if (c.type === "rainbow") c.mesh.material.color.setHSL((t * 0.01 + i * 0.13) % 1, 0.75, 0.62);
    if (c.body.position.y < -3 || c.body.position.z > 5.6) {
      onFall(c.type);   // 掉出檯面都算得分
      world.removeBody(c.body); scene.remove(c.mesh);
      coins.splice(i, 1);
    }
  }
  renderer.render(scene, camera);
  if (++saveTick % 240 === 0) { compress(false); saveMachine(); }
  requestAnimationFrame(stepWorld);
}
let _looping = false, saveTick = 0;
function startLoop() { if (_looping) return; _looping = true; stepWorld(); }

// ─── 檯面保存 ────────────────────────────────────────────────────────────────
function saveMachine() { try { localStorage.setItem("kidsPusher3d." + currentStudent, JSON.stringify({ c: coins.map(c => [c.type[0], +c.body.position.x.toFixed(2), +c.body.position.z.toFixed(2)]), fall: fallTokens })); } catch (e) {} }
function loadMachine() {
  try {
    const d = JSON.parse(localStorage.getItem("kidsPusher3d." + currentStudent) || "null");
    if (d && d.c && d.c.length) {
      const tp = { g: "gold", s: "silver", r: "rainbow" };
      const safeZ = PLATE.maxZ + PLATE.d / 2 + 0.7;
      d.c.slice(0, MAX_COINS).forEach((a, i) => addCoin(tp[a[0]] || "gold", a[1], 0.3 + (i % 5) * 0.34, Math.max(a[2], safeZ), false));
      fallTokens = d.fall || 0; return;
    }
  } catch (e) {}
  seed(SEED_COINS);
}

// ─── 一局 3 分鐘：每天 3 次正式（取掉落最多的一次換幣），試玩不限 ─────────────
const SESSION_SEC = 180;
let mode = null, running = false, paused = false, counting = false, timeLeft = SESSION_SEC, timerIv = null;
function fmtTime(s) { return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
function setBtns() {
  const pr = document.getElementById("practiceBtn"), of = document.getElementById("officialBtn"), pz = document.getElementById("pauseBtn");
  const { rec } = dailyRec();
  of.innerHTML = "🏆 正式<br>(" + rec.attempts.length + "/3)";
  const noMore = rec.attempts.length >= 3;
  const busy = running || counting;
  of.disabled = busy || noMore; of.style.opacity = (busy || noMore) ? ".45" : "1";
  pr.disabled = busy; pr.style.opacity = busy ? ".45" : "1";
  pz.style.display = running ? "inline-block" : "none";
  pz.textContent = paused ? "▶ 繼續" : "⏸ 暫停";
  pz.style.background = paused ? "var(--green)" : "var(--danger)";
}
function tick() {
  timeLeft--;
  const el = document.getElementById("stTime");
  el.textContent = fmtTime(timeLeft);
  el.style.color = timeLeft <= 30 ? "var(--danger)" : "";
  if (timeLeft <= 0) endSession();
}
window.startSession = function (m) {
  if (running || counting) return;
  const { rec } = dailyRec();
  if (m === "official" && rec.attempts.length >= 3) { showTray("今天 3 次正式用完了，玩 🎮 試玩吧！"); return; }
  mode = m; counting = true; sessionTokens = 0; timeLeft = SESSION_SEC;
  document.getElementById("stTime").textContent = fmtTime(timeLeft);
  document.getElementById("stTime").style.color = "";
  setBtns(); updateStats();
  showTray(m === "official" ? "🏆 正式挑戰" : "🎮 試玩");
  // 3 秒倒數後才開始
  const cd = document.getElementById("cd");
  let n = 3;
  cd.style.display = "flex"; cd.textContent = n;
  const iv = setInterval(() => {
    n--;
    if (n > 0) { cd.textContent = n; return; }
    clearInterval(iv);
    cd.textContent = "GO!";
    setTimeout(() => { cd.style.display = "none"; }, 500);
    counting = false; running = true; paused = false;
    clearInterval(timerIv); timerIv = setInterval(tick, 1000);
    setBtns();
    document.getElementById("mobileInput").focus({ preventScroll: true });
  }, 1000);
};
window.togglePause = function () {
  if (!running) return;
  paused = !paused;
  if (paused) clearInterval(timerIv);
  else { clearInterval(timerIv); timerIv = setInterval(tick, 1000); }
  setBtns();
};
function endSession() {
  clearInterval(timerIv); running = false; paused = false;
  let msg = "本局掉落 <b style=\"color:var(--gold)\">" + sessionTokens + "</b> 代幣<br>";
  if (mode === "official") {
    const { all, rec } = dailyRec();
    rec.attempts.push(sessionTokens);
    const best = Math.max.apply(null, rec.attempts);
    const target = Math.floor(best / TOKENS_PER_COIN);
    const delta = target - (rec.credited || 0);
    if (delta > 0) { rec.credited = target; creditCoin(delta); }
    saveDaily(all);
    msg += "今日最佳 " + best + " 代幣 → 換到 " + (rec.credited || 0) + " 🪙" + (delta > 0 ? "（+" + delta + "）" : "（沒破今日紀錄）") + "<br>正式次數 " + rec.attempts.length + "/3";
  } else {
    msg += "（試玩不計獎勵，正式挑戰才換金幣）";
  }
  document.getElementById("overStats").innerHTML = msg;
  document.getElementById("overEl").style.display = "flex";
  setBtns(); updateStats(); saveMachine();
}
window.closeOver = function () {
  document.getElementById("overEl").style.display = "none";
  document.getElementById("stTime").textContent = fmtTime(SESSION_SEC);
  setBtns();
};
window.resetMachine = function () {
  if (!confirm("要把機台清空重來嗎？（檯面代幣會消失，重新放 40 枚；已換到的金幣不受影響）")) return;
  for (const c of coins) { world.removeBody(c.body); scene.remove(c.mesh); }
  coins = [];
  seed(SEED_COINS);
  saveMachine(); showTray("♻️ 機台重置完成！");
};

// ─── 打字 ────────────────────────────────────────────────────────────────────
function setCombo(note) { document.getElementById("combo").textContent = "🔥 連擊 " + combo + (note || ""); }
function onKey(ch) {
  if (!cur) return;
  if (counting) return;                                          // 倒數中不吃鍵
  if (!running) { window.startSession("practice"); return; }     // 沒開局就打字 → 自動開試玩（倒數後開始）
  if (paused) return;                                            // 暫停中不吃鍵
  ch = ch.toLowerCase();
  if (!/^[a-z]$/.test(ch)) return;
  ctx();
  if (ch === cur.en[li]) {
    li++; combo++;
    let type = "gold", note = "";
    if (combo % 10 === 0) { type = "rainbow"; note = "　🌈 彩虹幣！"; }
    else if (combo % 5 === 0) { type = "silver"; note = "　💠 藍鑽幣！"; }
    dropCoin(type);
    setCombo(note);
    if (li >= cur.en.length) { setTimeout(nextWord, 200); prewarm(); }
    else renderLetters();
  } else {
    combo = 0; setCombo();
    renderLetters(true);
  }
}
// 注意：mobileInput 聚焦時鍵盤字元會觸發 keydown「和」input 兩個事件，只能取一條路，
// 否則同一鍵被判兩次（第二次必錯 → 連擊永遠歸零）。
document.addEventListener("keydown", e => { if (e.target && e.target.id === "mobileInput") return; if (e.key.length === 1) onKey(e.key); });
const mi = document.getElementById("mobileInput");
canvas.addEventListener("click", () => { mi.style.pointerEvents = "auto"; mi.focus({ preventScroll: true }); });
mi.addEventListener("input", () => { const v = mi.value; mi.value = ""; if (v) onKey(v.slice(-1)); });

// ─── 啟動 ────────────────────────────────────────────────────────────────────
window.selectStudent = async function (name) {
  if (typeof requireUnlock === "function" && !requireUnlock(name)) return;
  currentStudent = name;
  localStorage.setItem("kidsCurrentStudent", name);
  document.getElementById("pickMsg").style.display = "none";
  document.getElementById("game").style.display = "flex";
  await loadWords();
  loadMachine();
  updateStats();
  nextWord(); prewarm();
  setCombo();
  setBtns();
  startLoop();
  window.addEventListener("beforeunload", saveMachine);
};
if (!window.sbClient) { const last = localStorage.getItem("kidsCurrentStudent"); if (last) window.selectStudent(last); }
</script>
